  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

  // ---------- filters ----------
  const filt = { cats: new Set(ALL_CATS), prioOnly: false, wantOnly: false, now: false, q: '' };
  const tagsOf = (p) => Array.isArray(p.tags) ? p.tags : [];
  const catMatch = (p) => { const t = tagsOf(p); return t.length ? t.some(x => filt.cats.has(x)) : filt.cats.has('other'); };
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : null; };
  function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  function runningNow(p) {
    const s = toMin(p.start); if (s == null) return p.kind === 'Appearance';

  }
  function visible(p) {

    if (filt.now && !runningNow(p)) return false;
    if (filt.q) { const q = filt.q.toLowerCase(); if (!(p.title + p.perf + p.stage).toLowerCase().includes(q)) return false; }

  }

  // ---------- geometry ----------
  const ptsOf = (r) => r.map(p => p.join(',')).join(' ');
  const bbox = (() => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; D.floorPolys.forEach(poly => poly.forEach(r => r.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }))); return { x0, y0, x1, y1 }; })();
  const base = $('base');
  let html = '';

    .forEach(([s, i]) => { html += `<polygon class="st-${s.k}${s.c ? ' cl' : ''}${s.L ? ' lg' : ''}" data-si="${i}" points="${ptsOf(s.r)}"/>`; });
  base.innerHTML = html;
  const clustersG = $('clusters');
  const CL = Object.fromEntries(D.clusters.map(c => [c.id, c]));
  clustersG.innerHTML = D.clusters.map(c => {
    const [x0, y0, x1, y1] = c.bbox; const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return `<polygon class="cl-region" data-cluster="${c.id}" points="${ptsOf(c.region)}"/><text class="cl-label" data-cluster="${c.id}" x="${cx}" y="${cy}"><tspan x="${cx}">${esc(c.name)}</tspan><tspan class="n" x="${cx}" dy="1.15em">${c.n}区画 · タップで中身</tspan></text>`;
  }).join('');
  const labels = $('labels');
  labels.innerHTML = D.halls.map(h => `<text class="hall-num" x="${h.x}" y="${h.y}" font-size="34">${+h.h}</text>`).join('') +
    D.labels.filter(l => !D.clusters.some(c => c.name === l.t || l.t.replace('インディ', 'インディー') === c.name)).map(l => `<text class="area-label" x="${l.x}" y="${l.y}" font-size="7">${esc(l.t)}</text>`).join('');
  const boothLabels = $('boothLabels');
  boothLabels.innerHTML = D.booths.filter(b => !b.c).map(b => `<g><circle class="booth-dot" cx="${b.x}" cy="${b.y}" r=".9"/>${b.size === 'L' ? '' : `<text class="booth-label" x="${b.x}" y="${b.y - 2}" font-size="2.6">${esc(short(b.t))}</text>`}<text class="booth-num" x="${b.x}" y="${b.y + 4.6}" font-size="2.4">${b.b}</text></g>`).join('');
  const lgLabels = $('lgLabels');
  lgLabels.innerHTML = D.booths.filter(b => b.size === 'L').map(b => `<text class="lg-label" x="${b.x}" y="${b.y}" font-size="5">${esc(short(b.t, 10))}</text>`).join('');
  function short(t, n = 14) { return t.length > n ? t.slice(0, n - 1) + '…' : t; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  const boothByNum = Object.fromEntries(D.booths.map(b => [b.b, b]));

  // ---------- pan / zoom (main map and cluster inset share this) ----------
  function panZoom(svgEl, viewEl, o) {
    const st = { k: 1, tx: 0, ty: 0, touched: false };
    function apply() { viewEl.setAttribute('transform', `matrix(${st.k} 0 0 ${st.k} ${st.tx} ${st.ty})`); if (o.onApply) o.onApply(st); }
    function fit(bb, pad = 24) { const W = svgEl.clientWidth, H = svgEl.clientHeight; const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0; st.k = Math.min((W - pad * 2) / w, (H - pad * 2) / h); st.tx = (W - w * st.k) / 2 - bb.x0 * st.k; st.ty = (H - h * st.k) / 2 - bb.y0 * st.k; apply(); }
    function zoomAt(px, py, f) { const nk = Math.max(o.min, Math.min(o.max, st.k * f)); f = nk / st.k; st.tx = px - f * (px - st.tx); st.ty = py - f * (py - st.ty); st.k = nk; apply(); }
    function centerOn(x, y, zoom, dy = 0) { const W = svgEl.clientWidth, H = svgEl.clientHeight; if (zoom) st.k = zoom; st.tx = W / 2 - x * st.k; st.ty = H / 2 - y * st.k - dy; apply(); }
    const ptrs = new Map(); let lastMid = null, lastDist = null, moved = false, pressed = null;
    svgEl.addEventListener('pointerdown', e => { st.touched = true; pressed = e.target.closest ? e.target.closest(o.tapSel) : null; svgEl.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false; lastMid = null; lastDist = null; svgEl.classList.add('dragging'); });
    svgEl.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const p = [...ptrs.values()];
      if (p.length === 1) { const [x, y] = p[0]; if (lastMid) { const dx = x - lastMid[0], dy = y - lastMid[1]; if (Math.abs(dx) + Math.abs(dy) > 2) moved = true; st.tx += dx; st.ty += dy; apply(); } lastMid = [x, y]; }
      else if (p.length >= 2) {
        const mid = [(p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2]; const dist = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
        if (lastMid && lastDist) { st.tx += mid[0] - lastMid[0]; st.ty += mid[1] - lastMid[1]; zoomAt(mid[0], mid[1], dist / lastDist); moved = true; }

    svgEl.addEventListener('pointerup', up); svgEl.addEventListener('pointercancel', up);

    return { st, apply, fit, zoomAt, centerOn };
  }
  const M = panZoom(svg, view, {
    min: 0.3, max: 40, tapSel: '.marker, .cl-region',
    onApply(st) {

      const fs = Math.min(11, Math.max(4.5, 9 / k));

  });
  const kOf = () => M.st.k;
  function fit() { M.fit(bbox); }
  function centerOn(x, y, zoom) { M.centerOn(x, y, zoom, (sheetOpen || cpanelOpen) && window.innerWidth < 720 ? svg.clientHeight * 0.22 : 0); }
  window.addEventListener('resize', () => M.st.touched ? M.apply() : fit());

  // ---------- markers (one per booth) ----------
  const groups = new Map();
  D.pins.forEach(p => { if (p.x == null) return; const key = `${p.x},${p.y}`; if (!groups.has(key)) groups.set(key, { x: p.x, y: p.y, booth: p.booth, pins: [] }); groups.get(key).pins.push(p); });
  const boothTitle = (g) => { const b = D.booths.find(b => b.x === g.x && b.y === g.y); return b ? b.t : (g.booth || ''); };
  groups.forEach(g => { g.pins.sort((a, b) => (toMin(a.start) ?? 9999) - (toMin(b.start) ?? 9999)); g.title = boothTitle(g); });
  const markersG = $('markers');
  let selected = null, sheetOpen = false;
  function renderMarkers() {
    const k = kOf(), s = 1 / k; let out = '';

      const vis = g.pins.filter(visible);

  function markerHtml(g, pins, s, dim, k) {
    const kinds = new Set(); pins.forEach(p => tagsOf(p).forEach(t => kinds.add(t)));
    const cat = kinds.size >= 2 ? 'multi' : kinds.size === 1 ? [...kinds][0] : 'other';
    const top = pins.some(p => p.prio === 'A') ? 'A' : pins.some(p => p.prio === 'B') ? 'B' : 'C';
    const r = (top === 'A' ? 11 : top === 'B' ? 9 : 7) * s;
    const wn = pins.some(p => wantSet('nakada').has(p.id)), wh = pins.some(p => wantSet('hachiya').has(p.id));
    const key = `${g.x},${g.y}`;

    if (wh) ring += `<circle class="want" cx="${g.x}" cy="${g.y}" r="${r + (wn ? 8 : 4) * s}" fill="none" stroke="var(--hachiya)" stroke-width="${3.2 * s}"/>`;

    return `<g class="marker${dim ? ' dim' : ''}${selected === key ? ' sel' : ''}" data-key="${key}">${ring}<circle class="core" cx="${g.x}" cy="${g.y}" r="${r}" fill="${CAT_COLOR[cat]}"/><text x="${g.x}" y="${g.y + r * 0.36}" font-size="${r * 1.05}">${pins.length}</text>${name}</g>`;
  }
  let hlBooth = null;
  function renderHl() { const b = hlBooth && boothByNum[hlBooth]; $('hl').innerHTML = b && !b.c ? `<circle class="hl-ring" cx="${b.x}" cy="${b.y}" r="${9 / kOf()}"/><text class="booth-label" style="display:block;fill:var(--booth-name)" x="${b.x}" y="${b.y - 12 / kOf()}" font-size="${3.4 / kOf()}">${esc(short(b.t, 12))}</text>` : ''; }

  // ---------- cluster panel ----------
  const cpanel = $('cpanel'), inset = $('inset'), insetView = $('insetView');
  let cpanelOpen = false, curCluster = null, hlInset = null, insetFitK = 1;
  const clusterBooths = (id) => D.booths.filter(b => b.c === id).sort((a, b) => a.b.localeCompare(b.b, undefined, { numeric: true }));
  const pinBooths = new Set(D.pins.map(p => p.booth));
  const I = panZoom(inset, insetView, {
    min: 0.5, max: 200, tapSel: '.bl',
    onApply(st) { const z = st.k / insetFitK; inset.classList.toggle('names', z > 1.9); insetView.querySelectorAll('.bl-num').forEach(t => t.setAttribute('font-size', Math.max(0.5, 1.9 / z))); insetView.querySelectorAll('.bl-name').forEach(t => t.setAttribute('font-size', Math.max(0.45, 1.7 / z))); $('insetHint').hidden = z > 1.9; },
    onTap(el) { hlInsetBooth(el.dataset.booth, false); },
  });
  function clusterBox(c) { const [x0, y0, x1, y1] = c.bbox; return { x0, y0, x1, y1 }; }
  function openCluster(id, booth) {
    const c = CL[id]; if (!c) return;
    if (sheetOpen) closeSheet();
    if (isPhone()) hideDrawer();
    cpanelOpen = true; curCluster = id; hlInset = null;
    $('ctabs').innerHTML = D.clusters.map(x => `<button class="tab" role="tab" data-cluster="${x.id}" aria-selected="${x.id === id}">${esc(x.short)}<small>${x.n}</small></button>`).join('') + `<div class="spacer"></div><button class="btn small" id="cpanelClose">閉じる</button>`;
    const bs = clusterBooths(id);
    insetView.innerHTML = D.structures.filter(s => s.c === id).map(s => `<polygon class="st-booth" points="${ptsOf(s.r)}"/>`).join('') +
      bs.map(b => `<g class="bl${pinBooths.has(b.b) ? ' pin' : ''}" data-booth="${b.b}"><circle cx="${b.x}" cy="${b.y}" r=".35"/><text class="bl-name" x="${b.x}" y="${b.y - .6}">${esc(short(b.t, 8))}</text><text class="bl-num" x="${b.x}" y="${b.y + 1.5}">${b.b}</text></g>`).join('');
    $('clist').innerHTML = `<div class="section-h">${esc(c.name)} · ${bs.length}区画</div>` + bs.map(b => `<div class="crow" data-booth="${b.b}"><div class="b">${b.b}</div><div><div class="t">${esc(b.t)}${pinBooths.has(b.b) ? '<span class="pin">番組あり</span>' : ''}</div>${b.g ? `<div class="g">${esc(b.g)}</div>` : ''}</div></div>`).join('');
    cpanel.classList.add('open'); syncHandle();
    clustersG.querySelectorAll('.cl-region').forEach(r => r.classList.toggle('sel', r.dataset.cluster === id));
    const fitInset = () => { I.fit(clusterBox(c), 10); insetFitK = I.st.k; I.st.touched = false; I.apply(); if (booth) hlInsetBooth(booth, true); };

  function hlInsetBooth(bn, center) {
    hlInset = bn;

    $('clist').querySelectorAll('.crow').forEach(r => { const on = r.dataset.booth === bn; r.classList.toggle('hl', on); if (on) r.scrollIntoView({ block: 'nearest' }); });
    const b = boothByNum[bn]; if (b && center) I.centerOn(b.x, b.y, Math.max(I.st.k, insetFitK * 2.6));
  }
  $('ctabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) { openCluster(t.dataset.cluster); return; } if (e.target.closest('#cpanelClose')) closeCluster(); });
  $('clist').addEventListener('click', e => { const r = e.target.closest('.crow'); if (r) hlInsetBooth(r.dataset.booth, true); });

  window.addEventListener('resize', () => { if (cpanelOpen && curCluster && !I.st.touched) { I.fit(clusterBox(CL[curCluster]), 10); insetFitK = I.st.k; I.apply(); } });

  // ---------- booth search (all exhibitors) ----------
  const hits = $('hits');
  function renderHits() {
    const q = filt.q.toLowerCase();

    const found = D.booths.filter(b => b.t.toLowerCase().includes(q) || b.b.toLowerCase().includes(q)).slice(0, 12);
    if (!found.length) { hits.classList.remove('open'); return; }
    hits.innerHTML = found.map(b => `<div class="hit" data-booth="${b.b}"><span class="b">${b.b}</span><span><div>${esc(b.t)}</div>${b.g ? `<div class="g">${esc(b.g)}</div>` : ''}</span><span class="c">${b.c ? esc(CL[b.c].short) : (pinBooths.has(b.b) ? '番組あり' : '')}</span></div>`).join('');

  $('sheetClose').addEventListener('click', closeSheet);
  function peopleHtml(p) {

      const on = wantSet(who).has(p.id); const mine = who === me;
      return `<label class="${mine ? '' : 'other'}" style="--c:${PEOPLE[who].color}"><input type="checkbox" data-pin="${p.id}" data-who="${who}" ${on ? 'checked' : ''} ${mine ? '' : 'disabled'}>${PEOPLE[who].name}</label>`;
    }).join('');

    const srcs = p.src.split(/\s*\/\s*(?=https?:)/).map(u => u.trim()).filter(Boolean).map(u => { const m = /^(https?:\/\/\S+)(.*)$/.exec(u); return m ? `<a href="${esc(m[1])}" target="_blank" rel="noopener">${esc(m[1].replace(/^https?:\/\//, '').slice(0, 40))}</a>${esc(m[2])}` : esc(u); }).join(' · ');

  function syncHandle() {
    const h = $('drawerHandle');
    // the handle would sit on top of the sheet / cluster panel, so it only shows when nothing else is up
    h.hidden = drawer.classList.contains('open') || sheetOpen || cpanelOpen;
    // phone: keep the pill clear of the hall buttons (hud), which wrap at narrow widths
    h.style.bottom = (!h.hidden && isPhone()) ? ($('hud').offsetHeight + 18) + 'px' : '';
  }
  window.addEventListener('resize', syncHandle);
  function showDrawer() {
    if (isPhone()) { if (sheetOpen) closeSheet(); if (cpanelOpen) closeCluster(); }
    drawer.classList.add('open'); syncHandle();
  }
  function hideDrawer() { drawer.classList.remove('open'); syncHandle(); }
  function openDrawer() { showDrawer(); renderDrawer(); }
  $('drawerHandle').addEventListener('click', openDrawer);
  $('drawerClose').addEventListener('click', hideDrawer);
  syncHandle();
  function condText() {
    const parts = [];
    if (filt.cats.size !== ALL_CATS.length) parts.push(ALL_CATS.filter(c => filt.cats.has(c)).map(c => CAT_LABEL[c]).join('・') || '種別なし');
    if (filt.prioOnly) parts.push('◎だけ');
    if (filt.wantOnly) parts.push('行きたいだけ');
    if (filt.now) parts.push('進行中');
    if (filt.q) parts.push(`検索「${filt.q}」`);
    return parts.length ? parts.join(' · ') : 'すべての番組';
  }
  function renderList() {
    if (!drawer.classList.contains('open') || exhMode) return;
    const vis = D.pins.filter(visible).sort((a, b) => (toMin(a.start) ?? 9999) - (toMin(b.start) ?? 9999));
    $('listCond').textContent = condText();
    $('listCount').textContent = `${vis.length}件`;
    const timed = vis.filter(p => p.start), untimed = vis.filter(p => !p.start);
    const item = (p) => `<div class="row-item" data-pin="${p.id}"><div class="time">${p.start || '—'}<small>${p.end ? '〜' + p.end : ''}</small></div><div><div class="t"><span class="prio">${prioMark(p)}</span>${esc(p.title)}</div>${peopleHtml(p)}<div class="s">${esc(p.stage)}</div></div><div class="marks"><span class="${wantSet('nakada').has(p.id) ? 'on' : ''}" style="--c:var(--nakada)"></span><span class="${wantSet('hachiya').has(p.id) ? 'on' : ''}" style="--c:var(--hachiya)"></span></div></div>`;
    $('drawerBody').innerHTML = (timed.length ? `<div class="section-h">時刻あり</div>` + timed.map(item).join('') : '') + (untimed.length ? `<div class="section-h">時刻未発表 / 終日</div>` + untimed.map(item).join('') : '') + (!vis.length ? `<p class="status">条件に合う番組がありません。</p>` : '');
  }
  $('drawerBody').addEventListener('click', e => {
    const er = e.target.closest('.erow');
    if (er) { if (isPhone()) hideDrawer(); goBooth(er.dataset.booth); return; }
    const row = e.target.closest('.row-item'); if (!row) return;
    const p = D.pins.find(x => x.id === row.dataset.pin); if (!p) return;
    if (p.x == null) return;
    if (isPhone()) hideDrawer();
    M.st.touched = true; centerOn(p.x, p.y, Math.max(kOf(), 3.2)); openSheet(`${p.x},${p.y}`);
  });

  // ---------- exhibitor mode (size / genre / platform filters, list, map tint) ----------
  const NONE = '__none__';
  const SECS = [['L', '大型', '300㎡以上'], ['M', '中型', '50〜300㎡'], ['S', '小型', '50㎡未満・密集区画を含む']];
  const sizes = new Set();
  const exf = { g: new Set(), p: new Set() };
  const sizeKey = (b) => b.size === 'L' ? 'L' : b.size === 'M' ? 'M' : 'S';
  const hallKey = (bn) => { const p = String(bn).split('-')[0]; return p === 'E' ? 99 : (parseInt(p, 10) || 98); };
  const EXH = D.booths.slice().sort((a, b) => hallKey(a.b) - hallKey(b.b) || String(a.b).localeCompare(String(b.b), 'en', { numeric: true }));
  function freqVals(key) {
    const m = new Map();
    D.booths.forEach(b => (b[key] || []).forEach(v => m.set(v, (m.get(v) || 0) + 1)));
    return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja')).map(e => e[0]);
  }
  const exfRows = [];
  function chipRow(el, vals, noneLabel, set, label) {
    el.innerHTML = `<button class="chip mini exf-tg" type="button" aria-expanded="false">${esc(label)}<span class="n" hidden></span><span class="ar">▾</span></button>` +
      vals.map(v => `<button class="chip mini" data-v="${esc(v)}" aria-pressed="false">${esc(v)}</button>`).join('') +
      `<button class="chip mini" data-v="${NONE}" aria-pressed="false">${noneLabel}</button>`;
    const tg = el.firstElementChild, chips = [...el.querySelectorAll('.chip[data-v]')];
    let open = false; // session memory only (per row)
    el.classList.add('clps');
    function order() { const sel = chips.filter(c => set.has(c.dataset.v)); el.append(tg, ...sel, ...chips.filter(c => !set.has(c.dataset.v))); }
    function sync() {
      const n = tg.querySelector('.n');
      n.textContent = set.size; n.hidden = !set.size;
      if (!open) order();
    }
    tg.addEventListener('click', () => {
      open = !open;
      el.classList.toggle('clps', !open);
      tg.setAttribute('aria-expanded', open);
      tg.querySelector('.ar').textContent = open ? '▴' : '▾';
      if (!open) order();
    });
    el.addEventListener('click', e => {
      const c = e.target.closest('.chip[data-v]'); if (!c) return;
      const v = c.dataset.v; set.has(v) ? set.delete(v) : set.add(v);
      c.setAttribute('aria-pressed', set.has(v)); sync(); exhChanged();
    });
    exfRows.push(sync);
  }
  chipRow($('genreChips'), freqVals('gs'), 'ジャンル未記載', exf.g, 'ジャンル');
  chipRow($('platChips'), freqVals('ps'), '機種未記載', exf.p, '機種');
  function measureChipLine() {
    const tg = $('genreChips').firstElementChild;
    if (tg && tg.offsetHeight) $('exhFilters').style.setProperty('--chipline', tg.offsetHeight + 'px');
  }
  $('exhClear').addEventListener('click', () => {
    exf.g.clear(); exf.p.clear(); sizes.clear();
    $('exhFilters').querySelectorAll('.chip[data-v]').forEach(c => c.setAttribute('aria-pressed', 'false'));
    syncSizeChips(); exfRows.forEach(f => f()); exhChanged();
  });
  const sizeChipsEl = $('sizeChips');
  sizeChipsEl.innerHTML = `<span class="chip mini exf-tg exf-lbl">大きさ</span>` +
    SECS.map(([k, l]) => `<button class="chip mini" data-size="${k}" aria-pressed="false">${l}<small>${D.booths.filter(b => sizeKey(b) === k).length}</small></button>`).join('');
  function syncSizeChips() { sizeChipsEl.querySelectorAll('.chip[data-size]').forEach(c => c.setAttribute('aria-pressed', sizes.has(c.dataset.size))); }
  sizeChipsEl.addEventListener('click', e => {
    const c = e.target.closest('.chip[data-size]'); if (!c) return;
    const k = c.dataset.size;
    sizes.has(k) ? sizes.delete(k) : sizes.add(k);
    c.setAttribute('aria-pressed', sizes.has(k)); exhChanged();
  });
  function exhChanged() { $('exhClearRow').hidden = !(sizes.size || exf.g.size || exf.p.size); applyExhTint(); renderDrawer(); }
  const okOne = (set, vals) => [...set].some(v => v === NONE ? !vals.length : vals.includes(v));
  function exhMatch(b) {
    if (sizes.size && !sizes.has(sizeKey(b))) return false;
    if (exf.g.size && !okOne(exf.g, b.gs || [])) return false;
    if (exf.p.size && !okOne(exf.p, b.ps || [])) return false;
    return true;
  }
  const boothPolys = [...base.querySelectorAll('.st-booth')];
  function applyExhTint() {
    if (!exhMode || (!sizes.size && !exf.g.size && !exf.p.size)) { boothPolys.forEach(p => p.classList.remove('hit', 'miss')); return; }
    const on = new Set();
    D.booths.forEach(b => { if (b.si != null && exhMatch(b)) on.add(b.si); });
    boothPolys.forEach(p => { const h = on.has(+p.dataset.si); p.classList.toggle('hit', h); p.classList.toggle('miss', !h); });
  }
  function erowHtml(b) {
    const corner = b.c ? (CL[b.c] ? CL[b.c].short : '') : (b.corner || '');
    const gs = (b.gs && b.gs.length) ? b.gs.join('・') : 'ジャンル未記載';
    const ps = (b.ps && b.ps.length) ? b.ps.join('・') : '';
    return `<div class="erow" data-booth="${esc(b.b)}"><div class="b">${esc(b.b)}</div><div><div class="t">${esc(b.t || '(社名未取得)')}${pinBooths.has(b.b) ? '<span class="pin">番組あり</span>' : ''}</div>${corner ? `<div class="c">${esc(corner)}</div>` : ''}<div class="g">${esc(gs)}</div>${ps ? `<div class="pl">${esc(ps)}</div>` : ''}</div><div class="a">${b.area != null ? b.area + '㎡' : '面積不明'}</div></div>`;
  }
  function renderExh() {
    if (!drawer.classList.contains('open') || !exhMode) return;
    const matched = EXH.filter(exhMatch);
    const shown = SECS.filter(([k]) => !sizes.size || sizes.has(k));
    const names = ['出展社']
      .concat(SECS.filter(([k]) => sizes.has(k)).map(([, l]) => l))
      .concat([...exf.g].map(v => v === NONE ? 'ジャンル未記載' : v))
      .concat([...exf.p].map(v => v === NONE ? '機種未記載' : v));
    $('listCond').textContent = names.join(' · ');
    $('listCount').textContent = `${matched.length}件`;
    $('drawerBody').innerHTML = shown.map(([k, l, hint]) => {
      const rows = matched.filter(b => sizeKey(b) === k);
      return `<div class="sech">${l}<small>${rows.length}</small><span class="ar">${esc(hint)}</span></div>` +
        `<div class="secb">${rows.length ? rows.map(erowHtml).join('') : '<p class="status">該当する出展社がありません。</p>'}</div>`;
    }).join('');
  }

  // ---------- toolbar ----------
  const catChips = [...document.querySelectorAll('.chip[data-cat]')];
  function setCats(cats) { filt.cats = new Set(cats); catChips.forEach(c => c.setAttribute('aria-pressed', filt.cats.has(c.dataset.cat))); }
  catChips.forEach(c => c.addEventListener('click', () => {
    const sole = !exhMode && filt.cats.size === 1 && filt.cats.has(c.dataset.cat);
    if (exhMode) setExhMode(false);
    setCats(sole ? ALL_CATS : [c.dataset.cat]);
    openDrawer(); refresh();
  }));
  $('exhChip').addEventListener('click', () => { showDrawer(); setExhMode(!exhMode); });
  const toggle = (id, key) => $(id).addEventListener('click', () => { if (exhMode) setExhMode(false); filt[key] = !filt[key]; $(id).setAttribute('aria-pressed', filt[key]); openDrawer(); refresh(); });
  toggle('prioChip', 'prioOnly'); toggle('wantChip', 'wantOnly'); toggle('nowChip', 'now');
  $('search').addEventListener('input', e => { filt.q = e.target.value.trim(); if (!filt.q) { hlBooth = null; renderHl(); } refresh(); renderHits(); });
  function refresh() { renderMarkers(); renderDrawer(); }
  setInterval(() => { if (filt.now) renderMarkers(); }, 60000);
  const hud = $('hud');
  hud.innerHTML = `<button class="btn small" data-fit="1">全体</button>` + D.halls.map(h => `<button class="btn small" data-hall="${h.h}">${+h.h}</button>`).join('');
  hud.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.fit) { closeSheet(); closeCluster(); hlBooth = null; M.st.touched = false; fit(); return; } M.st.touched = true; const h = D.halls.find(x => x.h === b.dataset.hall); if (h) centerOn(h.x, h.y, 3.4); });

  // ---------- who ----------
  let booted = false;
  function bootDrawer() { if (booted) return; booted = true; showDrawer(); setExhMode(true); }
  const other = (who) => who === 'nakada' ? 'hachiya' : 'nakada';
  function setWho(who) {
    state.me = who; saveLocal();
    $('whoName').textContent = PEOPLE[who].name; $('whoDot').style.background = PEOPLE[who].color;
    $('whoClose').hidden = false;
    $('whoModal').classList.remove('open');
    if (sheetOpen && selected) openSheet(selected);
    bootDrawer();
  }
  function openWho() {  // 初回(未選択)は「自分はどちら?」だけ。選択済みなら下に招待の節を出す
    const me = state.me;
    $('shareSec').hidden = !me;
    $('whoClose').hidden = !me;
    $('myCode').value = me ? myCode() : '';
    if (me) $('shareHelp').textContent = `このリンクを${PEOPLE[other(me)].name}に送ると、同じ地図で「行きたい」が自動で共有されます。`;
    $('whoModal').classList.add('open');
  }
  $('whoModal').querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => setWho(b.dataset.who)));
  $('whoBtn').addEventListener('click', openWho);
  $('whoClose').addEventListener('click', () => $('whoModal').classList.remove('open'));
  if (state.me) setWho(state.me); else openWho();

  // ---------- share code ----------
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))));
  function myCode() { return enc({ v: 1, who: state.me, ids: state.wants[state.me] || [] }); }
  function importCode(code) {
    const o = dec(code.trim()); if (!o || !PEOPLE[o.who] || !Array.isArray(o.ids)) throw new Error('bad');
    state.wants[o.who] = [...new Set(o.ids)]; saveLocal(); renderMarkers(); renderList(); if (sheetOpen && selected) openSheet(selected);
    return o;
  }
  $('copyCode').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('myCode').value); $('copyCode').textContent = 'コピーしました'; setTimeout(() => $('copyCode').textContent = 'コードをコピー', 1500); } catch (e) { $('myCode').select(); } });
  function shareUrl() { return location.href.split('#')[0] + (roomKey ? '#r=' + roomKey : ''); }
  $('copyLink').addEventListener('click', async () => { if ($('copyLink').disabled) return; const url = shareUrl(); try { await navigator.clipboard.writeText(url); $('copyLink').textContent = 'コピーしました'; setTimeout(() => $('copyLink').textContent = 'リンクをコピー', 1500); } catch (e) { $('syncStatus').textContent = url; } });
  $('importCode').addEventListener('click', () => { try { const o = importCode($('theirCode').value); $('theirCode').value = ''; $('syncStatus').textContent = `${PEOPLE[o.who].name}の「行きたい」${o.ids.length}件を取り込みました。`; } catch (e) { $('syncStatus').textContent = 'コードを読めませんでした。全体を貼り付けてください。'; } });
  const hm = /[#&]w=([A-Za-z0-9_-]+)/.exec(HASH);
  if (hm) { try { const o = importCode(hm[1]); $('syncStatus').textContent = `リンクから${PEOPLE[o.who].name}の「行きたい」を取り込みました。`; } catch (e) {} }

  // ---------- sync (Pages 版: tools/sync.js + Firebase。Artifact 版: 共有コードのみ) ----------
  const RLS = 'tgs2026-room';
  let sync = null, roomKey = null;
  function pushRemote(who) { if (sync) sync.push(who, state.wants[who] || []); }
  function applyRemote(who, ids) {
    if (!Array.isArray(ids)) return;
    ids = [...new Set(ids)];
    if (JSON.stringify(ids) === JSON.stringify(state.wants[who] || [])) return;
    state.wants[who] = ids; saveLocal();
    renderMarkers(); renderDrawer(); if (sheetOpen && selected) openSheet(selected);
  }
  function setStatus(text, live) { $('syncStatus').textContent = text; $('syncDot').hidden = !live; $('syncStatus').classList.toggle('on', !!live); }
  function setSyncAvail(on) {  // syncLive: 自動同期が使える構成か。使えないときだけ共有コードUIを出す
    $('codeShare').hidden = !!on;
    $('copyLink').disabled = !on;
    $('shareHelp').hidden = !on;
  }
  setSyncAvail(false);
  if (FB && window.SharedSync) {
    sync = window.SharedSync.start({
      config: FB,
      people: ['nakada', 'hachiya'],
      storageKey: RLS,
      hashParam: 'r',
      path: 'wants',
      hash: HASH,
      onRemote: (who, ids) => applyRemote(who, ids),
      getLocal: (who) => who === state.me ? (state.wants[who] || []) : null,  // 送るのは自分の分だけ
      onStatus: (text, live) => setStatus(text, live),
      strings: { noKey: '同期リンクで開いてください(中田から受け取ったリンク)' },
    });
    roomKey = sync.key;
    setSyncAvail(sync.live);
  } else if (FB) {
    setStatus('同期スクリプト(sync.js)を読み込めませんでした。共有コードを使ってください。', false);
  } else {
    setStatus('このページでは自動同期できません。共有コードで送り合ってください。', false);
  }


  // ---------- boot ----------
  fit();
  requestAnimationFrame(() => fit());
})();
</script>
