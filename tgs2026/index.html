<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGS2026 土曜マップ</title>
<meta name="description" content="東京ゲームショウ2026 9/19(土) 幕張メッセ。ステージと出演者を会場図に置いたマップ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --ground: #F2F3EF;
    --panel: #FBFBF9;
    --panel-2: #ECEEE9;
    --line: #CDD2CB;
    --ink: #1B201D;
    --ink-2: #4F5955;
    --ink-3: #5F6A65;
    --ink-4: #7E8883;
    --floor: #CBD0C8;
    --booth: #E4E8E2;
    --booth-line: #A9B1A7;
    --wall: #79847E;
    --outdoor: #DFE3DA;
    --wc: #C9D4E6;
    --food: #E9DCC4;
    --accent: #2D5F52;
    --accent-ink: #FFFFFF;
    --streamer: #2A6FDB;
    --cosplayer: #D0367A;
    --celebrity: #D9652B;
    --voice: #3F9A3A;
    --multi: #7A3FC7;
    --other: #8A938E;
    --nakada: #E39B00;
    --hachiya: #1FA58A;
    --shadow: 0 8px 24px rgba(20, 30, 25, .16);
    --hall-label: rgba(27, 32, 29, .55);
    --cl-fill: rgba(45, 95, 82, .10);
    --cl-line: rgba(45, 95, 82, .45);
    --cl-booth: #DFE4DD;
    --booth-lg: #D8DDD6;
    --exh-hit: rgba(45, 95, 82, .35);
    --hl: #E3542A;
    --booth-name: #C8202A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #15181A; --panel: #1E2224; --panel-2: #262B2D; --line: #3A4143;
      --ink: #E8ECE9; --ink-2: #B4BCB8; --ink-3: #949E99; --ink-4: #7E8883;
      --floor: #2C3336; --booth: #3A4246; --booth-line: #59636A; --wall: #7C878C;
      --outdoor: #1D2224; --wc: #2B3A4E; --food: #3C3526;
      --accent: #6FB8A3; --accent-ink: #0F1512;
      --streamer: #6AA0F5; --cosplayer: #F06AA6; --celebrity: #F08A55; --voice: #6CC466; --multi: #B187F0; --other: #8A938E;
      --nakada: #F2B84B; --hachiya: #4FD0B3;
      --shadow: 0 8px 24px rgba(0, 0, 0, .5); --hall-label: rgba(232, 236, 233, .5);
      --cl-fill: rgba(111, 184, 163, .14); --cl-line: rgba(111, 184, 163, .5); --cl-booth: #363D41; --hl: #FF7A50;
      --booth-lg: #454E52; --exh-hit: rgba(111, 184, 163, .35);
      --booth-name: #FF6B6B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #15181A; --panel: #1E2224; --panel-2: #262B2D; --line: #3A4143;
    --ink: #E8ECE9; --ink-2: #B4BCB8; --ink-3: #949E99; --ink-4: #7E8883;
    --floor: #2C3336; --booth: #3A4246; --booth-line: #59636A; --wall: #7C878C;
    --outdoor: #1D2224; --wc: #2B3A4E; --food: #3C3526;
    --accent: #6FB8A3; --accent-ink: #0F1512;
    --streamer: #6AA0F5; --cosplayer: #F06AA6; --celebrity: #F08A55; --voice: #6CC466; --multi: #B187F0; --other: #8A938E;
    --nakada: #F2B84B; --hachiya: #4FD0B3;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5); --hall-label: rgba(232, 236, 233, .5);
    --cl-fill: rgba(111, 184, 163, .14); --cl-line: rgba(111, 184, 163, .5); --cl-booth: #363D41; --hl: #FF7A50;
    --booth-lg: #454E52; --exh-hit: rgba(111, 184, 163, .35);
    --booth-name: #FF6B6B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; overflow: hidden;
  }
  .app { height: 100dvh; display: grid; grid-template-rows: auto auto 1fr; }
  .app > * { min-width: 0; }
  .bar { min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand h1 {
    margin: 0; font-family: "Barlow Condensed", "Zen Kaku Gothic New", sans-serif;
    font-weight: 700; font-size: 22px; letter-spacing: .01em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis;
  }
  .brand .sub { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .btn {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.small { padding: 3px 9px; font-size: 12px; }
  .who { font-weight: 700; }
  .who .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .who .sdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); margin-left: 2px; }
  .who .sdot[hidden] { display: none; }
  .tools { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .tools::-webkit-scrollbar { display: none; }
  .lb-x { display: inline; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
    border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px;
  }
  #exhChip[aria-pressed="false"] { font-weight: 700; color: var(--ink); border-color: var(--ink-3); }
  .chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip[hidden] { display: none; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .chip[aria-pressed="true"] .sw { outline: 2px solid var(--ground); }
  .search { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; min-width: 120px; }
  .iconbtn { width: 44px; min-width: 44px; height: 44px; padding: 0; justify-content: center; font-size: 17px; line-height: 1; }
  #searchBtn, #searchClose { display: none; }
  #searchBtn[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .stage { position: relative; min-height: 0; touch-action: none; }
  svg.map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: var(--ground); }
  #bgHit { fill: transparent; pointer-events: all; }
  svg.map.dragging { cursor: grabbing; }
  .floor { fill: var(--floor); stroke: var(--wall); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .st-booth { fill: var(--booth); stroke: var(--booth-line); stroke-width: .3; }
  .st-wall { fill: none; stroke: var(--wall); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .st-floor { fill: var(--floor); stroke: none; }
  .st-outdoor { fill: var(--outdoor); stroke: none; }
  .st-wc { fill: var(--wc); stroke: none; }
  .st-food { fill: var(--food); stroke: none; }
  .hall-num { font-family: "Barlow Condensed", sans-serif; font-weight: 700; fill: var(--hall-label); text-anchor: middle; pointer-events: none; }
  .area-label { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 500; fill: var(--ink-2); text-anchor: middle; pointer-events: none; }
  .booth-label { display: none; font-family: "Zen Kaku Gothic New", sans-serif; fill: var(--booth-name); text-anchor: middle; pointer-events: none; font-size: var(--fs-name, 2.6px); }
  .booth-num { font-family: "Barlow Condensed", sans-serif; font-weight: 600; fill: var(--ink-2); text-anchor: middle; pointer-events: none; font-size: var(--fs-num, 2.4px); }
  .booth-dot { fill: var(--booth-line); }
  #boothLabels.names .booth-label { display: block; }
  .marker { cursor: pointer; }
  .marker circle.core { stroke: var(--panel); stroke-width: 1.6px; vector-effect: non-scaling-stroke; }
  .marker.dim { opacity: .28; }
  .marker.sel circle.core { stroke: var(--ink); }
  .marker text { font-family: "Barlow Condensed", sans-serif; font-weight: 700; fill: #fff; text-anchor: middle; pointer-events: none; }
  .marker .want { stroke: var(--panel); stroke-width: 1px; vector-effect: non-scaling-stroke; }
  .st-booth.cl { fill: var(--cl-booth); stroke: none; }
  .st-booth.lg { fill: var(--booth-lg); }
  .st-booth.miss { opacity: .35; }
  .st-booth.hit { fill: var(--exh-hit); opacity: 1; }
  .lg-label { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; fill: var(--booth-name); text-anchor: middle; pointer-events: none; font-size: var(--fs-lg, 5px); paint-order: stroke; stroke: var(--floor); stroke-width: .22em; stroke-linejoin: round; }
  /* Cluster(密集区画): 引いているときは破線の枠 + 「一覧 ›」ピル。寄ると個々の区画になる */
  .cl-region { fill: var(--cl-fill); stroke: var(--cl-line); stroke-width: 1.6px; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; cursor: pointer; }
  .cl-region.sel { stroke: var(--accent); stroke-width: 2.6px; stroke-dasharray: none; }
  .cl-g text { text-anchor: middle; }
  .cl-g .nm { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 13px; fill: var(--accent); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .cl-g .n { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 12px; fill: var(--ink-2); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
  .cl-pill { cursor: pointer; }
  .cl-pill .sh { fill: rgba(20, 30, 25, .18); }
  .cl-pill .bg { fill: var(--panel); stroke: var(--line); stroke-width: 1px; }
  .cl-pill .lb { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 14px; fill: var(--ink); }
  .clb { cursor: pointer; }
  .clb .tz { fill: transparent; r: var(--tz, 1.6px); }
  .clb .nu { font-family: "Barlow Condensed", sans-serif; font-weight: 600; fill: var(--ink-2); text-anchor: middle; pointer-events: none; font-size: var(--fs-num, 2.4px); }
  .clb .nm { font-family: "Zen Kaku Gothic New", sans-serif; fill: var(--booth-name); text-anchor: middle; pointer-events: none; font-size: var(--fs-name, 2.6px); }
  .exw-fill { stroke: none; opacity: .55; }
  .exw-ring { fill: none; stroke-width: 2.4px; vector-effect: non-scaling-stroke; }
  .hl-ring { fill: none; stroke: var(--hl); stroke-width: 3px; vector-effect: non-scaling-stroke; pointer-events: none; }
  .hits { position: absolute; left: 16px; right: 16px; top: 8px; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 46%; overflow: auto; display: none; }
  .hits.open { display: block; }
  .hit { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .hit:last-child { border-bottom: none; }
  .hit .b { font-family: "Barlow Condensed", sans-serif; font-weight: 600; color: var(--ink-3); }
  .hit .c { font-size: 12px; color: var(--accent); white-space: nowrap; }
  .hit .g { font-size: 12px; color: var(--ink-3); }
  .cpanel { position: absolute; right: 0; bottom: 0; left: 0; height: 52%; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .22s ease; display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
  .cpanel.open { transform: translate(0, 0); }
  .cpanel header { display: block; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); position: relative; }
  .cpanel header .hrow { display: flex; align-items: center; gap: 6px; }
  #cpanelTitle { font-weight: 700; max-width: 100%; overflow: hidden; }
  #cpanelTitle .cn { font-family: "Barlow Condensed", sans-serif; color: var(--ink-3); font-weight: 600; }
  .cmenu { position: absolute; left: 12px; top: calc(100% - 6px); z-index: 8; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 4px; min-width: 220px; }
  .cmenu[hidden] { display: none; }
  .cmenu button { appearance: none; border: none; background: none; color: var(--ink); font: inherit; font-size: 14px; text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; }
  .cmenu button[aria-current="true"] { background: var(--panel-2); font-weight: 700; }
  .cmenu button small { font-family: "Barlow Condensed", sans-serif; color: var(--ink-3); margin-left: auto; }
  .cpanel .csearch { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .cpanel .csearch .search { width: 100%; }
  .cpanel .list { overflow: auto; padding: 0 12px 12px; }
  #cpanelClose .ch { display: none; }
  @media (pointer: coarse), (max-width: 720px) {
    .cpanel header .hrow { display: grid; gap: 6px; }
    #cpanelClose { width: 100%; min-height: 44px; justify-content: center; border-radius: 10px; background: var(--panel-2); font-weight: 700; order: -1; }
    #cpanelClose .ch { display: inline; }
    #cpanelTitle { min-height: 44px; }
  }
  .crow { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; padding: 7px 4px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; border-radius: 6px; }
  .crow > div { min-width: 0; }
  .crow .t { overflow-wrap: anywhere; }
  .crow .b { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 15px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .crow .t { font-weight: 500; font-size: 14px; }
  .crow .g { font-size: 12px; color: var(--ink-3); }
  .crow.hl { background: color-mix(in srgb, var(--hl) 14%, transparent); }
  @media (min-width: 720px) {
    .cpanel { left: auto; top: 0; width: min(36%, 460px); height: auto; border-radius: 0; border-top: none; border-left: 1px solid var(--line); transform: translateX(105%); grid-template-rows: auto auto minmax(0, 1fr); }
    .cpanel.open { transform: translate(0, 0); }
  }
  .hud { position: absolute; left: 16px; bottom: 16px; z-index: 0; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 32px); }
  .hud .btn { box-shadow: var(--shadow); }
  .legend { position: absolute; right: 16px; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; box-shadow: var(--shadow); pointer-events: none; }
  .legend .row { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .legend .ring { width: 10px; height: 10px; border-radius: 50%; border: 3px solid var(--c); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 62%;
    background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    box-shadow: var(--shadow); transform: translateY(105%); transition: transform .22s ease;
    display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); overflow: hidden;
  }
  .sheet > * { min-width: 0; }
  .sheet.open { transform: translateY(0); }
  .sheet:not(.open), .drawer:not(.open), .cpanel:not(.open) { pointer-events: none; }
  .sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); min-width: 0; overflow: hidden; }
  .sheet header h2 { margin: 0; font-size: 16px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet header .booth { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 15px; color: var(--ink-3); letter-spacing: .02em; }
  .sheet .body { overflow: auto; padding: 4px 16px 16px; }
  .prog { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .prog > div { min-width: 0; }
  .prog .t { overflow-wrap: anywhere; }
  .prog:last-child { border-bottom: none; }
  .prog .time { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .prog .time small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .prog .t { font-weight: 700; }
  .prog .p { color: var(--ink-2); font-size: 13px; }
  .prog .w { color: var(--ink-3); font-size: 12px; }
  .prog .src a { color: var(--accent); font-size: 12px; word-break: break-all; }
  /* 色地に白文字は読めないので、薄い色地 + 同系の濃い文字にする(両テーマで 4.5:1 以上) */
  .tag, .crow .pin, .erow .pin {
    display: inline-block; font-size: 12px; line-height: 1.35; padding: 0 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--c) 16%, var(--panel));
    color: color-mix(in srgb, var(--c) 60%, var(--ink));
    border: 1px solid color-mix(in srgb, var(--c) 40%, var(--panel));
    font-weight: 700; vertical-align: 1px;
  }
  .tag { margin-right: 4px; }
  .crow .pin, .erow .pin { --c: var(--streamer); margin-left: 6px; }
  .ppl { font-size: 12px; color: var(--ink-2); line-height: 1.6; overflow-wrap: anywhere; word-break: normal; }
  .ppl .pp { white-space: normal; }
  .ppl .d { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 3px; vertical-align: 1px; }
  .ppl .r { color: var(--ink-3); }
  .ppl.raw { color: var(--ink-3); }
  .prio { font-family: "Barlow Condensed", sans-serif; font-weight: 700; color: var(--ink-3); margin-right: 4px; }
  .wants { display: grid; gap: 6px; justify-items: end; min-width: 0; }
  .wants label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .wants input { accent-color: var(--c); width: 20px; height: 20px; margin: 0; }
  .wants label.other { cursor: default; }
  .drawer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: var(--panel);
    border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    box-shadow: var(--shadow); transform: translateY(105%); transition: transform .22s ease;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden;
  }
  .drawer > header { grid-row: 1; }
  .drawer > .exf { grid-row: 2; }   /* スマホでは絞り込みシートへ移すので、この行は空になる */
  .drawer > .body { grid-row: 3; }
  .drawer.open { transform: translate(0, 0); }
  @media (min-width: 720px) {
    .drawer {
      left: auto; top: 0; bottom: 0; right: 0; width: min(420px, 100%); height: auto;
      border-radius: 0; border-top: none; border-left: 1px solid var(--line); transform: translateX(105%);
    }
    .drawer.open { transform: translate(0, 0); }
  }
  .dhandle {
    position: absolute; z-index: 6; left: 50%; bottom: 10px; transform: translateX(-50%);
    appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: var(--shadow); white-space: nowrap;
  }
  .dhandle[hidden] { display: none; }
  .dhandle .lb-d { display: none; }
  @media (min-width: 720px) {
    .dhandle {
      left: auto; right: 0; bottom: auto; top: 50%; transform: translateY(-50%);
      writing-mode: vertical-rl; padding: 14px 5px; border-radius: 10px 0 0 10px; letter-spacing: .08em;
    }
    .dhandle .lb-p { display: none; }
    .dhandle .lb-d { display: inline; }
  }
  .drawer header { display: block; padding: 10px 16px 8px; border-bottom: 1px solid var(--line); touch-action: none; }
  .drawer header .hrow { display: flex; align-items: center; gap: 6px; }
  #drawerClose .ch { display: none; }
  @media (pointer: coarse), (max-width: 720px) {
    /* 一覧の閉じ方が分かるように、上端に全幅の帯を置く(下スワイプでも閉じる) */
    .drawer header .hrow { display: block; }
    #drawerClose { width: 100%; min-height: 44px; justify-content: center; border-radius: 10px; background: var(--panel-2); font-weight: 700; }

サイバークリエイターズ大学校です。\n本校は、「Innovative & Creative ～変えるチカラ、創るチカラ～」を教育理念に掲げ、ゲーム・IT・CG業界で即戦力として活躍できるクリエイターの育成に取り組んでいます。そして実践的な教育を通じて、多くの卒業生が業界の第一線で活躍しています。\n当日は、学生が制作したゲームやCG作品をぜひご体験・ご覧ください。皆さまに作品を体験していただくことが、学生にとって実践的な学びとなり、さらなる成長につながります。未来のクリエイターたちが生み出す作品と、その熱意をぜひ会場でご体感ください！","w":[{"t":"北海道サイバークリエイターズ大学校 学生ゲーム作品","g":"アクション,レース,その他","p":"PC (App)","r":"未発売","u":""},{"t":"北海道サイバークリエイターズ大学校 学生CG作品","g":"その他","p":"その他","r":"未発売","u":""}],"u":"https://yoshida-hcc.jp/","si":473,"area":7,"size":"S"},{"b":"01-N02","t":"専門学校未来ビジネスカレッジ","x":-255.8,"y":54.3,"c":"academy","corner":"ゲームアカデミーコーナー","d":"専門学校未来ビジネスカレッジは長野県松本市にある専門学校で、ゲームクリエイター学科は2020年4月に開設しました。実務を見据えたカリキュラムとその知識を活かす制作の反復で、日々技術力やコミュニケーション能力を磨いています。今回はこれまでの学生作品からゲーム作品を中心とした試遊展示を行います。学生スタッフが作品の説明やプレイ方法を丁寧にご案内いたしますので、ご来場の際はぜひブースへお立ち寄りください。","u":"https://mirai.ac.jp/mit/","si":481,"area":8,"size":"S"},{"b":"01-N19","t":"岡山情報ビジネス学院","x":-229.6,"y":47.4,"c":"academy","corner":"ゲームアカデミーコーナー","si":483,"area":6,"size":"S"},{"b":"09-C08","t":"工画堂スタジオ","x":-71.5,"y":-184.1,"c":"indie","corner":"インディーゲームコーナー","si":321,"area":6,"size":"S"},{"b":"01-C07","t":"日本IBM","x":-248.8,"y":80.9,"c":"academy","g":"教育・実用","gs":["教育・実用"],"ps":["PC (Browser)","iOS","Android"],"corner":"ゲームアカデミーコーナー","d":"IBMは2030年までに世界3,000万人のスキル習得支援を目指しています。\n\nIBMのCSR(社会貢献)プログラム IBM SkillsBuild は、世界中の学生に向けて、テクノロジーを興味応じて学べる学習機会を、無償提供しています。\n\n今回の展示では、ゲームやAIの力を活用した学習体験を紹介します。\n\n「生成AIカードゲーム研修 - バトルワーカーズ]\n日本IBMが開発しセガXDが監修した、ゲーム感覚で生成AIの基礎から実践まで楽しく学べる体験型コンテンツです。スマホやパソコンからオリジナルカードを作って遊べます。通称バトワカ。\n\n「IBM Bob」\n ゲーム開発をはじめ、さまざまなプロジェクトを支援するAI駆動型開発パートナー。アイデアの創出から実装まで、創造的なものづくりをサポートします。\n\n「IBM Bobで探るゲーム開発：競馬ゲーム事例から学ぶAIを用いたゲーム開発」\n日本IBMのExpert Labsという部署の新入社員が出し物として過去に作成したAI競馬アプリについて紹介します。さらに、AI競馬アプリを理解するうえで欠かせないAI技術についても学ぶことができます。\n\n「The Game」\n 半導体設計における考え方やトレードオフを、楽しみながら体験的に学べるゲーミフィケーション型学習プログラムです。日本IBMのリサーチチームが開発し、多くの大学機関による半導体設計人材の育成の取り組みに活用されてきました。2026年よりIBM SkillsBuildプログラムとしてオンラインプラットフォームでの提供が開始され、地域を問わず大学関係者や教育者が、学生と一緒に講義でそのまま使えるコンテンツとなっています。ゲームで使うカードなどのマテリアルや教育者向けガイドは、ダウンロードして使用することができます。\n\n\nテクノロジーが急速に進化する時代に求められるのは、変化を前向きに受け入れ、好奇心を持って学び続ける力ではないでしょうか。\n\n日本IBMのブースでは、「生成AIバトワカ」「IBM Bob」「AI競馬ゲーム開発」「The Game」などの体験を通じて、ゲームの力が学びをどのように変え、次世代のスキル育成につながるのかをご紹介します。","w":[{"t":"IBM Bob: アイデアを形にするAI駆動開発パートナー","g":"教育・実用","p":"PC (Browser),iOS,Android","r":"","u":"https://ibm.biz/bob-portal"},{"t":"生成AIカードゲーム研修 - バトルワーカーズ","g":"教育・実用","p":"PC (Browser),iOS,Android","r":"","u":"https://www.ibm.com/jp-ja/think/insights/skillsbuild-gamified-learning"},{"t":"IBM Bobで探るゲーム開発：競馬ゲーム事例から学ぶAIを用いたゲーム開発","g":"教育・実用","p":"PC (Browser),iOS,Android","r":"","u":"https://ibm.biz/bob-portal"},{"t":"半導体設計人材育成「The Game」","g":"教育・実用","p":"PC (Browser),iOS,Android","r":"","u":"https://jp.newsroom.ibm.com/2026-04-21-IBM-SkillsBuild-with-the-Game"}],"u":"https://ibm.biz/bob-portal","si":425,"area":7,"size":"S"},{"b":"09-W19","t":"日本電子専門学校 ProjectVR","x":-105.2,"y":-198.6,"corner":"AR/VRコーナー","si":214,"area":17,"size":"S"},{"b":"09-E09","t":"東京情報デザイン専門職大学","x":-39.3,"y":-208.7,"c":"indie","corner":"インディーゲームコーナー","d":"2023年に江戸川区に誕生した4年制大学が2回目の参加！本学は滋慶学園グループの一員として、ゲーム・CG・SE・IoT・AI・セキュリティの6コースを展開。充実した産学連携やインターンシップで実践的なスキルを修得し、即戦力を育成しています。ブースでは商用リリースを控えた作品と学内コンテスト最優秀作品の2種類のゲームをご用意しています。本学で技術を培ってきた学生達の作品をぜひご試遊ください！","u":"https://www.tid.ac.jp/","si":299,"area":6,"size":"S"},{"b":"01-N10","t":"東日本デザイン＆コンピュータ専門学校","x":-255.4,"y":66.1,"c":"academy","corner":"ゲームアカデミーコーナー","d":"群馬・前橋にある、ゲーム・アニメ業界を目指すクリエイター育成に特化した専門校です。3DCG、キャラクターデザイン、ゲーム開発を中心に、現場で必要とされるスキルを徹底的に実践。\n特徴は、業界との強い連携。企業のプロが学校に来て、学生に直接指導する授業やレビューも行われており、常に“現場目線”で学べる環境が整っています。\nブースでは、学生が制作したCG映像やゲーム作品の展示・試遊をご用意。来場者特典もございますので、ぜひお立ち寄りください。","u":"https://www.yamasaki.ac.jp/design-com/","si":450,"area":7,"size":"S"},{"b":"04-C02","t":"松竹","x":-45.0,"y":83.6,"g":"アドベンチャー,パズル","gs":["アドベンチャー","パズル","アクション","音楽・ダンス","シミュレーション","スポーツ","コミュニケーション"],"ps":["Nintendo Switch 2","Nintendo Switch","Steam","PlayStation 5","Xbox Series X|S","PlayStation 4","iOS","Android"],"corner":"一般展示","d":"\"映画\"と \"歌舞伎\"で有名な松竹がゲーム分野に ,"x":-73.1,"y":-256.6,"c":"indie","g":"RPG,コミュニケーション,シミュレーション","gs":["RPG","コミュニケーション","シミュレーション"],"ps":["iOS","Android"],"corner":"インディーゲームコーナー","d":"オグリーゲームズは、ストーリーテリングとAI技術を融合した女性向けゲームを開発する韓国のインディーゲームスタジオです。\n\n今回の東京ゲームショウでは、新作『Lucid Tarot（ルシッドタロット）』を出展いたします。『Lucid Tarot』は、タロットカードをモチーフにした女性向けストーリーRPGです。魅力的なキャラクターとの絆を深めるストーリー、戦略性のあるカードバトル、そしてAIを活用した対話システムを融合し、従来の女性向けゲームとは一線を画す没入感をお届けします。\n\n現在、2026年秋にシーズン1を韓国向けAndroid/iOSで配信開始することを目標に開発を進めており、その後グローバル展開を予定しています。会場では最新のプレイアブルデモを体験いただけるほか、ガチャイベントも実施予定です。\n\n現実と運命をつなぐタロットの世界――『Lucid Tarot』を東京ゲームショウでいち早くご体験ください。 新たなパートナーシップやグローバルでのビジネス協業も積極的に募集しております。","w":[{"t":"ルシッドタロット","g":"RPG,コミュニケーション,シミュレーション","p":"iOS,Android","r":"未発売（2026.09）","u":"www.ogreegames.com"}],"u":"www.ogreegames.com","si":235,"area":8,"size":"S"},{"b":"09-E82","t":"OTIPLE","x":-64.1,"y":-256.9,"c":"indie","g":"その他","gs":["その他"],"ps":["iOS","Android"],"corner":"インディーゲームコーナー","d":"当社は、ユーザーに記憶に残る体験をお届けすることを目指している企業です。ゲームやウェブトゥーンを通じてAIベースの境界のないコンテンツ・エコシステムを構築し、誰もが一つに繋がる次世代のデジタル・プレイグラウンドを創造することをビジョンとして掲げています。\n\nそのために、AI翻訳ソリューションを含むローカライズやモニタリング事業も併せて展開しております。","w":[{"t":"どうしてこうなった？","g":"その他","p":"iOS,Android","r":"未発売（2027.03.15）","u":""}],"u":"https://www.otiple.co.kr","si":236,"area":8,"size":"S"},{"b":"10-C03","t":"PCCS / 声優e-Sports部","x":-80.0,"y":-284.6,"corner":"eスポーツコーナー","d":"ビジネスデイは「eスポーツの未来を、つなぎ、動かす。」が今年のテーマです。\n全国140を超える施設構築経験を通じてeスポーツ施設を開業したい企業様をサポートいたします。\n一般公開日は、声優e-Sports部が声優の出演による催しを行います。\n本プロジェクトは”ゲーム・eスポーツシーン盛り上げ”や”地域活性への寄与”を掲げアクティブに活動中。\n各日、ぜひブースにお立ち寄りください！","si":133,"area":7,"size":"S"},{"b":"09-E101","t":"PLITHUS","x":-58.3,"y":-266.2,"c":"indie","corner":"インディーゲームコーナー","d":"Plithus（プリダス）は、韓国を拠点に、ゲーム開発会社とゲームユーザーをつなぐゲームテストプラットフォームを運営しています。CBT（クローズドβテスト ）、OBT（オープンβテスト）、FGT（フォーカスグループテスト ）など、さまざまなテストを通じて、開発会社がユーザーの反応をもとに、ゲームの品質向上や市場への適性を検証できるよう支援しています。\n\n開発会社には、テストユーザーの募集からテストの設計・運営、フィードバック収集、AIを活用したデータ分析・レポート提供まで、ゲーム開発に必要な検証サービスを提供しています。11万人以上のゲームユーザーと1,000回以上のゲームテスト実績を基盤に、テストを通じて集まったユーザーの声やプレイデータをAIで分析し、ゲームのさまざまな要素に対するユーザーの反応をレポートとして提供しています。\n\nゲームユーザーには、正式リリース前のゲームをいち早くプレイし、実際に遊んだ感想や意見を届けられる機会を提供しています。テストを通じてゲームへの感想や意見を届けながら、ギフトカードに交換可能なポイントを獲得できることもPlithusの特徴です。\n\n「ユーザーとともにつくるゲーム」へ。Plithusは、ユーザーの声をもとに、より良いゲームづくりにつなげるゲームテストプラットフォームです。","u":"https://www.plithus.kr","si":284,"area":8,"size":"S"},{"b":"09-W21","t":"PocketReal","x":-94.7,"y":-198.9,"g":"その他","gs":["その他"],"ps":["iOS","Android","その他"],"corner":"AR/VRコーナー","d":"『推しが、目の前に現れる。』 ポケリアは、VTuberによる空間ライブ配信を楽しめるMixed Reality(複合現実)アプリです。 VTuberを好きな大きさ・位置で現実空間に呼び出し、まるで隣にいるような臨場感でライブ配信を楽しめます。 2D画面では決して味わえなかった、推しと同じ空間で過ごす特別な体験をお届けします。","w":[{"t":"ポケリア","g":"その他","p":"iOS,Android,その他","r":"発売中","u":"https://www.meta.com/ja-jp/experiences/pocketreal/9776144469120667/"}],"u":"https://pocketreal.co.jp/","si":210,"area":8,"size":"S"},{"b":"09-W16","t":"ROOX","x":-94.6,"y":-195.9,"corner":"AR/VRコーナー","d":"VRシーンをもっと楽しく、快適に。ROOXxRは様々なVRアクセサリーを提案する株式会社ROOXのブランドです。 \nメタバース内で眠りに落ちる「VR睡眠」を支える枕「ぶいすいーと」を実際に寝て試せます。 \nまた、手軽にトラッカーを装着できる「ゆるとら」をご体験いただけます。","u":"https://roox.jp","si":209,"area":7,"size":"S"},{"b":"09-E76","t":"Sanobusiness","x":-63.9,"y":-250.9,"c":"indie","corner":"インディーゲームコーナー","d":"Sanobusinessは、トリノを拠点とするクリエイティブ・デベロップメント・スタジオであり、ユニークで魅力的なビデオゲームの制作に対する情熱を原動力としています。","u":"https://sanobusinessgames.com/","si":254,"area":7,"size":"S"},{"b":"09-E94","t":"Smilegate STOVE","x":-64.2,"y":-259.9,"c":"indie","g":"アドベンチャー","gs":["アドベンチャー","アクション","RPG"],"corner":"インディーゲームコーナー","d":"Smilegate is a global game development and publishing company headquartered in South Korea with regional offices in the United States, Canada, China, and Europe. Its flagship franchise ‘CROSSFIRE’ is one of the largest and most successful franchises in gaming history with more than 1 billion registered PC and mobile users to-date and over 8 million concurrent players and 20 million monthly active users across 80 countries.","w":[{"t":"病能探偵","g":"アドベンチャー","p":"","r":"未発売","u":"https://store.steampowered.com/app/3432860/PsychoSleuth/"},{"t":"不良少女 Detained: Too Good for School" der』『キングダムハーツ』『ディシディア ファイナルファンタジー』などに携わったクリエイター、塩川洋介がオーナー兼代表取締役を務めるゲーム会社です。「一生涯、替えのきかない作品を。」の理念のもと、プラットフォームやジャンルにとらわれず、新たなゲームの創出に積極的に取り組んでいます。\n　\nブースでは、新作ローグライトカードバトル『ルナパルス』を国内初出展します。試遊していただいた方には、数量限定ノベルティをプレゼント！ぜひお立ち寄りください！\n\n◆『ルナパルス』とは◆\nその夜、十三人の魔女が喰らい合う―。『ルナパルス』はシングルプレイヤーのローグライトカードゲームです。明けない月夜を舞台に繰り広げられる、生殺与奪をかけた魔女たちの儀式。互いの手札がすべて見えた状態で同時に一手を仕掛ける。たった一手が即死を招く、“死にゲー”さながらの緊張感をカードバトルで味わえます。","w":[{"t":"ルナパルス","g":"アドベンチャー,テーブル・カード","p":"Steam","r":"未発売（2027年予定）","u":"https://store.steampowered.com/app/4555610/_/"}],"u":"https://store.steampowered.com/publisher/fahrenheit213","si":296,"area":3,"size":"S"},{"b":"09-C22","t":"373 STUDIO","x":-68.7,"y":-190.6,"c":"indie","g":"アドベンチャー","gs":["アドベンチャー"],"ps":["Steam"],"corner":"インディーゲームコーナー","d":"373 STUDIOは、2025年に設立されたインディーゲームスタジオです。現在は一人で運営しています。「Solo Today, Studio Tomorrow」という理念を掲げ、オープンで、オープンマインドで、オープンソースであることを大切にしながら、堅実でありつつも常に新しいものを生み出せる開発チームを少しずつ築いていきます。","w":[{"t":"放送開始！タクシー推理事件簿","g":"アドベンチャー","p":"Steam","r":"未発売（2027/1/15）","u":"https://store.steampowered.com/app/3972170/_/"}],"si":346,"area":3,"size":"S"},{"b":"09-W113","t":"AI PikattoAnime","x":-133.3,"y":-255.4,"corner":"物販コーナー","d":"TGS恒例!ガラガラくじ商品販売!\n最新作!!!『空の軌跡 the 2nd』『亰都ザナドゥ -桜花幻舞-』のガラガラくじ\nイラスト一新!!『Summer Pockets REFLECTION BLUE』ガラガラくじ\n大好評!アクリルスタンドくじでは『東方Project』『軌跡シリーズ』など販売!!\n\n物販コーナーでは『空の軌跡 the 2nd』『亰都ザナドゥ -桜花幻舞-』『軌跡シリーズ』『東方Project』など魅力的なグッズをご用意しております!","u":"https://pikatto.shop-pro.jp/","si":183,"area":15,"size":"S"},{"b":"11-W06","t":"Alliance＆ FnaticGear ＆ Team Liquid ＆ Virtus.pro (ASK)","x":-97.3,"y":-337.4,"corner":"物販コーナー","d":"eスポーツチーム、「Alliance」、「Fnatic」、「Team Liquid」、「Virtus.pro」のアパレル品、アクセサリー品を販売いたします。","u":"https://www.ask-corp.jp/","si":191,"area":50,"size":"S"},{"b":"09-C49","t":"Anarch Entertainment","x":-69.0,"y":-203.8,"c":"indie","g":"アクション,音楽・ダンス","gs":["アクション","音楽・ダンス","シューティング"],"ps":["Steam"],"corner":"インディーゲームコーナー","d":"Anarch Entertainmentは、ニューヨークを拠点とする小規模なインディーゲームスタジオです。メンバーは「Pump It Up」「Arcaea」「A Dance of Fire and Ice」などの商業リズ を蹴り飛ばす爽快感を得ることができます。\n\n「流し」という、いわゆるジャストガードによって相手の攻撃をいなすことができます。\n相手の攻撃を連続で流していく気持ちよさ、そしてそこから反撃に転じて相手を斬り刻む爽快感を味わえます。\n高難易度アクションが苦手！という方でも気持ちよくパリィアクションを楽しめるようなゲームになっています。\n\n広大な世界の環境をワイヤーアクションを活かしながら駆け回り、成長しながら次々敵を倒していく爽快感が得られます。","w":[{"t":"TONIN: 兎忍","g":"アクション","p":"Steam","r":"未発売（未定）","u":""}],"si":797,"area":2,"size":"S"},{"b":"11-E01","t":"Azeron","x":-42.9,"y":-331.1,"corner":"ゲーミングハードウェアコーナー","d":"Azeronは、プレイヤーにより高い操作性、快適性、そして自由を提供する、世界で最も多機能かつ人間工学に基づいたゲーミングキーパッドを開発しています。アナログ操作、多彩な入力、そして手の自然な形状に合わせたデザインにより、Azeronはゲームとの新しいインタラクションを提案します。","u":"azeron.com","si":109,"area":16,"size":"S"},{"b":"E-76","t":"Bad Magpie バッドマグパイ","x":-29.0,"y":-270.1,"f":2,"c":"si80","g":"アドベンチャー","gs":["アドベンチャー"],"ps":["Xbox Series X|S","Steam"],"corner":"SELECTED INDIE 80","d":"Milktooth is an independent games studio founded by artist Catherine Unger (Tangle Tower, Gibbon: Beyond the Trees), designer Daisy Fernandez (Card Shark, As Dusk Falls), and developer George Batchelor (Bird Alone, South of the Circle). The studio was built on a shared ambition: to make you laugh before breaking your heart.\n \nBad Magpie is their debut game.","w":[{"t":"Bad Magpie バッドマグパイ","g":"アドベンチャー","p":"Xbox Series X|S,Steam","r":"未発売（2027）","u":""}],"u":"https://badmagpiegame.com/","si":808,"area":2,"size":"S"},{"b":"09-W114","t":"BANDAI SPIRITS 30MINUTES LABEL","x":-133.5,"y":-259.9,"corner":"物販コーナー","si":170,"area":7,"size":"S"},{"b":"E-10","t":"BARKOUR","x":-15.3,"y":-222.4,"f":2,"c":"si80","g":"アクション,アドベンチャー","gs":["アクション","アドベンチャー"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"VARSAV Game Studiosは、ポーランド・ワルシャワを拠点とする36名の開発者からなる独立系ゲームスタジオです。ポートフォリオには『Bee Simulator』、『Everdream Valley』、近日発売予定の『Everdream Village』、そして秘密諜報犬エージェントT.H.U.N.D.E.R.が主役のアクションアドベンチャー・プラットフォーマー『BARKOUR』が含まれます。『BARKOUR』は同スタジオ史上最大かつ最も野心的なオリジナルIPです。","w":[{"t":"BARKOUR","g":"アクション,アドベンチャー","p":"Steam","r":"未発売（Early This Winter 2026）","u":""}],"u":"https://varsav.com/en/portfolio/barkour/","si":846,"area":2,"size":"S"},{"b":"09-C17","t":"BASSAI-DAI","x":-68.5,"y":-186.1,"c":"indie","corner":"インディーゲームコーナー","d":"『BASSAI-DAI』は、スピーディーなバトルと、墨の筆を使ったクリエイティブなゲームプレイを融合した、スタイリッシュなアクションアドベンチャーゲームです。\n\n巨大な墨の筆を操り、足場を描いたり、環境を利用したパズルを解いたり、元素の力を駆使して敵と戦いながら、周囲の世界を自在に形作ることができます。ギリシャと日本の文化や美意識から着想を得た世界を舞台に、家族を救うための冒険へと旅立ちます。","si":332,"area":3,"size":"S"},{"b":"09-W13","t":"BLACK BALLOON MARKET","x":-119.8,"y":-189.1,"corner":"物販コーナー","si":196,"area":69,"size":"M"},{"b":"09-E35","t":"Black Tower Studios","x":-49.5,"y":-191.3,"c":"indie","corner":"インディーゲームコーナー","si":344,"area":3,"size":"S"},{"b":"09-C21","t":"Blimey VR","x":-66.7,"y":-190.7,"c":"indie","corner":"インディーゲームコーナー","si":347,"area":3,"size":"S"},{"b":"10-E29","t":"Brook Gaming","x":-52.9,"y":-323.4,"corner":"ゲーミングハードウェアコーナー","d":"Brook Gaming は台湾発のゲーミングハードウェアブランドです。格闘ゲーム向けデバイス、マルチプラットフォーム対応コンバーター、ゲームコントローラー、モバイルゲーミングアクセサリーの開発を手がけています。超低遅延、高い安定性、継続的なファームウェアアップデートにより、世界中のプレイヤー、プロ選手、アーケードスティックブランドから信頼を獲得。Wingman FGC2 は EVO AWARDS：BEST PRODUCT 2025 を受賞しました。\n\n東京ゲームショウ2026では、過去最大規模の展示を実施します。新製品 8K Core Fighting Board、Powered by Brook Inside 技術展示、Wingmanシリーズのコンバーター、StarRay・NEO Liteコントローラー、Flashman・Auto Catchなどのモバイルゲーミング製品を出展。さらに、複数のアーケードスティックブランドとの合同展示や、3名のプロ選手によるステージイベント、交流企画、サイン会も開催します。格闘技術、マルチプラットフォーム、コントローラー、モバイルゲーミングまで、Brook Gamingの幅広い製品と未来をご体験ください。","u":"https://www.brookaccessory.com/index.php","si":88,"area":50,"size":"S"},{"b":"09-E36","t":"Bustr Media Enterprise / Accent Games","x":-51.5,"y":-191.3,"c":"indie","corner":"インディーゲームコーナー","si":343,"area":3,"size":"S"},{"b":"11-E12","t":"CANVY","x":-65.1,"y":-344.1,"corner":"ゲーミングハードウェアコーナー","si":93,"area":33,"size":"S"},{"b":"E-63","t":"Cham-gaming","x":-27.3,"y":-209.9,"f":2,"c":"si80","g":"アクション,シミュレーション","gs":["アクション","シミュレーション"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"見えない線ではなく、車輪で走る。\nPhysical TRAINは、鉄道模型のようなジオラマ世界で列車を自由に走らせる、物理ベースのデジタル鉄道模型ジオラマです。列車は決められた線の上を疑似的に動くのではなく、車輪がレールの上を転がることで走行します。舞台は、山岳地帯に発展中の新興都市国家「チャムランド共和国」。山岳路線、都市、港湾など多彩な景観を持つオープンな路線で、貨物輸送や旅客輸送のミッションをこなしながら、鉄道網と国の発展に貢献していきます。","w":[{"t":"みんなで Physical TRAIN ～チャムランド国営鉄道～","g":"アクション,シミュレーション","p":"Steam","r":"発売中","u":""}],"u":"https://www.cham-gaming.com/","si":836,"area":2,"size":"S"},{"b":"09-E46","t":"Cinderia","x":-51.7,"y":-197.8,"c":"indie","g":"アクション,RPG,アドベンチャー,対戦・格闘","gs":["アクション","RPG","アドベンチャー","対戦・格闘"],"ps":["Steam","PC (App)"],"corner":"インディーゲームコーナー","d":"Cinderiaは、爽快感あふれるアクションが魅力のローグライトゲームです。スキル、コンボ、パッシブ、装備など、目に映るあらゆる要素を自由に組み合わせ、自分だけの戦闘スタイルを作り上げましょう。闇が大地を覆い尽くしても、廃墟の中にはまだ微かな希望の光が揺らめいています。","w":[{"t":"Cinderia","g":"アクション,RPG,アドベンチャー,対戦・格闘","p":"Steam,PC (App)","r":"発売中","u":"https://store.steampowered.com/app/3214610/_Cinderia/"}],"u":"https://playcinderia.com","si":367,"area":3,"size":"S"},{"b":"09-C46","t":"Cometa Games","x":-68.9,"y":-199.2,"c":"indie","corner":"インディーゲームコーナー","d":"コメタゲームズ","u":"https://cometagames.mx","si":376,"area":3,"size":"S"},{"b":"09-E31","t":"Crico","x":-47.4,"y":-186.9,"c":"indie","g":"スポーツ","gs":["スポーツ"],"ps":["Steam"],"corner":"インディーゲームコーナー","d":"『未来の“面白い”をカタチにする。』を企業理念として、エンターテイメント分野を中心に、クリエイティブとテクノロジーを活かした多様なサービスを提供しています。","w":[{"t":"Super Kickmen","g":"スポーツ","p":"Steam","r":"未発売（2026年第4四半期）","u":"https://store.steampowered.com/app/4847170/Super_Kickmen/"}],"u":"https://crico.co.jp/","si":316,"area":3,"size":"S"},{"b":"10-E33","t":"DAIAD（いしん）","x":-68.0,"y":-321.4,"corner":"ゲーミングハードウェアコーナー","d":"DAIADは、いしんが企画・販売するHDMI・デジタルAV機器ブランドです。\nHDMI分配器・切替器・マトリックス・延長器・マルチビューワー、eARC関連機器、音声分離器、キャプチャーデバイス、長距離伝送機器など、映像・音声の接続課題を解決する製品を展開しています。\n\n東京ゲームショウ2026では、HDMI分配器を中心とした接続構成により、eARC非対応のゲーミングモニター環境でも、4K@120Hz・VRRの滑らかなゲーム映像とDolby Atmosの高音質音声を両立する実機デモを実施します。\n\nさらに、入力側30m＋出力側30mの長距離HDMI伝送、4K60fpsまたは1080p120fpsの映像キャプチャー・ライブ配信など、ゲーミング・映像制作・配信・法人設備に応用できる接続ソリューションをご紹介します。\n\nまた、Dolby Atmos等のPCM音声処理、eARC端子のみを備えるサウンドバー向け新HDMI接続技術、HDMI 2.2／最大96Gbpsクラスを見据えた次世代HDMI機器、Dante／AV-over-IPなどの技術も開発・検証しています。\n\n法人導入、OEM・特注仕様、卸売・継続調達、販売協業、製品検証、接続構成・機器選定のご相談にも対応しています。\n\n10ホール｜ブースNo.10-E33","u":"https://www.daiad.jp/","si":115,"area":8,"size":"S"},{"b":"11-E16","t":"DarkBeacon","x":-54.8,"y":-355.1,"corner":"ゲーミングハードウェアコーナー","d":"DarkBeaconは、次世代の革新的な高性能ゲーミングデバイスに特化した、AIゲームハードウェア企業です。プロeスポーツ仕様のリアル8000Hz磁気キーボード「Fluxシリーズ」、最先端のTMRセンサーを搭載した0.001mm精度の単手ゲーミングキーパッド「Devil Breakerシリーズ」、最高峰の打鍵感と静音性を誇るGasketキーボード「Bladeシリーズ」を展開しており、今後はマウスやヘッドセットなどの製品ラインナップも順次リリース予定です。全製品が自主開発の「DarkBeacon」ソフトウェアとシームレスに連動し、自然言語入力だけで、直感的に高度なマクロ、RGBライティング、サウンドエフェクトを瞬時に自動設定できる、独自かつスマートなデバイスエコシステムを構築しています。","u":"https://darkbeacon.ai/","si":128,"area":7,"size":"S"},{"b":"E-27","t":"Devotion Interactive","x":-16.5,"y":-265.6,"f":2,"c":"si80","g":"アクション,その他","gs":["アクション","その他"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Devotion Interactive is a game publisher based in Istanbul. We work with developers to launch, scale and sustain games globally. Our biggest title, Climber Animals: Together, has crossed 2.5 million copies sold, $6 million in gross revenue and 40,000 peak concurrent players, driven by a breakout success in China. We focus on games with viral potential and long-tail revenue, and we back them with hands-on publishing across marketing, platform relations, localization and live operations.","w":[{"t":"An Eggstremely Hard Game","g":"アクション,その他","p":"Steam","r":"発売中","u":""}],"u":"https://devotioninteractive.com/","si":816,"area":2,"size":"S"},{"b":"08-C12","t":"DITP (Thailand Pavilion) / ADISOFT GAMING / Earthquack Games / Yggdrazil Group / OKDAY / Orbital Works / GameDevHub / Singular Sunshine Studios / TEAPOT STUDIO / DxT / Bit Egg / View Passion / Pixel Perfex / Fourteenrain Studio / Varisoft / Miracle 8 / LuminDrive / Waka Studio","x":209.2,"y":97.2,"corner":"一般展示","d":"タイ国商務省国際貿易振興局（DITP）の取りまとめにより、タイのゲーム関連企業計17社が出展します。自社開発のゲームタイトルを紹介する制作会社の他、ゲーミングマウス等の機器を取り扱う企業、タイ市場向けのローカライズ支援サービス企業、ゲーム企業向けのコワーキングスペース運営企業が参加します。","u":"https://www.ditp.go.th/","si":610,"area":103,"size":"M"},{"b":"08-C08","t":"DOBE","x":199.9,"y":88.4,"corner":"一般展示","si":619,"area":16,"size":"S"},{"b":"10-E32","t":"Dongguan 3e Electronics","x":-64.9,"y":-321.5,"corner":"ゲーミングハードウェアコーナー","si":125,"area":7,"size":"S"},{"b":"10-E23","t":"Dongguan Gaoxd Precision Industry","x":-58.6,"y":-312.6,"corner":"ゲーミングハードウェアコーナー","d":"2009年に深センから東莞に移転して以来、GAOXDは10年以上にわたり業界の専門性を深め、一つひとつのビジョンを現実へと変えてきました。精密金型製造および二色金型生産における豊富な経験を活かし、同社は急速に成長し、開発・設計・射出成形・生産を一体化した大規模な精密工業製造企業へと発展しました。\n\n革新の必要性に直面した際には、期待を超える新技術を開発しています。GAOXDは製品そのものに注力しており、先進的な海外技術の導入と吸収を通じて、専門的で安定かつ経験豊富な研究開発チームの構築に多大な投資を行っています。特定の製品設計や性能要件に対応するため、高度な2Dおよび3D検査装置を備えた専用テストプラットフォームを設立しました。独自のコア技術と知的財産の継続的な開発により、当社は常に高品質で国際的に競争力のある製品を提供しています。常に迅速かつ効率的、正確に顧客に包括的な製品ソリューションを提供できるようにする。","w":[{"t":"Dongguan Gaoxd Precision Industry","g":"","p":"","r":"発売中","u":""}],"u":"www.cogoled.com","si":122,"area":8,"size":"S"},{"b":"08-N09","t":"DONUTS","x":235.9,"y":34.0,"corner":"一般展示","si":679,"area":8,"size":"S"},{"b":"E-07","t":"Double Jack","x":-15.1,"y":-217.4,"f":2,"c":"si80","g":"シミュレーション,音楽・ダンス","gs":["シミュレーション","音楽・ダンス"],"ps":["Nintendo Switch 2","Nintendo Switch"],"corner":"SELECTED INDIE 80","d":"Joy-Con™を手に取り、真の「マエストロ」を目指そう！\n\n『マエストロ』は、Joy-Con™のモーション操作でオーケストラを指揮するリズムゲームです。あなたの動きが演奏を導き、誰でも本格的な指揮を楽しめます。\n\n『スター・ウォーズ』『ゲーム・オブ・スローンズ』『ロード・オブ・ザ・リング』『ハリー・ポッター』『進撃の巨人』や、ベートーヴェン、モーツァルト、ヴィヴァルディなど、映画・ゲーム・クラシック・ジャズの名曲を収録。\n\nパリを舞台に、テンポを刻み、楽器へ合図を送り、壮大な演奏を作り上げましょう。","w":[{"t":"Maestro マエストロ","g":"シミュレーション,音楽・ダンス","p":"Nintendo Switch 2,Nintendo Switch","r":"未発売（17 Sep. 2026）","u":"https://maestro-game.com/"}],"si":830,"area":2,"size":"S"},{"b":"08-N20","t":"DUNLOP","x":237.2,"y":61.3,"corner":"一般展示","d":"DUNLOPは今年も東京ゲームショウに出展します。昨年の物販ブースに続き、今年は一般展示エリアにて、eスポーツプレーヤーの健康とパフォーマンスを支えるアイテムや取り組みをご紹介します。\n\nアームサポーターの試遊体験や、レーシングゲームを使ったeモータースポーツ向けアイテムの紹介など、実際に触れて体験できるコンテンツをご用意しています。また、リカバリーウェアやフーディーブランケット、アイマスクなど、プレー前後のコンディショニングをサポートする製品も展示します。\n\nFENNEL選手のパネル展示も予定しています。ぜひDUNLOPブースへお越しください。","u":"https://sports.dunlop.co.jp/esports/","si":632,"area":33,"size":"S"},{"b":"10-E34","t":"EA SEMI（SHANGHAI）TECH","x":-74.0,"y":-321.1,"corner":"ゲーミングハードウェアコーナー","si":123,"area":8,"size":"S"},{"b":"E-53","t":"Easy Fox","x":-21.8,"y" 高い技術力、優れたコストパフォーマンスを追求しています。現在では世界150カ国以上のオーディオファンに製品をお届けしています。\n\n東京ゲームショウ2026では、ゲームやデスク環境をより深く楽しむためのFosi Audio最新ラインナップをお試しいただけます。ぜひご来場ください。","u":"https://fosiaudio.co.jp/","si":116,"area":7,"size":"S"},{"b":"10-E35","t":"FOSTEX(フォスター電機) / タマファイティングコミュニティ","x":-72.6,"y":-324.2,"corner":"ゲーミングハードウェアコーナー","si":106,"area":15,"size":"S"},{"b":"09-E47","t":"FrontierCraft","x":-53.7,"y":-197.8,"c":"indie","corner":"インディーゲームコーナー","si":368,"area":3,"size":"S"},{"b":"09-C43","t":"Fruitbat Factory","x":-75.0,"y":-199.0,"c":"indie","corner":"インディーゲームコーナー","si":373,"area":3,"size":"S"},{"b":"09-C32","t":"Fun2 Studio","x":-68.7,"y":-192.6,"c":"indie","corner":"インディーゲームコーナー","d":"Fun2 Studioは2019年に設立された、XR（Extended Reality）およびPCゲームの開発を専門とするゲーム開発会社です。豊富な業界経験を持つコアメンバーを中心に、VR・AR・MRコンテンツの開発を軸として、PC、ヘッドマウントデバイスをはじめとするさまざまなプラットフォーム向けに、多彩なゲーム体験を提供するとともに、自社IPの創出にも積極的に取り組んでいます。\nXR技術、インタラクティブデザイン、アートクリエイティブ、マーケティングに至るまで、企画から実現までを一貫してサポートするトータルソリューションを提供しています。高い創造力と実行力を兼ね備えたチームとして、お客様のビジョンを形にします。","u":"https://www.fun2studio.com/","si":352,"area":3,"size":"S"},{"b":"11-W21","t":"FUTAROKU/Riot Store Japan","x":-132.7,"y":-363.1,"g":"FPS・TPS,対戦・格闘","gs":["FPS・TPS","対戦・格闘"],"corner":"物販コーナー","d":"FUTAROKUは、現役ゲーマーの視点で「自分たちが本当に欲しい」アイテムをセレクト・発信する、ゲーマーのためのセレクトショップ。\n\nRiot Store Japanの運営をはじめ、ゲームをもっと楽しめるアイテムや、今注目のホットなアイテムをセレクト。\nまた、FUTAROKUオリジナルでは、ゲームやゲーマー文化への理解をもとに、遊び心のあるデザインや、ゲーマーの心に刺さるアイテムを企画・制作しています。\n\nゲームをもっと身近に、もっと自由に。\nFUTAROKUは、ゲームから生まれる新しいカルチャーを発信していきます。","u":"https://futaroku.gg/","si":188,"area":32,"size":"S"},{"b":"E-78","t":"Future Entertainment Company","x":-29.1,"y":-273.6,"f":2,"c":"si80","g":"アクション,RPG","gs":["アクション","RPG"],"ps":["Steam","その他"],"corner":"SELECTED INDIE 80","d":"DDoDは、しっくりくる射撃の手応えと、愛さずにはいられない――あるいは憎たらしい――ミュータントが登場する見下ろし型ローグライトシューターです。Diabloのようなスタイルとテンポに、Stalkerを思わせる雰囲気と空気感を融合させました。\n\nあなたは紫の大地の外縁にたどり着く――封鎖された実験的工業地帯であり、霧と呼ばれる意思を持つ物質に侵された土地だ。この地には危険でありながら愛らしい生き物たちが棲んでいる。その愛らしさに気を許してはいけない。少しでも油断すれば、生きたまま喰われる。さあ仕事にかかろう。紫の大地を浄化せよ。","w":[{"t":"DDoD","g":"アクション,RPG","p":"Steam,その他","r":"未発売（2026）","u":""}],"u":"https://playfuture.games/","si":811,"area":2,"size":"S"},{"b":"08-N06","t":"G TUNE・NEXTGEAR(マウスコンピューター)","x":208.1,"y":50.3,"corner":"一般展示","d":"マウスコンピューターが展開する2つのゲーミングPCブランド「G TUNE(ジーチューン)」と「NEXTGEAR(ネクストギア)」で出展。「G TUNE」はeSportsシーンを盛り上げるすべてのプロフェッショナルを応援するハイパフォーマンスなゲーミングPCブランド、「NEXTGEAR」はコストパフォーマンスに優れたエントリーモデル中心に、ゲームを楽しむすべての人に向けた親しみやすいゲーミングPCブランドです。今回は新たにクリエターPCブランド「DAIV(ダイヴ)」の展示も行います。ブースでは、新製品展示・試遊・ステージイベント、eSports選手やストリーマーのゲーム実況を実施。ぜひご来場ください","u":"https://www.mouse-jp.co.jp/","si":634,"area":437,"size":"L"},{"b":"09-W120","t":"GAMES GLORIOUS","x":-134.0,"y":-279.6,"corner":"物販コーナー","d":"AMES GLORIOUSはゲームをコンセプトとしたライフスタイルブランド。既存のゲームから、ゲーム化されてないコンテンツをゲーム風にしたコラボ商品などを多数展開しております。今年は新商品『ファミコン版トランスフォーマー』、PCエンジンに多数名作をリリースしたメーカー「メサイヤ」とのコラボ商品をはじめ、SEGA、ジャレコ、「天外魔境」シリーズ、『サイバーパンク2027』、ファミコン版ゴジラ、ファミコン版トランスフォーマー、話題のインド映画RRRのゲーム風コラボ商品など、あらゆるジャンルのゲームコラボ商品が発売する予定です。","u":"https://www.games-glorious.com/","si":184,"area":15,"size":"S"},{"b":"E-54","t":"Gearbyte Games","x":-23.3,"y":-258.7,"f":2,"c":"si80","g":"アクション,その他","gs":["アクション","その他"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Founded in Singapore, Gearbyte Games is an indie game studio that is driven by a passion for creating unique and memorable gaming experiences. With a talented team of game developers, we challenge conventions and redefine what is possible in gaming by introducing fresh concepts and groundbreaking mechanics.","w":[{"t":"Identifile: Desktop Dungeon","g":"アクション,その他","p":"Steam","r":"発売中","u":""}],"u":"https://gearbytegames.com/","si":780,"area":2,"size":"S"},{"b":"E-20","t":"Gentle Giants","x":-16.2,"y":-253.6,"f":2,"c":"si80","g":"アクション,音楽・ダンス","gs":["アクション","音楽・ダンス"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Unreal Engine 5を活用した技術支援・SES・受託開発を行っています。\n自社でもゲームやVRコンテンツを開発しており、その実践で培ったノウハウを活かし、ゲーム、VR、アニメーションなど幅広いコンテンツの制作・開発支援を行っています。\n\n東京ゲームショウ2026では、\nアクションの音がメロディとなり、そのメロディでギミックを動かして、ゴールを目指す3Dアクションゲーム「MeloMisterio -play your melody-」を展示いたします。","w":[{"t":"MeloMisterio -play your melody-","g":"アクション,音楽・ダンス","p":"Steam","r":"未発売（2027年）","u":"https://linktr.ee/MeloMisterio"}],"u":"https://www.gentlegiants.llc/products/melomisterio","si":821,"area":2,"size":"S"},{"b":"E-08","t":"Go Slimey Go!","x":-15.2,"y":-218.9,"f":2,"c":"si80","g":"アクション,アドベンチャー","gs":["アクション","アドベンチャー"],"ps":["PC (App)"],"corner":"SELECTED INDIE 80","d":"私たちは、『Go Slimey Go!』のクリエイターであるテンバック（アグスティン・ペレス・フェルナンデス）とチャビー（ジュリアン・チャブ）によって結成された、小規模なインディーチームです。その後、作曲家のトニ・レイスとレベルデザイナーのホアキン・カルボがチームに加わりました。\n\nこのプロジェクトは、EVA賞の「最優秀オーディオ賞」「最優秀デザイン賞」、および「プレス賞」を含む数々の賞を受賞しています。また、Latam!の「最優秀ゲーム賞」のファイナリストにも選出されました！","w":[{"t":"Go Slimey Go!","g":"アクション,アドベンチャー","p":"PC (App)","r":"発売中","u":""}],"u":"https://linktr.ee/GoSlimeyGo","si":824,"area":2,"size":"S"},{"b":"07-N08","t":"Google Play","x":180.8,"y":51.3,"corner":"一般展示","si":635,"area":435,"size":"L"},{"b":"07-C05","t":"Graph","x":180.5,"y":99.7,"g":"アクション,アドベンチャー","gs":["アクション","アドベンチャー"],"ps":["Nintendo Switch 2","PlayStation 5","Xbox Series X|S","Steam","PC (App)"],"corner":"一般展示","d":"Graphは、株式会社アクティブゲーミングメディアが運営するPR、マーケティングおよびパブリッシングブランドです。世界中のデベロッパーやパブリッシャーに向けて、PR、マーケティングから地域ごとのパブリッシングまで、幅広いサービスを提供しています。翻訳、ローカライズ、メディア運営、カスタマーサポートなど、各分野の専門チームと連携しながら、優れた作品とユーザーをつなぎ、長く愛されるコミュニティづくりに取り組んでいます。","w":[{"t":"RuneScape: Dragonwilds ルーンスケープ：ドラゴンワイルズ","g":"アクション,アドベンチャー","p":"Nintendo Switch 2,PlayStation 5,Xbox Series X|S,Steam,PC (App)","r":"未発売（2026年9月15日）","u":"https://store.steampowered.com/app/1374490/RuneScape_Dragonwilds/"}],"u":"https://wearegraph.com/ja/","si":612,"area":51,"size":"M"},{"b":"10-C08","t":"GRAPHT","x":-80.5,"y":-301.2,"corner":"ゲーミングハードウェアコーナー","d":"『GRAPHT』は、「好きを語れる人を増やす」をミッションに、プロダクトやサービスを通じてクリエイターとコミュニティの関係性を創ること目指しているブランドです。\n\n『GRAPHT』は、TGS2026内ゲーミングハードウェアコーナーおよび物販コーナーに出展いたします。\n今回のTGS2026では、『LIMIT BREAK』をテーマに掲げます。\n\n“熱狂は一人では生まれない。プレイヤーの情熱、コミュニティとの絆、GRAPHTのエネルギーが共鳴する時、かつてない力が爆発する。\n限界とは、共に超えるためにあるものだ。己の壁に挑む競技者から、ゲームを愛するすべての仲間たちへ。\nゲームを愛する者たちが集い、それぞれの熱量が交わるこの最高の空間で、好きを語りつくそう！\nさあ、共にリミットを外そう。”\n\n本テーマのもと、展示・物販の両ブースを通じて、一人ひとりの個性やライフスタイルにあわせて、「好き」を自分らしく日常に取り入れるためのさまざまな選択肢をご提案します。\n\n展示ブースでは、格闘ゲームコーナー、FPSゲームコーナー、ゲーミングオーディオコーナーを設置。ゲームジャンルにあわせて特化したゲームパッド、アーケードコントローラー、モニター、イヤホン、MINI DAC、マウス周辺アクセサリなど、GRAPHTのゲーミングデバイスを幅広く展示し、一部製品は実際にゲームをプレイしながら操作感や使用感を体験いただけます。また、GRAPHTアンバサダーの立川選手、どぐら選手、べてぃ選手をはじめ、豪華ゲストが登壇するステージイベントや、GRAPHT会員の方を対象に、発表したばかりの『Omni 6 for PC』が当たるガラポン抽選会も実施します。\n\n\n会場でお得なセット販売や、イベントステージの情報はGRAPHT TOKYO GAME SHOW 2026 特設サイトをご確認ください。\n\nGRAPHT会員限定キャンペーン\nGRAPHT会員の方を対象に、会場限定の特典をご用意します。\n・税込5,000円以上のご購入 ＆ レジにてGRAPHT会員証をご提示で500円OFF\n・GRAPHT会員証のご提示で、豪華景品が当たるガラポン抽選会に参加\n　当日のご案内をスムーズにするため、事前のGRAPHT会員登録がおすすめです。\n\nGRAPHT会員登録　https://account.grapht.tokyo/auth/signup","u":"https://store.grapht.tokyo/","si":82,"area":175,"size":"M"},{"b":"11-C07","t":"Guangdong Ouxide","x":-81.9,"y":-348.1,"corner":"ゲーミングハードウェアコーナー","si":101,"area":24,"size":"S"},{"b":"10-E31","t":"GUIZHOU FUDING RUBBER AND PLASTIC","x":-58.9,"y":-321.7,"corner":"ゲーミングハードウェアコーナー","si":118,"area":7,"size":"S"},{"b":"10-E25","t":"HID-labs（ビーエリア）","x":-70.8,"y":-313.7,"corner":"ゲーミングハードウェアコーナー","d":"HID-Labsは国内外のゲーミングデバイスを取り扱う販売代理店です。\n\nマウス・キーボード・アーケードコントローラーをはじめとした海外製品に加え、自社開発のFPS特化イヤホン「DETECT」をはじめとするHID-Labsオリジナル製品など、多数のゲーミングデバイスを展示いたします。\n\nハイスペックPCを使用した試遊環境をご用意しておりますので、話題の製品や新製品も実際に手に取ってお試しいただけます。\n実際に触れてみなければ分からない形状や使用感、音の違いなどをゲームプレイを通してじっくりとご体験ください。\n\nさらに、ご来場いただいた皆さまにお楽しみいただける企画も実施予定です。\n最新のゲーミングデバイスを「見て、触って、試せる」HID-Labsブースへ是非お越しください。","u":"https://shop.hid-labs.com/","si":87,"area":51,"size":"M"},{"b":"09-C31","t":"HIGHFIVE DOG","x":-70.8,"y":-192.6,"c":"indie","g":"RPG,アドベンチャー","gs":["RPG","アドベンチャー"],"ps":["PC (App)"],"corner":"インディーゲームコーナー","d":"HIGHFIVE DOGは台湾のインディーゲームスタジオです。\n\n台湾の民俗文化や都市伝説をテーマにした、ストーリー重視のゲームを開発しています。手描きアニメーションによる演出と感情豊かな物語表現を特徴としており、現在は台湾民俗を題材にしたストーリーRPG『City God Alice（城隍アリス）』を開発中です。","w":[{"t":"City God Alice：城隍アリス","g":"RPG,アドベンチャー","p":"PC (App)","r":"未発売（2026年冬～2027年春予定）","u":"https://store.steampowered.com/app/4045810/City_God_Alice/"}],"u":"https://x.com/Catwith5","si":354,"area":3,"size":"S"},{"b":"E-72","t":"HiroshiIdenoPresents","x":-28.4,"y":-249.2,"f":2,"c":"si80","g":"アクション,レース","gs":["アクション","レース"],"ps":["その他"],"corner":"SELECTED INDIE 80","d":"インディーゲーム開発も組織開発やパブリッシャー契約、大手企業の様々なフォローを受けてビジネスの世界に羽ばたくことが当たり前になってきています。\n\nそんな中「HiroshiIdenoPresents」は、本当にただの個人です。１人で開発しており、法人でもありません。\nそんな私がただ「作りたいから」という理由で作っているこのゲーム「CRAZY SONIC」に、Tokyo Game Showという世界的に注目されているイベントへの出展の機会を与えてくださり、本当に感謝しております。\n\nクランクの付いた小型ゲーム機「Playdate」で遊べる、新感覚ハイスピードドライブアクション「CRAZY SONIC」を開発中です。\n今までにないコントロールデバイス「クランク」による超加速、そして上下キーによる回避。\n新たなゲームコントローラ要素は、ゲームに慣れ親しんだ皆様にも新たなゲーム体験を提供できるものと考えております。\n\nぜひブースへお越し頂き、ご体験下されば幸いです。","w":[{"t":"CRAZY SONIC","g":"アクション,レース","p":"その他","r":"未発売（2027年）","u":""}],"u":"https://idenonx.wixsite.com/crazy-sonic","si":829,"area":2,"size":"S"},{"b":"11-E25","t":"HKC","x":-70.0,"y":-357.6,"corner":"ゲーミングハードウェアコーナー","si":102,"area":24,"size":"S"},{"b":"07-N01","t":"HORI","x":144.0,"y":34.3,"corner":"一般展示","si":652,"area":23,"size":"S"},{"b":"E-56","t":"Hubert","x":-23.3,"y":-260.7,"f":2,"c":"si80","g":"アドベンチャー","gs":["アドベンチャー"],"ps":["PlayStation 5","Steam"],"corner":"SELECTED INDIE 80","d":"『Hubert（フーベルト）』は、変化していく世界の中で自分の居場所を探す一匹の忠実な牧羊犬を描いたストーリー重視のアドベンチャーゲームです。プレイヤーはHubertの視点を通して、多様な環境を探索し、キャラクターと出会い、パズルを解きながら、会話と探索を通じて紡がれる心温まる物語を体験します。本作は、友情、本能、そして人間と犬の絆に焦点を当てています。","w":[{"t":"『Hubert（フーベルト）』","g":"アドベンチャー","p":"PlayStation 5,Steam","r":"発売中","u":""}],"u":"https://brocap-studio.com/","si":777,"area":2,"size":"S"},{"b":"E-47","t":"Hugecalf Studios","x":-21.3,"y":-244.6,"f":2,"c":"si80","g":"アドベンチャー,コミュニケーション","gs":["アドベンチャー","コミュニケーション"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Hugecalf Studios is a remote indie game studio founded by 3 friends based in the UK and around Europe. Hugecalf pursues a simple philosophy: Follow the fun.","w":[{"t":"連帯責任","g":"アドベンチャー,コミュニケーション","p":"Steam","r":"発売中","u":""}],"u":"https://hugecalf.com/","si":786,"area":2,"size":"S"},{"b":"11-E14","t":"Huion","x":-65.3,"y":-348.7,"corner":"ゲーミングハードウェアコーナー","si":111,"area":16,"size":"S"},{"b":"11-C06","t":"HYPESHOP / Wooting / BANDAL GAMING","x":-83.3,"y":-343.5,"corner":"ゲーミングハードウェアコーナー","si":94,"area":34,"size":"S"},{"b":"E-17","t":"i want to be a tree (but life has other ideas)","x":-16.0,"y":-248.0,"f":2,"c":"si80","g":"その他","gs":["その他"],"ps":["PC (App)"],"corner":"SELECTED INDIE 80","d":"i want to be a tree (but life has other ideas) is a climbing game about putting leaves back on trees. You play as a basket, ambling around a forest where leaves have all fallen off. You may pick up leaves, put them in your basket, and paint them back on trees wherever you’d like. It has no goals, no winning, and you may stop whenever you’d like by standing still and singing a song.","w":[{"t":"i want to be a tree (but life has other ideas)","g":"その他","p":"PC (App)","r":"発売中","u":""}],"u":"https://iantyf.itch.io/i-want-to-be-a-tree","si":827,"area":2,"size":"S"},{"b":"09-C25","t":"Ichigoichie","x":-74.7,"y":-190.4,"c":"indie","corner":"インディーゲームコーナー","si":358,"area":3,"size":"S"},{"b":"09-E55","t":"Idea Bombers","x":-51.9,"y":-204.4,"c":"indie","g":"アクション,RPG","gs":["アクション","RPG"],"ps":["Steam","PC (App)"],"corner":"インディーゲームコーナー","d":"アイデアボンバーズは、代表作『Wild Shapers（ワイルドシェイパーズ）』を開発中の、キャラクターと世界観のIPを生み出すクリエイティブテック企業です。私たちは、ゲームを収益の終着点ではなく、IPエコシステムの出発点だと考えています。そのため開発に着手する前に世界観とキャラクターの物語を先に築き上げ、ゲーム、アニメ、OTT、グッズへ同時に展開できるブランド型IP資産を構築することを事業の中核に据えています。\n\n『Wild Shapers』の世界には人間が存在しません。人間が姿を消した後に進化した動物たちが、魔法ではなく元素工学によって文明を築いた世界であり、当初からアニメ化を前提として設計されたIPです。私たちが目指すのは、ひとシーズンで消費されて終わるコンテンツではなく、世代を越えて残り続ける長期的価値を持つIPエコシステムです。","w":[{"t":"Wild Shapers","g":"アクション,RPG","p":"Steam,PC (App)","r":"未発売（2026.09.17）","u":"https://store.steampowered.com/app/4105020/Wild_Shapers/"}],"u":"https://store.steampowered.com/app/4105020/Wild_Shapers/","si":399,"area":3,"size":"S"},{"b":"09-E13","t":"IGDA日本","x":-49.2,"y":-180.4,"c":"indie","corner":"インディーゲームコーナー","si":292,"area":3,"size":"S"},{"b":"E-14","t":"IN SILICO","x":-15.8,"y":-240.5,"f":2,"c":"si80" IE 80","d":"LudenArtsは、インディーゲームを愛する開発者たちのチームです。私たちは、ゲームが力強い芸術であり、文化表現でもあると信じています。既存の枠を越えて思想を届ける作品を追求すると同時に、ゲームの普及と教育にも取り組んでいます。\n\nゲームが人間の文化、社会的価値、個人の感情にもたらす可能性を探求すること。そして、異なる文化的背景を持つ作り手が育つ土壌をつくり、より多くの人がゲームを理解し、自らの手で作れるようになること——それが私たちの目指す未来です。","w":[{"t":"MASK IT","g":"アドベンチャー,シミュレーション","p":"Steam,PC (Browser)","r":"未発売（2027年 初頭）","u":""}],"u":"https://ludenarts.com/whitebabelstudio","si":793,"area":2,"size":"S"},{"b":"09-E22","t":"Lumenarts Studio","x":-49.3,"y":-184.9,"c":"indie","corner":"インディーゲームコーナー","si":308,"area":3,"size":"S"},{"b":"08-C15","t":"Mango Party","x":231.2,"y":72.1,"corner":"一般展示","si":656,"area":8,"size":"S"},{"b":"09-C07","t":"Midnight Crepe Studios","x":-68.5,"y":-184.2,"c":"indie","corner":"インディーゲームコーナー","si":322,"area":3,"size":"S"},{"b":"07-N02","t":"Minimum Studio","x":150.1,"y":34.0,"g":"アクション,対戦・格闘","gs":["アクション","対戦・格闘","RPG","アドベンチャー","シューティング"],"ps":["Nintendo Switch 2","Nintendo Switch","PlayStation 5","Xbox Series X|S","Xbox One","Steam","iOS","Android"],"corner":"一般展示","d":"Minimum Studioは韓国のゲーム開発会社です。PC・コンソール・モバイル向けに、個性豊かなアクションゲームを開発しています。TGS 2026では『Catgirl Rage: Claws of Fury』『No More Slimes!!』『Luminleaf Chronicles』『Convergent Chrono』を出展します。","w":[{"t":"キャットガール・レイジ：クローズ・オブ・フューリー","g":"アクション,対戦・格闘","p":"Nintendo Switch 2,Nintendo Switch,PlayStation 5,Xbox Series X|S,Xbox One,Steam","r":"未発売（2026.11.30）","u":"https://store.steampowered.com/app/3756910/Catgirl_Rage_Claws_of_Fury/"},{"t":"スライム大騒動","g":"アクション,RPG","p":"Nintendo Switch 2,Nintendo Switch,PlayStation 5,Xbox Series X|S,Xbox One,Steam,iOS,Android","r":"発売中","u":"https://apps.apple.com/jp/app/id6786115854"},{"t":"ルミンリーフ・クロニクルズ","g":"アクション,RPG","p":"Nintendo Switch 2,Nintendo Switch,PlayStation 5,Xbox Series X|S,Xbox One,Steam","r":"未発売（2026.10.30）","u":"https://store.steampowered.com/app/2890930/Luminleaf_Chronicles/?l=japanese"},{"t":"コンバージェント・クロノ","g":"アクション,アドベンチャー,シューティング","p":"Nintendo Switch 2,Nintendo Switch,PlayStation 5,Xbox Series X|S,Xbox One,Steam","r":"未発売（2026.11..30）","u":"https://store.steampowered.com/app/5000900/Convergent_Chrono/?l=japanese"}],"u":"https://home.minimumstudio.net/","si":651,"area":8,"size":"S"},{"b":"10-E18","t":"moimate","x":-41.1,"y":-305.0,"corner":"ゲーミングハードウェアコーナー","d":"moimateブースでは、自由なレイアウトと自然に手が置けるボタン間隔が特徴のレバーレスコントローラー「Rushbox」シリーズの展示・販売を行います。\n各モデルのサイズ感や押し心地を実機で比較し、ご自身の手に最も馴染むデバイスをお探しいただけます。さらに、展示モデルはすべてTGS会場限定の特別価格で販売いたします！\n\n■ 初出し＆先行販売\n・Rushbox Click 2\n※完全新作モデルを本イベントにて初公開！会場にて数量限定で先行販売を実施いたします。\n\n■ 展示・販売ラインナップ\n・Rushbox 2：強靭なアルミボディと究極のカスタマイズ性を誇る、自分仕様の本格モデル。\n・Rushbox Lite 2：上位モデルの高い自由度を受け継いだ、お求めやすい軽量モデル。\n・Rushbox Click：0.3mmの極浅ストロークで、最速の反応を追求した特化モデル。\n・Rushbox Mini：初めての1台や持ち運びに最適な、1万円台の小型モデル。\n・FPS用キースイッチ\n\n格闘ゲームはもちろん、デバイス選びにこだわりたいFPSプレイヤーの方まで楽しんでいただけるラインナップを揃えています。\n新作をいち早く手に入れたい方、理想の操作環境を構築したい方は、ぜひmoimateブースへお立ち寄りください。","u":"https://shop.moimate.com/","si":104,"area":16,"size":"S"},{"b":"E-77","t":"MONO ENTERTAINMENT","x":-29.1,"y":-272.1,"f":2,"c":"si80","g":"シミュレーション","gs":["シミュレーション"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"AIドット絵バトルは相手モンスターに『勝てそう』なモンスターを描くゲームです。\nAIがモンスター同士の相性や戦い方を判断し、勝敗をジャッジしてくれます。\n勝敗だけではなく、描いたモンスターの名前や特徴、さらには戦いの様子まで教えてくれます。\n\n■自分だけのオリジナルモンスター図鑑\n描いたモンスターは図鑑に登録されます。\n\n■友達や家族とお絵描きバトル\n交互にモンスターを描いて戦わせる『お絵描きバトル』と描いたモンスターで6匹のチームを組んで戦う『チームバトル』が遊べます。\n\n■モンスタートーナメント\n描いたモンスターたちでトーナメントを組み、最強の一匹を決めることができます。\n\n■コードでみんなのモンスターを召喚\n描いたモンスターはモンスターコード化することが可能。\nそのコードを入力すると、自分のゲームに他の人が描いたモンスターを召喚できます。","w":[{"t":"AIドット絵バトル","g":"シミュレーション","p":"Steam","r":"未発売（2026年 夏）","u":""}],"si":810,"area":2,"size":"S"},{"b":"11-E02","t":"MOZA Racing","x":-51.6,"y":-332.5,"corner":"ゲーミングハードウェアコーナー","si":98,"area":33,"size":"S"},{"b":"08-N18","t":"MSI","x":229.6,"y":58.6,"corner":"一般展示","si":633,"area":104,"size":"M"},{"b":"09-E04","t":"MYサービス","x":-39.0,"y":-197.7,"c":"indie","g":"アクション,音楽・ダンス","gs":["アクション","音楽・ダンス"],"ps":["iOS","Android"],"corner":"インディーゲームコーナー","d":"MYサービスが開発支援をしているスマートフォン向けリズムゲーム『オウギヒメ ~Sense of Princess』の試遊、展示を行います。『オウギヒメ』は扇子がモチーフのリズムゲームで、扇子型のレーンに流れてくるノーツ ,"u":""}],"u":"www.nfi.no","si":626,"area":77,"size":"M"},{"b":"E-34","t":"Okawari!","x":-22.1,"y":-218.4,"f":2,"c":"si80","g":"アクション,コミュニケーション","gs":["アクション","コミュニケーション"],"ps":["Steam","PC (App)"],"corner":"SELECTED INDIE 80","d":"Okawari! は、京都を拠点に活動するインディーゲームチームです。チーム名は、日本語の「おかわり」に由来しています。\n \n私たちが目指しているのは、勝っても負けても、ひとりでも友だちと一緒でも、気軽に笑って楽しめるゲーム体験です。\n\n私たちは2人組のチームで、仕事の合間を使ってゲーム制作を続けています。『一口ちょうだい！』は、私たちにとって初めてのタイトルです。","w":[{"t":"一口ちょうだい！","g":"アクション,コミュニケーション","p":"Steam,PC (App)","r":"未発売（Late Autumn 2026）","u":""}],"u":"https://500yearsokawari.itch.io/","si":800,"area":2,"size":"S"},{"b":"11-E19","t":"ONEXPLAYER","x":-69.9,"y":-354.6,"corner":"ゲーミングハードウェアコーナー","d":"ONEXPLAYER は ONE-NETBOOK テクノロジー（壹號本科技）傘下の世界的なハードコアゲーミングハードウェアブランドです。\n一体型 Windows 携帯ゲーム PC、脱着式 3-in-1 変形ポータブル PC、ゲーミング PC に対応するモバイル GPU ドッキングステーションなど、充実した製品ラインナップを取り揃え、完全な製品エコシステムを構築しています。\n高性能モバイルゲーミング機器の研究開発・生産・販売に注力し、ハードコアゲーマーが場所の制約を受けず、いつでもどこでも 3A タイトルを快適にプレイでき、束縛のない最高のゲーム体験を提供することを目標としています。","u":"https://onexplayer.com","si":100,"area":24,"size":"S"},{"b":"09-C24","t":"Optillusion Games","x":-72.7,"y":-190.5,"c":"indie","g":"アクション,アドベンチャー,対戦・格闘,シミュレーション,パズル,リアルタイムストラテジー,その他","gs":["アクション","アドベンチャー","対戦・格闘","シミュレーション","パズル","リアルタイムストラテジー","その他","コミュニケーション"],"ps":["Steam","iOS","Android"],"corner":"インディーゲームコーナー","d":"私たちOptillusion Gamesは、インタラクティブアートという表現を追求するアーティスト、ストーリーテラー、そして革新者たちの集まりです。私たちは単にゲームを作るのではなく、プレイヤーの現実と私たちの想像の境界を曖昧にする没入型の世界を創り上げています。私たちの根底にあるのは、実験的なデザイン、型破りな発想、そしてゲームの可能性を探求し続ける情熱です。","w":[{"t":"Rinthine（果てなき迷宮）","g":"アクション,アドベンチャー,対戦・格闘,シミュレーション,パズル,リアルタイムストラテジー,その他","p":"Steam","r":"未発売（Late 2027）","u":"https://store.steampowered.com/app/4353330/Rinthine/"},{"t":"Dreamplay Garden（ドリームプレイガーデン）","g":"コミュニケーション,シミュレーション,その他","p":"iOS,Android","r":"未発売（2026）","u":"https://www.instagram.com/dpgarden_otomegame/"}],"u":"https://www.optillusion.games/","si":357,"area":3,"size":"S"},{"b":"E-35","t":"P.F.J.","x":-20.6,"y":-220.4,"f":2,"c":"si80","g":"シミュレーション,パズル","gs":["シミュレーション","パズル"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"P.F.J. (平凡結)は、「まだ見たことのない遊び」を探求してゲームを作る個人開発者です。物理シミュレーション、パズル、数学、日常の小さな違和感を組み合わせ、実験的な作品づくりを続けています。遊びが新しい発見につながるようなゲームを目指しています。","w":[{"t":"Unknot! -アンノット!-","g":"シミュレーション,パズル","p":"Steam","r":"発売中","u":""}],"u":"https://www.unknot-game.com/","si":798,"area":2,"size":"S"},{"b":"E-39","t":"P.U.Q.U.","x":-20.9,"y":-228.5,"f":2,"c":"si80","g":"アクション,アドベンチャー","gs":["アクション","アドベンチャー"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"『TETE』は、ちいさなゴーレムを操り、崖を登る高難易度のクライミングアクションゲームです。最大の特徴は、物理演算で動く長い両腕を個別に操作する独特のプレイ感。複雑に揺れ、絡まり、暴れる腕を制御しながら、「掴む・振る・跳ぶ」といったアクションを駆使して、不思議な地形を攻略していきます。マップの裏側や立ち入り禁止区域への侵入、巨大生物など、プレイヤーの好奇心をくすぐる探索要素を楽しむことができます。多彩なギミックや謎解き、正規ルートを外れた先に眠る隠しアイテムなど、登るだけにとどまらない体験となっています。","w":[{"t":"TETE","g":"アクション,アドベンチャー","p":"Steam","r":"未発売（2027年）","u":""}],"si":794,"area":2,"size":"S"},{"b":"E-26","t":"Paiband Game Studio","x":-16.5,"y":-264.2,"f":2,"c":"si80","g":"シミュレーション,その他","gs":["シミュレーション","その他"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"私たちは、心温まるゆったりとした体験をお届けすることに注力しているインディーゲームスタジオです。シンプルでありながら深みのあるゲームプレイを通じて、プレイヤーの皆様に平穏で落ち着いたひとときを提供する、小規模なシングルプレイヤーゲームの開発を目指しています。","w":[{"t":"Restore Your Island","g":"シミュレーション,その他","p":"Steam","r":"発売中","u":""}],"u":"https://paibandstudio.com/","si":817,"area":2,"size":"S"},{"b":"E-21","t":"Pat-o-Logic Studio","x":-16.2,"y":-255.1,"f":2,"c":"si80","g":"アドベンチャー,パズル","gs":["アドベンチャー","パズル"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Pat-o-Logic Studioは、3人の女性による小規模なゲーム制作スタジオです。\n\n私たちは、実験的なアイデアから生まれる、印象的なプレイ体験を大切にしています。\n\n心温まる物語、癒やしのあるゲーム、みんなで楽しめるパーティーゲーム、少し不思議なシミュレーションなど、ジャンルにとらわれず、プレイヤーが思いがけない形で世界と関わる作品づくりを目指しています。\n\n型にはまらない操作方法や、一つのアイデアから生まれる独自のゲームの仕組みを通して、ゲームだからこそ味わえる驚きや喜び、そして心の動きを届けたいと考えています。\n\n私たちの目標は、とてもシンプルです。\n\nプレイヤーにとって、個人的で、心に残り、「こんなゲームは初めて」と感じてもらえる作品を作ることです。","w":[{"t":"Mama","g":"アドベンチャー,パズル","p":"Steam","r":"未発売（Late Winter 2027）","u":""}],"u":"https://pat-o-logic.com/","si":820,"area":2,"size":"S"},{"b":"E-51","t":"Pawtential Disaster","x":-21.6,"y":-252.7,"f":2,"c":"si80","g":"アクション,シミュレーション","gs":["アクション","シミュレーション"],"corner":"SELECTED INDIE 80","d":"Pawtential Disaster は、犬の群れがとても運の悪い赤ちゃんを家まで連れて帰らなければならない、カオスな物理演算協力ゲームです。\n\nあなたたちは、お互いにつながれているわけではありません。\n全員が、同じ最悪の責任につながれているのです。\n\n一緒に引っぱり、別々にパニックになりながら、ベビーカーが絶対に通るべきではない場所を進み、なんとか倒さずに進んでください。\n\nミッションはシンプルです。赤ちゃんを家に帰すこと。\n世界は危険です。\nでも、あなたの友達はもっと危険です。","w":[{"t":"Pawtential Disaster","g":"アクション,シミュレーション","p":"","r":"未発売（Late This Winter 2026）","u":""}],"si":782,"area":2,"size":"S"},{"b":"11-E09","t":"Penci Studio","x":-57.7,"y":-349.0,"corner":"スマートフォンゲームコーナー","si":80,"area":7,"size":"S"},{"b":"09-E54","t":"Pip Puzzle","x":-49.9,"y":-204.5,"c":"indie","corner":"インディーゲームコーナー","d":"ピップ・パズルは、自分のジェムを壊して相手の画面にジャンクジェムを送り込み、勝利を目指す1対1の対戦パズルゲームです。\n\nジェムを壊すとキャラクターのアクションスキルがチャージされます。画面を白黒にしたり、相手の画面に障害物を設置したり、自分のジェムを突き破って埋もれたジェムを壊したりと、個性豊かなスキルで相手を妨害できます。\n\nゲームの進行に合わせて背景や音楽も変化し、雰囲気が大きく移り変わります。","u":"https://store.steampowered.com/app/1858390/Pip_Puzzle/","si":397,"area":3,"size":"S"},{"b":"08-N04","t":"PixAI","x":202.3,"y":32.1,"corner":"一般展示","si":662,"area":7,"size":"S"},{"b":"08-C01","t":"PLAION REPLAI (NEOGEO AES+)","x":196.5,"y":76.3,"corner":"一般展示","d":"PLAION REPLAIについて\n\nPLAION REPLAIは、PLAION傘下の専用レーベルとして、高品質な公式ライセンスのハードウェアおよびソフトウェアを通じて、ゲームの歴史を守り、その魅力を未来へと伝えることを使命としています。\n\nオリジナルへの忠実さ、デザインの再現性、そして懐かしさを大切にしながら、REPLAIは世界的に高く評価されているクリエイターやパートナーと協力し、時代を超えて愛される名作を新たな世代へと蘇らせています。\n\n詳しくは、www.plaionreplai.comをご覧ください。","u":"www.plaionreplai.com","si":628,"area":103,"size":"M"},{"b":"07-C06","t":"PLAYISM","x":169.9,"y":100.1,"g":"シミュレーション","gs":["シミュレーション","アクション","シューティング","アドベンチャー","RPG","パズル"],"ps":["Steam","Nintendo Switch","iOS","Android","Nintendo Switch 2","PlayStation 5"],"corner":"一般展示","d":"インディーゲームパブリッシングブランド「PLAYISM」から発売予定のゲームタイトルをご紹介します。","w":[{"t":"Idol Manager: Virtual Venture","g":"シミュレーション","p":"Steam","r":"未発売（2027年早期アクセス配信）","u":"https://playism.com/game/idol-manager-virtual-venture/"},{"t":"Iron Bramble / アイアンブランブル","g":"アクション,シューティング","p":"Steam","r":"未発売（2027年）", n\nTGS限定のデモ体験をお楽しみいただけます！ぜひAVATARIUMブースへお立ち寄りください。","u":"https://pocket-rd.com/","si":678,"area":8,"size":"S"},{"b":"E-32","t":"Prank Maker","x":-21.9,"y":-212.3,"f":2,"c":"si80","g":"アクション,アドベンチャー","gs":["アクション","アドベンチャー"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"『HAUNTED STREAMER』は、「廃墟探索×ライブ配信」をテーマにしたホラーゲームです。 \nプレイヤーは馬のマスクをかぶった配信者となり、呪われた日本の廃墟などを訪れ心霊現象をライブ配信します。\n幽霊や心霊現象をカメラで捉えることで撮れ高を稼ぎ、視聴者の「いいね」や「スーパーコイン（投げ銭）」を獲得しながら、チャンネルを成長させていきます。 しかし、心霊現象を見続けることで正気度が下がり、ゼロになると死に至る危険も…。 \n配信中には視聴者から無茶なリクエストが届くこともあり、こなせば高額投げ銭のチャンスがある一方で、命を危険にさらすことも。\n恐怖と承認欲求のはざまで、スリルと笑いが交錯する新感覚ホラー体験をお楽しみください。","w":[{"t":"HAUNTED STREAMER","g":"アクション,アドベンチャー","p":"Steam","r":"未発売（2027年 夏）","u":""}],"u":"https://www.prank-maker.com/en/works/haunted-streamer/","si":804,"area":2,"size":"S"},{"b":"08-C13","t":"Project Moon","x":197.1,"y":96.1,"corner":"一般展示","si":611,"area":141,"size":"M"},{"b":"09-C36","t":"Psi Games Online","x":-68.9,"y":-197.2,"c":"indie","corner":"インディーゲームコーナー","si":379,"area":3,"size":"S"},{"b":"09-W39","t":"Pulsar Gaming Gears","x":-131.8,"y":-204.3,"corner":"物販コーナー","d":"Pulsar Gaming Gearsは、2020年に韓国で誕生したeスポーツギアブランドです。\n\nゲーミングマウス、キーボード、マウスパッドをはじめ、プレイヤーのパフォーマンスを最大限に引き出すためのゲーミングデバイスを世界中で展開しています。\n\nPulsarが追求するのは、軽さ、速さ、正確さ、そしてプレイヤーの感覚に応える操作性。\n最新のテクノロジーと独自のデザインを融合し、カジュアルゲーマーから競技シーンで戦うプレイヤーまで、さまざまなスタイルに応える製品を生み出し続けています。\n\nスペックだけでは伝わらない、触れた瞬間の軽さ。\n動かした瞬間のレスポンス。\nプレイしたときに感じる、その違い。\n\n東京ゲームショウ2026のPulsarブースでは、最新のゲーミングギアを実際に手に取り、その性能を体験いただけます。\n\nあなたのプレイを次のレベルへ。\nぜひ会場で、Pulsar Gaming Gearsを体感してください。","u":"https://pulsar.gg/","si":176,"area":15,"size":"S"},{"b":"10-E28","t":"PUNK WORKSHOP","x":-42.7,"y":-325.0,"corner":"ゲーミングハードウェアコーナー","si":114,"area":16,"size":"S"},{"b":"E-68","t":"Puzzle Deck","x":-28.2,"y":-242.2,"f":2,"c":"si80","g":"パズル","gs":["パズル"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Green Forest XR is a Vancouver spatial design studio building for the medium that holds the physical and digital at once: mixed reality. We make Puzzle Deck, a hand-built p そして重厚な物語が展開するダークナラティブシューター『SILLY POLLY BEAST』などがあります。","u":"https://tophat.studio","si":646,"area":15,"size":"S"},{"b":"11-W08","t":"TORCH TORCH","x":-123.5,"y":-336.5,"corner":"物販コーナー","d":"TORCH TORCHは日本発のアパレルブランドです。『ELDEN RING』『ELDEN RING NIGHTREIGN』『Bloodborne』『DARKSOULS』といったタイトルとコラボレーションし、イラストを独自に描き下ろしたTシャツを展開。プリント方法やネームタグにもこだわりの仕様が満載です。ゲーム内に登場するアイテムをアクセサリー化したペンダントや指輪も、高い再現度で人気を集めています。\nファン心をくすぐるユニークなデザインでありながら、日常に取り入れやすいことを大切にしたアパレル商品。東京ゲームショウでは、先行販売や限定ノベルティをご用意し、皆さまのご来場をお待ちしております。","u":"https://torchtorch.jp/","si":202,"area":101,"size":"M"},{"b":"11-W07","t":"TOYPLA","x":-106.3,"y":-337.1,"corner":"物販コーナー","si":200,"area":101,"size":"M"},{"b":"10-E27","t":"TTC","x":-60.2,"y":-315.6,"corner":"ゲーミングハードウェアコーナー","d":"TTCは中国を代表する電子周辺部品メーカーであり、世界中のブランドから高い信頼を得ています。  \nTTCは1998年に設立され、登録資本金は5280万香港ドルです。当社はスイッチ、エンコーダー、電子スイッチおよびコネクタの設計に特化しており、製品はコンピュータ、自動車、スマートデバイス、マウス、キーボード、デジタルオーディオ、家電製品、オフィス機器、計測機器および産業用制御装置など幅広い分野で活用されています。","u":"https://en.ttc9.com/","si":105,"area":16,"size":"S"},{"b":"E-29","t":"Twenty Ninety Creative","x":-16.6,"y":-269.2,"f":2,"c":"si80","g":"アクション,音楽・ダンス","gs":["アクション","音楽・ダンス"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Twenty Ninety Creativeは、サウジアラビア王国を拠点とするインディーゲームスタジオです。90年代ゲームへのノスタルジーを原点に、私たちの作品に触れるすべての人へ、心に残る楽しい思い出を届けることを目指しています。","w":[{"t":"Becoming You","g":"アクション,音楽・ダンス","p":"Steam","r":"未発売（Late This Winter 2026）","u":""}],"u":"https://www.twentyninetycreative.com/","si":809,"area":2,"size":"S"},{"b":"09-E15","t":"Unmasked Truths: Shattered Dreams","x":-53.2,"y":-180.3,"c":"indie","corner":"インディーゲームコーナー","d":"世界的に有名な10人の専門家が、同じ場所に閉じ込められた。生き残るためには協力し合わなければならない……しかし対立が生じ、本当の敵はシステムではなくお互いだということに気付いてしまう！ フルボイス対応の殺人ミステリーアドベンチャーで、誰が嘘をついているのか真実を暴こう。","u":"https://unmaskedtruthsgame.com/","si":297,"area":3,"size":"S"},{"b":"E-25","t":"Valentin Wirth","x":-16.4,"y":-262.1,"f":2,"c":"si80","g":"アドベンチャー,教育・実用","gs":["アドベンチャー","教育・実用"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"人の体内を駆け巡る小さな精子として、力強くプレイしましょう。\n頑張れば新しい命を作ることができます。\n\ ":"S"},{"b":"E-67","t":"We Are So Cooked","x":-28.2,"y":-240.2,"f":2,"c":"si80","g":"アクション,アドベンチャー","gs":["アクション","アドベンチャー"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"You and your friends are in trouble. Big trouble. Someone is dead - probably an accident - and now you have to make the body disappear. We Are So Cooked is a 1-4 player co-op physics-stealth comedy where the goal is simple: get the body to the exit. Pulling it off is the hard part. The corpse is heavy and floppy, every doorframe is a hazard, and one scream from a guest brings the guards running. You have no weapons and no plan: just a mop, a squeaky toy, and friends who keep dropping their end down the stairs.","w":[{"t":"We Are So Cooked","g":"アクション,アドベンチャー","p":"Steam","r":"発売中","u":""}],"u":"https://www.thedwarvenbrothers.com/","si":839,"area":2,"size":"S"},{"b":"09-C38","t":"Whitethorn Games","x":-72.9,"y":-197.1,"c":"indie","g":"アクション","gs":["アクション"],"ps":["Nintendo Switch 2","PlayStation 5","Xbox Series X|S","Steam"],"corner":"インディーゲームコーナー","d":"ウィットソーン・ゲームズは、誰もが気軽に楽しめる、心地よくて遊びやすいインディーゲームのパブリッシャーです。特別なスキルや知識は必要ありません。少しずつでも、すぐにでも、誰でも遊べるゲームを届けています。アクセシビリティとインクルージョンを大切に、ゲームを楽しめる人の輪を広げること。それが私たちの使命です。私たちは、「やさしいゲームの守り手」です。","w":[{"t":"カーネル・ハーツ","g":"アクション","p":"Nintendo Switch 2,PlayStation 5,Xbox Series X|S,Steam","r":"未発売（Releases during TGS）","u":"www.whitethorngames.com/kernel-hearts"}],"u":"www.whitethorngames.com","si":381,"area":3,"size":"S"},{"b":"07-C02","t":"Wizardry Variants Daphne","x":151.0,"y":76.5,"corner":"一般展示","si":629,"area":69,"size":"M"},{"b":"11-E18","t":"XPPen","x":-53.4,"y":-358.2,"corner":"ゲーミングハードウェアコーナー","si":108,"area":16,"size":"S"},{"b":"11-E20","t":"XVX Keyboard","x":-76.0,"y":-354.4,"corner":"ゲーミングハードウェアコーナー","si":121,"area":7,"size":"S"},{"b":"09-C23","t":"Yanako RPGs","x":-70.7,"y":-190.6,"c":"indie","corner":"インディーゲームコーナー","si":345,"area":3,"size":"S"},{"b":"08-C05","t":"YYSTV Media","x":202.7,"y":82.2,"corner":"一般展示","si":623,"area":16,"size":"S"},{"b":"09-E16","t":"アートレイスタジオ","x":-55.2,"y":-180.2,"c":"indie","corner":"インディーゲームコーナー","si":286,"area":4,"size":"S"},{"b":"08-C11","t":"アイティーシー(STORM)","x":212.0,"y":89.5,"corner":"一般展示","si":618,"area":34,"size":"S"},{"b":"08-C19","t":"アウタープレーン（OUTERPLANE）","x":231.7,"y":87.2,"corner":"一般展示","si":653,"area":7,"size":"S"},{"b":"E-13","t":"アカリーニョ・ゲームズ","x":-15.7,"y":-238.5,"f":2,"c":"si80","g":"アドベンチャー,パズル","gs":["アドベンチャー","パズル"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"Acarino（アカリーニョ）**とは、ガリシア語で「愛情を持って接すること」「誰かを優しく撫でること」を意味します。Acarino Gamesは2022年、映画会社Acarino Filmsの制作ラインを拡張する場として誕生しました。芸術性と挑戦性を兼ね備えたラインナップにこだわり、独自性と作品の独立性を最優先しながら、分野を横断する文化的な担い手としての確立を目指しています。 \n\nそして、強い芸術的・哲学的意図を持つ一人のアーティストと、独立した作家性のある視点に賭ける意志を持つ新進の制作会社が共鳴し合うことでXERMEが生まれました。","w":[{"t":"XERME (シェルメ）","g":"アドベンチャー,パズル","p":"Steam","r":"未発売（Winter 2027）","u":""}],"u":"https://acarinofilms.com/en/xerme/","si":840,"area":2,"size":"S"},{"b":"09-W115","t":"アストロメダ","x":-133.6,"y":-266.0,"corner":"物販コーナー","si":168,"area":23,"size":"S"},{"b":"07-C01","t":"アソビズム","x":140.4,"y":76.9,"g":"アクション,教育・実用","gs":["アクション","教育・実用"],"ps":["Steam"],"corner":"一般展示","d":"アソビズムのブースでは、2027年発売予定のSteam向け物理サンドボックスゲーム『OmOchim(オモチム)』をご紹介します。プレイヤーは相棒の小さなロボット“オモチム”を自由に改造し、思いついたアイデアをその場で試すことができます。考えて、つくって、試す。その繰り返しが、本作の遊びの核となります。当日は先行して試遊できるほか、遊んでいただいた方にノベルティをプレゼント。\nほかにも、ブースには現実世界で遊べる「オモチムの筐体」も展示。ゲーム内のプログラム機能で、実体のオモチムを操作して遊べるアトラクションも体験いただけます。\nさらに、9月21日(月・祝)14:10からファミリーゲームパークのキッズステージにおいて、実際にプレイする様子を披露したり、クイズ大会などを開催いたします。お子様と一緒にぜひ遊びに来てください。","w":[{"t":"OmOchim(オモチム)","g":"アクション,教育・実用","p":"Steam","r":"未発売（2027年予定）","u":"https://store.steampowered.com/app/5029720/"}],"u":"https://www.asobism.co.jp/","s":"2027 年発売予定の Steam 物理サンドボックス『OmOchim』を先行試遊(ノベルティあり)。実体のオモチムをゲーム内プログラムで動かす筐体も展示。","si":630,"area":51,"size":"M"},{"b":"11-E22","t":"アバーメディア・テクノロジーズ","x":-83.6,"y":-355.6,"corner":"ゲーミングハードウェアコーナー","d":"AVerMediaは、ゲーム配信・録画をもっと自由に楽しむためのキャプチャーデバイスやマイク、Webカメラなどを展開するブランドです。\n\n今回のブースでは、本格的なゲーム配信環境から、タブレットを活用したモバイル配信、ポータブルゲーミングまで、さまざまなゲーム＆配信スタイルをご提案。最新製品を実際に操作しながら、ゲーム映像の取り込みやライブ配信、大画面でのゲームプレイをご体験いただけます。\n\nさらに、ゲストを迎えたステージイベントやSNSキャンペーン、TGS会場限定企画も実施予定です。ぜひAVerMediaブースで、あなたにぴったりのゲーム＆配信スタイルを見つけてください。","u":"https://www.avermedia.co.jp/","si":89,"area":33,"size":"S"},{"b":"09-E44","t":"アプライズ","x":-47.7,"y":-198.0,"c":"indie","corner":"インディーゲームコーナー","si":366,"area":3,"size":"S"},{"b":"10-W32","t":"アヤメ","x":-134.8,"y":-304.1,"corner":"物販コーナー","si":177,"area":15,"size":"S"},{"b":"10-C07","t":"アユート","x":-69.8,"y":-298.6,"corner":"ゲーミングハードウェアコーナー","d":"◆Audio事業部\n【Get ready for Another Music Experience】\n革新的な実用性を追求するゲーミングアクセサリーブランド「LEPIC GAMING」や「AZLA」のNintendo Switch 2向け最新アクセサリーの体験コーナーを展開。さらに「Astell&Kern」の本格的なハイレゾオーディオ機器や、「qdc」「FSF」「FitEar」「Noble Audio」「Maestraudio」「SENDY AUDIO」といった著名なゲーム音楽コンポーザーやクリエイターから高い評価を受けるイヤホン・ヘッドホンも展示予定。ゲームから音楽鑑賞まで、こだわりのHi-Fiサウンド体験をお楽しみいただけます！\n\n◆PC事業部\n【REAL GEAR FOR REAL GAMERS】\nプロゲーマーから自作PCユーザーまで高い評価を得ているゲーミングギア＆PCパーツブランド「COUGAR」。スタイリッシュなデザインと圧倒的な機能性を両立したゲーミングチェア＆ソファとハイエンド構成のゲーミングPCを日本初展示となる製品とともに出展。妥協なきクラフトマンシップと洗練された造形美が極上のゲーム体験と快適なデスク環境を提案します。","u":"https://www.aiuto-jp.co.jp/","si":90,"area":33,"size":"S"},{"b":"11-E04","t":"アラヤ","x":-43.6,"y":-349.2,"corner":"オールアクセシビリティコーナー","si":73,"area":10,"size":"S"},{"b":"11-W19","t":"アルジャーノンプロダクト","x":-122.1,"y":-363.5,"corner":"物販コーナー","d":"アルジャーノンプロダクト公式通販サイト「あるじゃんマーケット」がTOKYO GAME SHOW2026に出張出展！\n様々なGame関連のキャラクターグッズを販売いたします。","u":"https://algernonproduct.co.jp/","si":190,"area":48,"size":"S"},{"b":"09-E02","t":"アルティネット","x":-38.7,"y":-187.7,"c":"indie","g":"シューティング","gs":["シューティング"],"ps":["Steam"],"corner":"インディーゲームコーナー","d":"私たちは、日本でようやくインターネットが一般に普及し始めた1999年に起業しました。Ultinet（アルティネット）という社名に込めたのは、Ultimate（究極の）Internet価値創造者になるという私たちの決意です。普段はWebサイト・アプリ開発、業務システム、インフラ、運用保守、AI活用支援などを手がけるシステム開発会社ですが、東京ゲームショウではゲーム好きの社員が集まり、部活動のように楽しみながら制作したインディーゲームを出展しています。インターネットとものづくりの力で、仕事にも遊びにも新しい楽しさを生み出していきます。","w":[{"t":"さめぴったんこ","g":"シューティング","p":"Steam","r":"未発売（未定）","u":""}],"u":"https://www.ultinet.co.jp/","si":303,"area":3,"size":"S"},{"b":"E-06","t":"ア ,"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"『コロコロフレンズ』は、まんまるな球体キャラクターを操作してゴールを目指す、直感的でカオスな物理パズルアクションゲームです。\n\n操作は1スティック1ボタンと非常にシンプルで、基本アクションは「移動（転がる）」と「くっつく」の2つのみ。\n\n本作のコアとなるのが、ステージの至る所にあるモノへの「くっつき」です。回転するモノにくっついて勢いよく移動したり、トンカチにくっついて巨大な壁を豪快に壊したりと、プレイヤーのひらめき次第で思いもよらない攻略の可能性が広がります。\n\nさらに最大2人でのプレイに対応。友達との息を合わせた協力はもちろん、お互いに邪魔し合うカオスな展開も楽しめます。くっつきが生み出す「計算通りにいかないハプニング」をワイワイ楽しみながら、一緒にゴールへ飛び込みましょう！","w":[{"t":"コロコロフレンズ","g":"アクション,パズル","p":"Steam","r":"未発売（2027年）","u":""}],"si":813,"area":2,"size":"S"},{"b":"09-E50","t":"テオリアコード","x":-51.8,"y":-199.8,"c":"indie","corner":"インディーゲームコーナー","si":364,"area":3,"size":"S"},{"b":"09-C50","t":"デジタルハリウッド大学","x":-71.1,"y":-203.7,"c":"indie","g":"アドベンチャー","gs":["アドベンチャー","アクション","その他","リアルタイムストラテジー","パズル","シューティング"],"corner":"インディーゲームコーナー","d":"デジタルハリウッド大学は、デジタルコンテンツ（3DCG/VFX、ゲーム・プログラミング、映像、グラフィック、アニメ、Web、メディアアート等）と、企画・コミュニケーション（ビジネスプラン、マーケティング、広報PR等）を横断して学べる、1学部1学科の4年制大学です。\n本学のブースでは、チームや個人で制作したオリジナルゲーム8作品を展示します。\nアクション、アドベンチャー、ロボットゲーム、サバイバルホラーなど、ジャンルや世界観もさまざま。\n最初は形になるかも分からなかった作品が、1年をかけてここまで来ました。\n学生たちが作り切った8作品を、ぜひ会場で実際にプレイして体験してください。","w":[{"t":"マスク ミスティック","g":"アドベンチャー","p":"","r":"","u":""},{"t":"星海の記憶","g":"アクション,アドベンチャー","p":"","r":"未発売","u":""},{"t":"スパモン創世記","g":"その他","p":"","r":"","u":""},{"t":"インヴィ","g":"アクション","p":"","r":"","u":""},{"t":"フロントライン ガーディアン","g":"リアルタイムストラテジー","p":"","r":"未発売","u":""},{"t":"エクスプローラー","g":"パズル","p":"","r":"","u":""},{"t":"プロジェクト エスティジー","g":"シューティング","p":"","r":"","u":""},{"t":"エムエスキューブ","g":"その他","p":"","r":"","u":""}],"u":"https://www.dhw.ac.jp/","si":396,"area":3,"size":"S"},{"b":"E-28","t":"デッドリー・クロウ・ゲームズ","x":-16.6,"y":-267.7,"f":2,"c":"si80","g":"アドベンチャー,その他","gs":["アドベンチャー","その他"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"DeadlyCrow Gamesは、物語・アクション・空気感が交わる、濃密で記憶に残る体験を生み出すインディースタジオです。アメリカとチリを拠点に、手作りのアート、印象的なビジュアル、そして感情を揺さぶるストーリーテリングを融合させ、遊び終えたあとも心に残り続けるゲームを制作しています。近日公開のストップモーション・ホラーアドベンチャー『Mutter』のほか、『Lucerna』や『The Midnight Crimes』など、闇と謎、そして人間の心を独自の視点で描いた作品を手がけています。","w":[{"t": ":502,"area":78,"size":"M"},{"b":"09-E40","t":"ワンダーランドカザキリ","x":-51.6,"y":-193.3,"c":"indie","corner":"インディーゲームコーナー","si":339,"area":3,"size":"S"},{"b":"10-E30","t":"三和電子","x":-58.9,"y":-321.7,"corner":"ゲーミングハードウェアコーナー","si":118,"area":7,"size":"S"},{"b":"08-C02","t":"中西製作所","x":208.6,"y":75.9,"corner":"一般展示","si":627,"area":104,"size":"M"},{"b":"E-46","t":"健康機構","x":-22.8,"y":-242.5,"f":2,"c":"si80","g":"アドベンチャー,パズル","gs":["アドベンチャー","パズル"],"ps":["Steam"],"corner":"SELECTED INDIE 80","d":"『子どもたちの庭』は、幼くして死んだ子どもが石を積み続ける地獄「賽の河原」を舞台にしたパズルゲームです。プレイヤーは神より賜った玩具「おんぶつ」を積み上げ、ミッションを達成することで主人公の来世の寿命をより多く獲得することを目指します。短時間で展開するスピード感ある石積みゲームと、カオスなビジュアルと民話・教育玩具を融合させた、独自のアートゲーム体験。","w":[{"t":"子どもたちの庭","g":"アドベンチャー,パズル","p":"Steam","r":"未発売（2026年 秋 下旬）","u":""}],"si":788,"area":2,"size":"S"},{"b":"08-N15","t":"吉本興業","x":244.2,"y":40.3,"corner":"一般展示","si":643,"area":7,"size":"S"},{"b":"08-N12","t":"国立環境研究所","x":235.1,"y":41.7,"corner":"一般展示","d":"国立環境研究所は、環境・社会・経済に関する研究成果やシミュレーション技術を、一般の方が楽しみながら体験・学べるゲームへ展開するプロジェクト「Project:Leaves」を進めています。\n本プロジェクトでは、プレイヤーがゲーム内でさまざまな意思決定を行い、その選択によって未来の生活、社会、自然環境がどのように変化するのかを体験できるゲームを目指しています。\n環境問題の「正解」を一方向に伝えるのではなく、複数の目的の間で生じるシナジーやトレードオフ、選択の難しさを、物語とゲーム体験を通じて伝える新たな科学コミュニケーションの試みです。\n\n東京ゲームショウ2026では、構想中の世界観を紹介するPV、キービジュアル、キャラクターデザインを展示するほか、簡単なアンケートを実施し、回答後に国立環境研究所福島地域協働研究拠点の公式SNSをフォローまたは登録いただいた方を対象に、オリジナルノベルティグッズが当たる抽選企画を実施します。\n※ゲーム本体は現在、内容や仕様を検討している構想段階であり、今回の試遊展示はありません。","u":"https://www.nies.go.jp/","si":657,"area":8,"size":"S"},{"b":"E-73","t":"国鉄上野駅1979","x":-28.9,"y":-265.0,"f":2,"c":"si80","g":"シミュレーション,パズル","gs":["シミュレーション","パズル"],"ps":["PC (App)"],"corner":"SELECTED INDIE 80","d":"『国鉄上野駅1979』は、国鉄時代(1979年)の上野駅の１日の列車の着発をＰＣ上で再現します。　\nまだ新幹線が開業する前、北への玄関口として 東北奥羽常磐羽越上越信越方面への特急・急行列車が 昼夜を問わず数多く運転されていた時代、所定の時刻どおりに次々に出現する列車に 的確に入線させるホームを指示して、１日の定時運行を守りきりましょう！！！　\n\n漫然とプレイすると、ほどなくすべてのホームが列車であふれます。\n到着列車は 車内整備などですぐには折返さないため、必要に応じて各ホームから留置線などに逃がして ホームを空けてやる操作が必要になります。　\n終電まで定時運行を乱すことなく、１日を乗り切ることができればベストです。","w":[{"t":"国鉄上野駅1979","g":"シミュレーション,パズル","p":"PC
