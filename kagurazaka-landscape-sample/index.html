ons","author":"Higa4","license":"CC0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Atami-yu_(Kagurazaka,_Shinjuku)_02.jpg","at":"2026-09-26","w":1200,"h":900,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F24-6d603770.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F25","file":"images/F25-f13475f4.webp","kind":"現地写真","year":"2022","cap":"筑土八幡神社の朱塗りの社殿 (縮小)","places":["S04"],"claims":[],"src":"Wikimedia Commons","author":"Higa4","license":"CC0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Tsukudo_Hachiman-jinja_(Tsukudo-Hachimanch%C5%8D,_Shinjuku)_02.jpg","at":"2026-09-26","w":1000,"h":750,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F25-d78a412b.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F26","file":"images/F26-69aee664.webp","kind":"現地写真","year":"2022","cap":"梅花亭 神楽坂本店の店先。橙の看板と「御菓子司」の掛け看板(公式サイトの本店の写真と同じ店構え) (縮小・WebP に変換)","places":["S06"],"claims":[],"src":"Wikimedia Commons","author":"Araisyohei","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Baika-tei_in_Kagurazaka_2022-12-17_(1)_as.jpg","at":"2026-09-26","w":1200,"h":900,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F26-59e22ceb.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F27","file":"images/F27-0cab13c9.webp","kind":"現地写真","year":"2013","cap":"CANAL CAFE。外堀の水面と貸しボート、奥に店の建物とデッキ (縮小)","places":["S08"],"claims":[],"src":"Wikimedia Commons","author":"Daderot","license":"CC0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Canal_Cafe_-_Tokyo,_Japan_-_DSC06482.JPG","at":"2026-09-26","w":1200,"h":800,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F27-9a92a3aa.webp","w":240,"h":160}},{"rep":true,"crop":30,"id":"F28","file":"images/F28-04fb4cc6.webp","kind":"現地写真","year":"2021","cap":"神楽坂仲通り(神楽坂3丁目)を北から南へ見る。右手に「紅龍」「一品香」の看板、電柱に「神楽坂3-1」の番地表示 (WebP に変換)","places":["P14"],"claims":[],"src":"Mapillary","author":"musashino5","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/deed.ja","url":"https://www.mapillary.com/app/?pKey=204747371707352","at":"2026-09-26","w":1024,"h":768,"range":null,"mly":true,"thumb":{"file":"images/thumbs/F28-3aef0046.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F29","file":"images/F29-9f02577a.webp","kind":"現地写真","year":"2023","cap":"「牛込揚場」の碑。左に銅板の絵、右に碑文と「昭和五十九年三月 東京都」 (縮小・WebP に変換)","places":["P07"],"claims":[],"src":"Mapillary","author":"mura","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/deed.ja","url":"https://www.mapillary.com/app/?pKey=925345745514695","at":"2026-09-26","w":900,"h":675,"range":null,"mly":true,"thumb":{"file":"images/thumbs/F29-f69ea511.webp","w":240,"h":180}}],"story":[{"t":"h1","text":"神楽坂の歴史(5 分で話せる版)"},{"t":"p","text":"事実は `claims.md` の Claim から書いた。段落の末尾の [C..] が根拠。「〜という」「〜の説」と書いた段落は解釈か、資料が 1 つしかないもの。","refs":[],"img":null},{"t":"h2","text":"城の門と荷揚げ場(江戸)"},{"t":"p","text":"1636 年、江戸城の外堀とともに牛込御門が築かれた。門は 2 つの門を組み合わせた枡形で、外堀の城側、今の千代田区側にあった。飯田橋駅西口の石垣がその跡。[C03][C04]","refs":["C03","C04"],"img":"M01"},{"t":"p","text":"外堀は神田川につながり、江戸湾からの船が神楽河岸まで入った。揚場町で米・味噌・醤油・酒・材木を陸に揚げ、軽子が軽子坂を担いで上った。[C07]","refs":["C07"],"img":"M01"},{"t":"p","text":"坂の上は武家地と寺町だった。毘沙門天の善國寺は 18 世紀末に神楽坂へ移ってきた。移ってきた経緯は、区と寺で説明が違う。[C08][C17]","refs":["C08","C17"],"img":"M02"},{"t":"h2","text":"鉄道と花街(明治〜大正)"},{"t":"p","text":"1894 年 10 月、甲武鉄道の牛込駅が今の飯田橋駅西口のあたりに開業した。6 日に免許が下り、9 日に営業を始めた。[C13]","refs":["C13"],"img":"M18"},{"t":"p","text":"坂の北側の武家地に路地ができたのは明治に入ってからで、明治 20 年代の地図に芸者新道やかくれんぼ横丁が現れる。「江戸からの路地」ではない。[C17]","refs":["C17"],"img":"M04"},{"t":"p","text":"待合は 1895 年ごろから増え、1917 年には 77 軒になったという。花街ができた時期は、明治初期(寺)とも明治末(区)とも言われる。[C15][C16]","refs":["C15","C16"],"img":null},{"t":"h2","text":"震災と「山の手銀座」(大正末〜昭和初期)"},{"t":"p","text":"1923 年の関東大震災で、牛込区は大火をほぼ免れた。被害は各区で最も軽い部類だったが、坂下の揚場町では家が壊れている。当時の資料が挙げる理由は「火事にならなかった」ことで、「地盤が強かった」とする説には出典が見つからない。[C20][C21][C22]","refs":["C20","C21","C22"],"img":"E03"},{"t":"p","text":"1927 年、作家の加能作次郎は、神楽坂が「山の手の銀座」と呼ばれていると書いた。ただし、その呼び名は震災後まもなく新宿のものになる。1930 年代の案内記はそろって「新宿が神楽坂から山手銀座の名を奪った」と書いている。[C25][C27][C31]","refs":["C25","C27","C31"],"img":"E02"},{"t":"p","text":"坂の上の肴町には高島屋の「神楽坂十銭ストア」があり(1932 年の電話帳)、早慶戦で早稲田が勝つと学生は神楽坂で祝った。[C29][C30]","refs":["C29","C30"],"img":"E01"},{"t":"h2","text":"空襲と戦後"},{"t":"p","text":"1945 年、神楽坂は空襲で焼け野原になり、善國寺も焼けた。新宿区域の大空襲は 4 月 13 日と 5 月 24〜25 日の 2 回で、神楽坂がどちらで焼けたかは資料からは特定できない。近くの赤城神社は 4 月 13 日に焼けた。[C33][C34][C35]","refs":["C33","C34","C35"],"img":"M08"},{"t":"p","text":"戦後の空中写真を見ると、建物はまばらでも道筋は戦前と同じ。1951 年に「神楽坂」が正式な町名になり、1954 年には毘沙門天の縁日が戻った。[C36][C37][C40]","refs":["C36","C37","C40"],"img":"M07"},{"t":"h2","text":"路地が残った理由(研究者の説)"},{"t":"p","text":"松井・窪田(2012)によれば、戦災復興で大規模な区画整理が行われなかったため、街路の骨格が残った。細かな袋小路は多く消えたという。牛垣(2006)は、密集した料亭街の小さな敷地と建築基準法のために、建物が低中層のまま残ったと説明する。[C45]","refs":["C45"],"img":null},{"t":"p","text":"よく聞く「繁華街の競争に負けたからこそ残った」という説明は、出典が見つからない。[C46]","refs":["C46"],"img":null},{"t":"p","text":"1952 年に東京日仏学院が近くに開校し、今は通称「プチ・パリ」とも呼ばれる。[C39]","refs":["C39"],"img":null}],"base":{"stations":[{"name":"牛込神楽坂","x":447,"y":618},{"name":"飯田橋","x":1251,"y":522},{"name":"神楽坂","x":283,"y":284}],"size":[1537,995],"attribution":"© OpenStreetMap contributors (ODbL)","fetched":"2026-09-25","subways":[{"name":"東京メトロ丸ノ内線","short":"丸ノ内線","colour":"#F62E36"},{"name":"東京メトロ南北線","short":"南北線","colour":"#00AC9B"},{"name":"東京メトロ有楽町線","short":"有楽町線","colour":"#C1A470"},{"name":"東京メトロ東西線","short":"東西線","colour":"#009BBF"},{"name":"都営地下鉄大江戸線","short":"大江戸線","colour":"#B6007A"}]},"meta":{"sample":false,"proj":{"lng0":139.731,"lat1":35.7065,"mx":90398.87063347096,"my":110574},"bbox":[139.731,35.6975,139.748,35.7065],"data":"data","snapshot":"2026-09-25","counts":{"claims":48,"places":22,"images":57,"route":18}}}</script>
