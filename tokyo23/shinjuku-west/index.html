1. 水をつくる敷地から副都心へ"},{"t":"p","text":"高層ビル街を見る前に、東京の飲み水をつくった敷地として西口を読む。水道局は玉川上水の完成を1654年とし、区は明治のコレラ流行を近代水道整備の契機として説明する。","refs":[],"img":null},{"t":"p","text":"水道局によれば中島鋭治の提案で浄水場の建設位置が千駄ヶ谷から淀橋へ移された。これらは後年の公式編纂物に帰属する説明で、全てを独立した当時の記録で確定したものではない。[C01][C02][C03]","refs":["C01","C02","C03"],"img":null},{"t":"p","text":"区が1892年着工とする浄水場には、玉川上水の代田橋付近から水を導いた。当時の『東京市水道小誌』では新水路の着手1892年12月・全部完成1898年2月と読める。","refs":[],"img":null},{"t":"p","text":"浄水場の工事と、そこに水を届ける水路の工事を分けると、跡地の建物だけでは見えない広がりが分かる。","refs":[],"img":null},{"t":"p","text":"古図には新宿駅西側から浄水場へ曲がる線も見えるが、引込線の用途と稼働期間はまだ確定できない。図だけから資材の輸送量や旅客運行を物語に足さない。[C04][C05][C09][C28][C59]","refs":["C04","C05","C09","C28","C59"],"img":"M01"},{"t":"p","text":"「1898年の浄水場」と一口に言っても、通水・給水・施設の完成は同じ出来事ではない。水道局は1898年12月1日を給水開始とする一方、1911年の小誌は12月通水と翌年1月給水を分ける。","refs":[],"img":null},{"t":"p","text":"博物館の1898年竣工、区の1899年竣工、水道局の翌年のろ過池完成も、一本の完成日に置き換えない。面積の34万平方メートルと約56haも時点・対象境界が未解決で、広さを断定しない。[C06][C07][C08]","refs":["C06","C07","C08"],"img":null},{"t":"p","text":"浄水場が副都心へ変わる過程にも段階がある。1954年には促進会設立と移転請願、移転決定は公式資料で1954年と1957年に分かれる。","refs":[],"img":null},{"t":"p","text":"1960年には副都心の計画と建設公社、1964年には起工式が記される。淀橋浄水場の閉鎖日は1965年3月31日で、水道局と区の年表が一致する。","refs":[],"img":null},{"t":"p","text":"公社の事業完了1966/1967※二次と1968年の解散を同じ「終わり」にしない。計画区域約290千坪と約56haの違いも残して読む。[C10][C11][C12][C13][C14][C15][C16][C17][C18]","refs":["C10","C11","C12","C13","C14","C15","C16","C17","C18"],"img":null},{"t":"p","text":"現地で探す手がかりは正門跡の碑、住友ビルに紹介される蝶型弁、中央公園の六角堂と富士見台。区は碁盤の目の街区や低い敷地の面を池と地割の名残と説明するが、個々の段差を池の深さそのものとは言い切れない。","refs":[],"img":null},{"t":"p","text":"京王プラザホテルの1971年6月5日開業は当事者と区が一致する。都庁は業務開始1991年4月1日と、資料で1990/1991に分かれる竣工を区別する。","refs":[],"img":null},{"t":"p","text":"1968年開園の中央公園は、移設展示と操業当時の遺構を見比べる場所にもなる。[C19][C20][C21][C22][C24][C25][C26][C27]","refs":["C19","C20","C21","C22","C24","C25","C26","C27"],"img":"F01"},{"t":"h2","text":"2. 十二社の池と滝があった景勝地"},{"t":"p","text":"熊野神社の創建は一つの年に固定できない。神社自身が鈴木九郎の応永年間・1403年の伝承と、渡辺興兵衛の天文・永禄年間の説を併記する。","refs":[],"img":null},{"t":"p","text":"神社の説明では1606年に伊丹播磨守が大小の池を用水溜として開発した。池は神社西側の十二社通りを隔てたビルの区域にあったという。","refs":[],"img":null},{"t":"p","text":"茶屋の景勝地が明治以後に料亭・花柳界へ変わったという説明も神社に帰属させ、伝説と年代の確かさを区別する。[C29][C30][C31][C32]","refs":["C29","C30","C31","C32"],"img":"F02"},{"t":"p","text":"大池の消失は1968年という年が神社と博物館で一致するが、区年表の2月と神社の7月は一致しない。着手と完了の違いだったという説明は、裏付けがないので作らない。","refs":[],"img":null},{"t":"p","text":"小池については神社が戦中に完全に埋め立てられたとする。池を大小で分けることで「全部が1968年に消えた」とは書かずに済む。[C33][C34][C35]","refs":["C33","C34","C35"],"img":"F02"},{"t":"p","text":"滝は池と別の水路の話である。神社は1667年の神田上水助水堀が神社東端から落ちた場所に大滝ができ、多くの滝が明治以後の浄水場工事などで消えたと説明する。","refs":[],"img":null},{"t":"p","text":"公園にある現在の人工滝を、この江戸の滝の生き残りとして扱わない。旧落口の正確な位置は未特定で、今は区域を思い浮かべる跡地の地点となる。[C36][C37]","refs":["C36","C37"],"img":null},{"t":"p","text":"景勝地だった時代は、境内にある十二社の碑と大田南畝の水鉢からたどれる。博物館は碑を1851年の風致を賛える記念碑、水鉢を1820年奉納で南畝の揮毫と説明し、どちらも屋外公開と案内する。","refs":[],"img":null},{"t":"p","text":"公園の六桜社工場跡は1902〜1963年の写真感光材製造の跡と管理者が説明するが、工場建物が残っているという意味ではない。[C38][C39][C23]","refs":["C38","C39","C23"],"img":null},{"t":"h2","text":"3. 闇市の路地と西口の広場"},{"t":"p","text":"思い出横丁の振興組合は、1946年頃に現れた闇市ラッキーストリートを前身と説明する。戸板一枚で区切る店の造りが、壁を接した今の店舗に受け継がれたという。","refs":[],"img":null},{"t":"p","text":"1959年頃に約300軒が立ち退いたという年代と数は同じ組合の自己記述1資料で、1945年起源説の当事者原典をまだ読めていない。路地の風情を根拠に年を確定しない。[C40][C41][C42]","refs":["C40","C41","C42"],"img":null},{"t":"p","text":"西口立体広場は区年表によれば1964年11月12日着工、1966年11月25日完成、翌26日使用開始。地下を歩くときは、完成と使い始めた日を分けて考える。","refs":[],"img":null},{"t":"p","text":"1969年の反戦フォーク集会の衝突は、区年表6月29日と研究論文6月28日※二次が食い違う。当時の新聞原典が未見のため、同じ局面とみなして日を選ばない。[C43][C44][C45]","refs":["C43","C44","C45"],"img":null},{"t":"p","text":"この広場は2026-10時点で再整備中でもある。東京都の工事案内は通路変更と10月からの道路改良工事を告知する。過去の広場の形を、そのまま今日の歩ける経路として描かない。","refs":[],"img":null},{"t":"p","text":"策の井も井戸自体は蓋をされ、現在見るのは代わりのモニュメントと説明板。残っている物と失われた物を見分けて歩く。[C46][C58]","refs":["C46","C58"],"img":null},{"t":"h2","text":"4. 青梅街道と淀橋、寺社の記憶"},{"t":"p","text":"区は青梅街道を1606年の江戸城修築の石灰運搬路、当時の成木往還と説明する。道を西へ進んだ淀橋の名前には余戸・四所橋・京都の淀など複数の説がある。","refs":[],"img":null},{"t":"p","text":"京都になぞらえた将軍も区の資料で家光と吉宗に分かれ、唯一の語源を選べない。「姿見ずの橋」の話は中野長者・鈴木九郎にまつわる伝説として読む。[C47][C48][C49]","refs":["C47","C48","C49"],"img":null},{"t":"p","text":"成子天神社の903年創建は社伝に帰属する。一方、成子神社への1894年改称、成子天神社への1928年改称は神社と区が一致する。","refs":[],"img":null},{"t":"p","text":"近年の整備は神社の2013年御造営と区の2014年大規模整備に分かれる。1920年築造・高さ12mという成子富士の説明は博物館1資料で、水準点の設置年・等級も未確認。","refs":[],"img":null},{"t":"p","text":"古い記憶と近年の整備を、どちらも年表の状態を保ったまま見る。[C50][C51][C52][C53][C57]","refs":["C50","C51","C52","C53","C57"],"img":null},{"t":"p","text":"常圓寺は開創年月を不詳とし、1585年9月13日に幡ヶ谷辺から現在地へ移転したと説明する。戦災で失った堂宇や、移築・再建した建物は寺の自己記述に帰属する。","refs":[],"img":null},{"t":"p","text":"便々館湖鯉鮒の狂歌碑は寺が1819年建碑と記し、大田南畝の筆は博物館の説明とも一致する。ただし博物館は観覧に事前連絡が必要と案内しているため、通常の散歩は寺の外観を中心にする。[C54][C55][C56]","refs":["C54","C55","C56"],"img":null}],"base":{"stations":[{"name":"新線新宿","x":1417,"y":984},{"name":"新宿","x":1472,"y":793},{"name":"新宿西口","x":1417,"y":482},{"name":"都庁前","x":842,"y":762},{"name":"西武新宿","x":1494,"y":232},{"name":"西新宿五丁目","x":92,"y":842},{"name":"西新宿","x":838,"y":339}],"size":[1627,1272],"attribution":"© OpenStreetMap contributors (ODbL)","fetched":"2026-10-03","subways":[{"name":"東京メトロ丸ノ内線","short":"丸ノ内線","colour":"#F62E36"},{"name":"東京メトロ副都心線","short":"副都心線","colour":"#B74D17"},{"name":"都営地下鉄大江戸線","short":"大江戸線","colour":"#B6007A"},{"name":"都営地下鉄新宿線","short":"新宿線","colour":"#6CBB5A"}]},"meta":{"sample":false,"proj":{"lng0":139.6835,"lat1":35.6975,"mx":90410.49081724972,"my":110574},"bbox":[139.6835,35.686,139.7015,35.6975],"data":"data","snapshot":"2026-10-02","counts":{"claims":59,"places":22,"images":15,"route":14}},"attribution3d":{"gsi":"国土地理院「地理院タイル(標高タイル(基盤地図情報数値標高モデル) DEM5A・DEM10B)」(https://maps.gsi.go.jp/development/ichiran.html)を本ページの作成者が加工(欠けの補い・格子化・バイナリ化)、取得日 2026-10-03","plateau":"国土交通省「3D都市モデル(Project PLATEAU)新宿区(2025年度)」(https://www.geospatial.jp/ckan/dataset/plateau-13104-shinjuku-ku-2025)を本ページの作成者が加工(建築物 LOD1 の外形と measuredHeight の抽出。渋谷区・中野区の区域の棟を含む)、著作権は新宿区、PDL1.0(CC BY 4.0 互換)、取得日 2026-10-03"}}</script>
