<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>神楽坂 歴史散歩</title>
<meta name="description" content="神楽坂の歴史散歩の地図と年表。地点(Place)と主張(Claim)を、根拠の Source と一緒に見る">
<style>
/* app.css — 神楽坂 歴史散歩マップの見た目。build_map.py が dist/map.html にインライン化する。
   レイアウトの規則は TGS / 大阪と同じスロット制:
     スマホ(幅 720px 以下) 下からのシートを常に 1 枚(年表の List か Detail)
     PC                     左 = 地図(480px 以上を保証) / 右の列 = 上が List・下が Detail
   地図は領域のどこでもパン・ピンチできる(SVG 全面の #bgHit、地図と親に touch-action: none)。
   フォントは端末のもの(--font-jp / --font-num)。外部リソースは読まない。 */

:root {
  --font-jp: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", var(--font-jp);

  --ground: #E9E4DA;
  --land: #F3EFE6;
  --panel: #FCFAF6;
  --panel-2: #F1ECE2;
  --line: #D8D0C1;
  --ink: #221F1B;
  --ink-2: #4E4840;
  --ink-3: #6A6258;
  --accent: #A8351C;
  --accent-ink: #FFFFFF;
  --focus: #1F5FA8;
  /* 下地(OpenStreetMap 由来の簡略 SVG) */
  --water: #B9D3E3;
  --bldg: #E3DCCD;
  --road: #FFFFFF;
  --road-major: #F1D9A8;
  --road-path: #D5C8B2;
  --steps: #A89F90;   /* 階段: 路地(--road-path)を少し濃くしたグレー。順路の線・Pin より目立たせない */
  --rail: #5A6068;
  --rail-sub: #8C9199;
  --station: #3F3A33;
  --sub-op: .5;
  /* 順路と Pin */
  --route: #A8351C;
  --pin: #A8351C;
  --pin-ink: #FFFFFF;
  --pin-off: #FFFFFF;
  --pin-off-ink: #A8351C;
  --hl: #1F5FA8;
  --me: #1A73E8;
  --spot-see: #1F5FA8;
  --spot-rest: #2F7A3A;
  /* チップ(種類・格・状態) */
  --c-fact: #4E4840;
  --c-num: #1F5FA8;
  --c-cmp: #1C7A6E;
  --c-interp: #7A3F9E;
  --c-ok: #2F7A3A;
  --c-var: #9A5B00;
  --c-attr: #7A3F9E;
  --c-check: #B42318;
  --shadow: 0 8px 24px rgba(40, 30, 20, .16);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #111315; --land: #17191B; --panel: #1F2224; --panel-2: #282B2E; --line: #3A3E42;
    --ink: #ECE8E1; --ink-2: #C4BDB2; --ink-3: #A39B8F;
    --accent: #F08A6C; --accent-ink: #1A0F0B; --focus: #7FB0F0;
    --water: #243A4C; --bldg: #2A2D30; --road: #3B3F43; --road-major: #5A4D33; --road-path: #4A463F;
    --steps: #6E695F; --rail: #A7ADB5; --rail-sub: #767C84; --station: #D9D4CB; --sub-op: .5;
    --route: #F08A6C; --pin: #F08A6C; --pin-ink: #1A0F0B; --pin-off: #1F2224; --pin-off-ink: #F08A6C; --hl: #7FB0F0; --me: #4C9AFF; --spot-see: #7FB0F0; --spot-rest: #7BC98A;
    --c-fact: #C4BDB2; --c-num: #7FB0F0; --c-cmp: #5CC4B5; --c-interp: #C79BEA;
    --c-ok: #7BC98A; --c-var: #E7B45A; --c-attr: #C79BEA; --c-check: #F4877D;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #111315; --land: #17191B; --panel: #1F2224; --panel-2: #282B2E; --line: #3A3E42;
  --ink: #ECE8E1; --ink-2: #C4BDB2; --ink-3: #A39B8F;
  --accent: #F08A6C; --accent-ink: #1A0F0B; --focus: #7FB0F0;
  --water: #243A4C; --bldg: #2A2D30; --road: #3B3F43; --road-major: #5A4D33; --road-path: #4A463F;
  --steps: #6E695F; --rail: #A7ADB5; --rail-sub: #767C84; --station: #D9D4CB; --sub-op: .5;
  --route: #F08A6C; --pin: #F08A6C; --pin-ink: #1A0F0B; --pin-off: #1F2224; --pin-off-ink: #F08A6C; --hl: #7FB0F0; --me: #4C9AFF; --spot-see: #7FB0F0; --spot-rest: #7BC98A;
  --c-fact: #C4BDB2; --c-num: #7FB0F0; --c-cmp: #5CC4B5; --c-interp: #C79BEA;
  --c-ok: #7BC98A; --c-var: #E7B45A; --c-attr: #C79BEA; --c-check: #F4877D;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--font-jp); font-size: 14px; line-height: 1.55; overflow: hidden;
}
button { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#stash { display: none; }
[hidden] { display: none !important; }
.spacer { flex: 1 1 auto; }

.app { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* ---------- ヘッダー ---------- */
.bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; }
.brand .sub { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.samplebadge {
  font-size: 12px; font-weight: 700; color: var(--c-check); border: 1.5px dashed var(--c-check);
  padding: 1px 8px; border-radius: 999px; white-space: nowrap;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-height: 36px; padding: 0 14px; border-radius: 10px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink); white-space: nowrap;
}
.btn:hover { background: var(--panel-2); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: 13px; }

/* ---------- 本体(地図と列) ---------- */
.main { position: relative; min-height: 0; min-width: 0; display: flex; align-items: stretch; touch-action: none; }
.stage { position: relative; min-height: 0; min-width: 0; flex: 1 1 auto; overflow: hidden; touch-action: none; }
.col { display: none; }

svg.map {
  width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
  background: var(--ground); user-select: none; -webkit-user-select: none;
}
svg.map.dragging { cursor: grabbing; }
#bgHit { fill: transparent; pointer-events: all; }
#base, #base * { pointer-events: none; }

/* 下地。--u = 画面 1px が何 m か(1/k)。線は「実幅」と「画面上の最小幅」の大きいほう */
.land { fill: var(--land); }
.water { fill: var(--water); }
.bldg { fill: var(--bldg); }
.rd { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.rd-major { stroke: var(--road-major); stroke-width: max(14px, calc(var(--u) * 5px)); }
.rd-mid { stroke: var(--road); stroke-width: max(9px, calc(var(--u) * 4px)); }
.rd-minor { stroke: var(--road); stroke-width: max(6px, calc(var(--u) * 3px)); }
.rd-service { stroke: var(--road); stroke-width: max(3.5px, calc(var(--u) * 1.6px)); }
.rd-path { stroke: var(--road-path); stroke-width: max(2px, calc(var(--u) * 1.3px)); }
.rd-steps { stroke: var(--steps); stroke-width: max(2.5px, calc(var(--u) * 1.8px)); stroke-dasharray: max(1.2px, calc(var(--u) * 2px)); stroke-linecap: butt; }
.rl { fill: none; stroke-linejoin: round; }
.rl-jr { stroke: var(--rail); stroke-width: max(5px, calc(var(--u) * 2.5px)); }
.rl-sub { stroke: var(--rail-sub); stroke-width: calc(var(--u) * 2px); opacity: var(--sub-op); }   /* 地下鉄: 細い実線・半透明(順路より目立たせない) */
.rl-c { stroke: var(--lc); }
.subl text {
  font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round;
  fill: color-mix(in srgb, var(--lc, var(--rail-sub)) 55%, var(--ink));
}
.route {
  /* 順路の線: 細く薄い実線(主役は Pin。2026-09-26 ユーザー決定) */
  fill: none; stroke: var(--route); stroke-width: 2px; vector-effect: non-scaling-stroke;
  stroke-linecap: round; stroke-linejoin: round; opacity: .55; pointer-events: none;
}

/* 画面座標の層(Pin と駅名は拡大しても同じ大きさ) */
#overlay { pointer-events: none; }
.st circle { fill: var(--panel); stroke: var(--station); stroke-width: 2; }
.st text {
  fill: var(--station); font-size: 12px; font-weight: 600; paint-order: stroke;
  stroke: var(--ground); stroke-width: 3.5px; stroke-linejoin: round;
}
.pin { cursor: pointer; pointer-events: all; }
.pin .hit { fill: transparent; }
.pin .ring { fill: none; stroke: var(--hl); stroke-width: 3; opacity: 0; }
.pin .dot { fill: var(--pin); stroke: var(--panel); stroke-width: 2.5; }
.pin .num { fill: var(--pin-ink); font-family: var(--font-num); font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.pin.hov .ring { opacity: 1; stroke: var(--ink); }
.pin .name {
  pointer-events: none;
  fill: var(--ink); font-size: 12px; font-weight: 600; paint-order: stroke;
  stroke: var(--ground); stroke-width: 3.5px; stroke-linejoin: round;
}
.pin.hl .ring { opacity: 1; }
.pin.hl .dot { stroke: var(--hl); stroke-width: 3; }
.pin.sel .dot { stroke: var(--ink); stroke-width: 3; }
.pin.dim { opacity: .45; }

.hud { position: absolute; right: 10px; top: 10px; }
.attr {
  position: absolute; left: 6px; bottom: 4px; font-size: 10.5px; color: var(--ink-3);
  background: color-mix(in srgb, var(--ground) 80%, transparent); padding: 0 4px; border-radius: 4px; pointer-events: none;
}

/* ---------- パネル ---------- */
.slot { min-height: 0; display: flex; }
.slot > .panel { flex: 1 1 auto; }
.panel { display: none; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); }
.panel.open { display: flex; }
.phead { flex: 0 0 auto; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.hrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.phead h2 { margin: 0; font-size: 15px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.phead .status { color: var(--ink-3); font-weight: 500; font-size: 12px; margin-left: 6px; }
.pdet .phead h2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.badge {
  flex: 0 0 auto; font-family: var(--font-num); font-size: 12px; font-weight: 700;
  padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); white-space: nowrap;
}
.badge.claim { background: var(--panel-2); color: var(--ink); }
.pbody { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; touch-action: pan-y; }

/* 年表 */
.era { position: sticky; top: 0; z-index: 1; padding: 4px 14px; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--panel-2); border-bottom: 1px solid var(--line); }
.crow {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 2px 10px; width: 100%; text-align: left;
  padding: 10px 14px; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
  cursor: pointer; content-visibility: auto; contain-intrinsic-size: auto 72px;
}
.crow:hover { background: var(--panel-2); }
.crow[aria-current="true"] { background: color-mix(in srgb, var(--hl) 12%, var(--panel)); box-shadow: inset 3px 0 0 var(--hl); }
.crow .when { font-family: var(--font-num); font-weight: 700; font-size: 14px; color: var(--ink-2); line-height: 1.35; font-variant-numeric: tabular-nums; }
.crow .txt { font-size: 14px; line-height: 1.5; }
.crow .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 3px; }
.crow .np { font-size: 11.5px; color: var(--ink-3); }
.interp .txt, .ctext.interp { font-style: italic; }
.crow.interp { box-shadow: inset 3px 0 0 transparent; background-image: linear-gradient(var(--c-interp), var(--c-interp)); background-size: 2px 100%; background-repeat: no-repeat; background-position: 6px 0; }
.crow.interp[aria-current="true"] { box-shadow: inset 3px 0 0 var(--hl); }
.ilabel { font-style: normal; font-weight: 700; color: var(--c-interp); margin-right: 4px; }

.chip {
  display: inline-flex; align-items: center; font-size: 11.5px; line-height: 1; padding: 3px 7px; border-radius: 999px;
  border: 1px solid currentColor; white-space: nowrap; font-style: normal; font-weight: 600;
}
.k-事実 { color: var(--c-fact); } .k-数値 { color: var(--c-num); } .k-比較 { color: var(--c-cmp); }
.k-解釈 { color: var(--c-interp); border-style: dashed; }
.g-一次 { color: var(--panel); background: var(--ink-2); border-color: var(--ink-2); }
.g-準一次 { color: var(--ink-2); }
.g-二次 { color: var(--ink-3); border-style: dotted; }
.s-確定 { color: var(--c-ok); } .s-諸説 { color: var(--c-var); } .s-帰属 { color: var(--c-attr); } .s-要確認 { color: var(--c-check); }

/* 詳細 */
.dsec { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dsec h3 { margin: 0 0 4px; font-size: 12px; color: var(--ink-3); font-weight: 700; letter-spacing: .04em; }
.dsec p { margin: 0; }
.dsec .chips { display: flex; flex-wrap: wrap; gap: 6px; }
blockquote.quote { margin: 0; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--panel-2); border-radius: 0 8px 8px 0; }
.srcs { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.srcs a { word-break: break-all; display: inline-block; padding: 4px 0; }
.small { font-size: 12px; color: var(--ink-3); }
.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.citem { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); }
.citem.interp { border-style: dashed; border-color: var(--c-interp); }
.citem .open { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 0; min-height: 36px; cursor: pointer; }
.citem .when { font-family: var(--font-num); font-weight: 700; color: var(--ink-2); margin-right: 6px; }
.citem .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.citem .meta a { font-size: 12px; padding: 4px 2px; }
.plink { display: flex; flex-wrap: wrap; gap: 6px; }
.plink .btn { min-height: 40px; }

/* ---------- PC: 右の列(上 = 年表 / 下 = 詳細) ---------- */
@media (min-width: 721px) {
  .col {
    display: flex; flex: 0 1 380px; min-width: 280px; min-height: 0;
    background: var(--panel); overflow: hidden;
  }
  .col > .slot { flex: 1 1 auto; min-width: 0; }
  .col-l { border-right: 1px solid var(--line); }
  .col-r { border-left: 1px solid var(--line); }
  .col[hidden] { display: none !important; }
  .stage { flex: 1 0 480px; min-width: 480px; }
  .sheet, .dhandle, #listBtn { display: none !important; }
  .pclose[data-act="close"] { display: none; }
  .pdet .pclose[data-act="close"] { display: inline-flex; }
}

/* ---------- スマホ: 下からのシート 1 枚 ---------- */
@media (max-width: 720px) {
  .bar { padding: 6px 12px; }
  .brand .sub { display: none; }
  .btn { min-height: 44px; }
  .btn.small { min-height: 44px; min-width: 44px; }
  .crow { min-height: 56px; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; height: 62%;
    display: flex; background: var(--panel); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
    transform: translateY(105%); transition: transform .22s ease; touch-action: pan-y;
  }
  .sheet.det { height: 46%; }
  .sheet.open { transform: translateY(0); }
  .sheet:not(.open) { pointer-events: none; visibility: hidden; }
  .sheet .slot { flex: 1 1 auto; min-width: 0; }
  .sheet .panel { border-radius: 16px 16px 0 0; }
  .sheet .phead { padding-top: 14px; position: relative; }
  .sheet .phead::before {
    content: ""; position: absolute; left: 50%; top: 5px; width: 36px; height: 4px; margin-left: -18px;
    border-radius: 2px; background: var(--line);
  }
  .dhandle {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 4;
    min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); cursor: pointer;
  }
  .dhandle[hidden] { display: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }

/* ---------- タブ(地図 / 読み物) ---------- */
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: 0 0 auto; }
.tab { min-height: 36px; padding: 0 12px; border: 0; background: var(--panel); cursor: pointer; font-weight: 600; white-space: nowrap; }
.tab + .tab { border-left: 1px solid var(--line); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--panel); }

/* ---------- 画像(Detail・年表・読み物) ---------- */
.imgs .imgsec + .imgsec { margin-top: 12px; }
.imgsec > h3 { margin: 0 0 6px; font-size: 12px; color: var(--ink-3); font-weight: 700; letter-spacing: .04em; }
.fig { margin: 0 0 10px; }
.figbtn { display: flex; justify-content: center; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel-2); cursor: zoom-in; }
.fig img, .thumb img, .lb-body img { display: block; max-width: 100%; height: auto; }
.fig img { height: auto; }
.fig figcaption { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; margin-top: 4px; font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.fig .cap { color: var(--ink); font-weight: 600; }
.fig .yr, .lb-cap .yr { font-family: var(--font-num); font-weight: 700; }
.credit { color: var(--ink-3); }
.orig { font-size: 12px; padding: 2px 0; }
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.cmp.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cmp.n3 figcaption .credit, .cmp.n4 figcaption .credit { font-size: 11px; }
.cmp.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cmp-yr { font-family: var(--font-num); font-weight: 700; font-size: 15px; color: var(--ink-2); margin-bottom: 2px; }
.in-cmp figcaption .cap { font-weight: 500; }
.cwrap { border-bottom: 1px solid var(--line); content-visibility: auto; contain-intrinsic-size: auto 80px; }
.cwrap .crow { border-bottom: 0; content-visibility: visible; }
.thumbs { display: flex; gap: 6px; align-items: center; padding: 0 14px 10px calc(14px + 76px + 10px); }
.thumb { position: relative; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel-2); cursor: zoom-in; width: 64px; height: 48px; flex: 0 0 auto; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.crow.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--hl) 35%, var(--panel)); } 100% { background: transparent; } }

/* ---------- 拡大表示 ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
  background: rgba(10, 10, 10, .92); color: #F2F0EC;
}
.lightbox[hidden] { display: none !important; }
.lb-bar { min-width: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
.lb-title { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-bar .btn { flex: 0 0 auto; min-height: 44px; background: #F2F0EC; color: #111; border-color: #F2F0EC; font-weight: 700; }
.lb-body { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px; overflow: auto; touch-action: pinch-zoom pan-x pan-y; }
.lb-body img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.lb-cap { min-width: 0; overflow-wrap: anywhere; max-height: 30vh; overflow: auto; display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 8px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom)); font-size: 12.5px; }
.lb-cap .credit { color: #C9C4BB; }
.lb-cap a { color: #9CC3F5; }

/* ---------- 読み物(全画面のビュー) ---------- */
.storyview {
  position: absolute; inset: 0; z-index: 20; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
  background: var(--panel);
}
.story-bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.story { max-width: 720px; margin: 0 auto; padding: 8px 16px 64px; font-size: 16px; line-height: 1.9; }
.story h1 { font-size: 22px; line-height: 1.4; margin: 18px 0 8px; }
.story h2 { font-size: 18px; margin: 28px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
.story p { margin: 0 0 12px; }
.story code { font-size: .9em; background: var(--panel-2); padding: 0 4px; border-radius: 4px; }
.cref {
  display: inline-block; font-family: var(--font-num); font-size: 12.5px; font-weight: 700; line-height: 1.6;
  padding: 0 7px; margin: 0 1px; border-radius: 999px; border: 1px solid var(--focus); text-decoration: none; vertical-align: 1px;
}
.story .illus { max-width: 480px; margin: 4px 0 20px; }
@media (max-width: 720px) {
  .tab { min-height: 44px; padding: 0 10px; }
  .brand h1 { font-size: 15px; }
  .cref { padding: 4px 9px; }
  .thumbs { padding-left: 14px; }
}

/* ---------- 現地写真が主役(Detail の先頭・順路の一覧) ---------- */
.herosec { padding: 0; border-bottom: 1px solid var(--line); }
.hero { margin: 0; }
.hero .figbtn, .hero.empty { height: 220px; border: 0; border-radius: 0; }
.hero .figbtn img { width: 100%; height: 100%; object-fit: cover; }
.hero figcaption { padding: 4px 14px 8px; }
.hero.empty {
  display: flex; align-items: center; justify-content: center; background: var(--panel-2); color: var(--ink-3);
  font-size: 13px; font-weight: 600; background-image: repeating-linear-gradient(135deg, transparent 0 10px, color-mix(in srgb, var(--line) 45%, transparent) 10px 11px);
}
.lmode { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.lm { min-height: 32px; padding: 0 12px; border: 0; background: var(--panel); cursor: pointer; font-weight: 700; font-size: 14px; white-space: nowrap; }
.lm + .lm { border-left: 1px solid var(--line); }
.lm[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.lm[aria-pressed="true"] .status { color: inherit; opacity: .8; }
.prow {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; height: 88px;
  padding: 8px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer;
}
.prow:hover { background: var(--panel-2); }
.prow[aria-current="true"] { background: color-mix(in srgb, var(--hl) 12%, var(--panel)); box-shadow: inset 3px 0 0 var(--hl); }
.pthumb { width: 96px; height: 72px; border-radius: 8px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb.empty { color: var(--ink-3); font-size: 11px; font-weight: 600; text-align: center; line-height: 1.3; padding: 4px;
  background-image: repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--line) 45%, transparent) 8px 9px); }
.ptext { display: grid; gap: 2px; min-width: 0; }
.pname { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pname .badge { font-size: 11.5px; padding: 0 7px; }
.pwhat { font-size: 12px; color: var(--ink-3); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (min-width: 721px) { .hero .figbtn, .hero.empty { height: 240px; } }
@media (max-width: 720px) { .lm { min-height: 44px; } }

/* ---------- ホバーのカード(PC のマウスだけ) ---------- */
.hovercard {
  position: absolute; left: 0; top: 0; z-index: 6; width: 188px; pointer-events: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
}
.hovercard img { display: block; width: 100%; height: 132px; object-fit: cover; background: var(--panel-2); }
.hc-empty {
  display: flex; align-items: center; justify-content: center; height: 132px; font-size: 12px; font-weight: 600; color: var(--ink-3);
  background: var(--panel-2) repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in srgb, var(--line) 45%, transparent) 8px 9px);
}
.hc-name { display: block; padding: 6px 10px 8px; font-weight: 700; font-size: 13px; line-height: 1.4; }
@media not ((hover: hover) and (pointer: fine)) { .hovercard { display: none !important; } }

/* ---------- Google マップのリンク・現在地(Pages 版)・短い案内 ---------- */
.gmap { padding-top: 6px; padding-bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px 20px; }
.gmap a { display: inline-flex; align-items: center; min-height: 36px; font-weight: 600; }
.hud { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
#locBtn[aria-pressed="true"] { background: var(--me); color: #fff; border-color: var(--me); }
.me-acc { fill: color-mix(in srgb, var(--me) 16%, transparent); stroke: color-mix(in srgb, var(--me) 55%, transparent); stroke-width: 1; }
.me-dot { fill: var(--me); stroke: #fff; stroke-width: 2.5; }
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 7; max-width: calc(100% - 140px);
  padding: 8px 14px; border-radius: 10px; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow); pointer-events: none;
}
@media (max-width: 720px) { .gmap a { min-height: 44px; } }

/* ---------- Spot の Pin(今の見どころ = ひし形 / 休憩 = 角の丸い四角。番号なし) ---------- */
.pin.see .dot { fill: var(--spot-see); stroke: var(--panel); stroke-width: 2.5; }
.pin.rest .dot { fill: var(--spot-rest); stroke: var(--panel); stroke-width: 2.5; }

/* ---------- Filter(地図の左上。ボタンの外は地図の操作のまま) ---------- */
.filters { position: absolute; left: 10px; top: 10px; z-index: 4; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 96px); pointer-events: none; }
.fbtn {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-3); font-size: 13px; font-weight: 600;
  cursor: pointer; box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
}
.fbtn[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); }
.fbtn[aria-pressed="false"] { text-decoration: line-through; opacity: .75; }
.fk { width: 11px; height: 11px; display: inline-block; flex: 0 0 auto; }
.fk-h { border-radius: 50%; background: var(--pin); }
.fk-s { background: var(--spot-see); transform: rotate(45deg) scale(.85); }
.fk-r { background: var(--spot-rest); border-radius: 3px; }
.fbtn[aria-pressed="false"] .fk { opacity: .35; }
.toast { top: 56px; }
@media (max-width: 720px) { .fbtn { min-height: 44px; padding: 0 12px; } }

/* Mapillary のロゴ(画像のクレジットの隣。背景の画像は build_map.py が公式の PNG を埋め込む。縦横比 3:1 のまま縮小) */
.mly { display: inline-flex; align-items: center; min-height: 24px; }
.mly-logo { display: inline-block; width: 60px; height: 20px; background-size: 100% 100%; background-repeat: no-repeat; border-radius: 3px; }
@media (max-width: 720px) { .mly { min-height: 32px; } }

<div class="app">
  <header class="bar" id="bar">
    <div class="brand">
      <h1>神楽坂 歴史散歩</h1>
    </div>
    <span class="samplebadge" id="sampleBadge" hidden>サンプル</span>
    <div class="spacer"></div>
    <nav class="tabs" aria-label="表示の切り替え">
      <button type="button" class="tab" id="tabMap" aria-pressed="true">地図</button>
      <button type="button" class="tab" id="tabStory" aria-pressed="false">読み物</button>
    </nav>
    <button type="button" class="btn" id="listBtn" aria-pressed="false">一覧</button>
  </header>
  <div class="main" id="main">
    <section class="col col-l" id="colL" aria-label="一覧の列"><div class="slot" id="slotL"></div></section>

      <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="神楽坂の地図(OpenStreetMap をもとにした簡略図)">
        <rect id="bgHit" x="0" y="0" width="100%" height="100%"/>
        <g id="view">
          <g id="base"></g>
          <path id="route" class="route" d=""/>
        </g>
        <g id="overlay">
          <g id="subLabels"></g>
          <g id="stations"></g>
          <g id="me"></g>
          <g id="pins"></g>
        </g>

<script>window.KAGURAZAKA = {"claims":[{"id":"C01","date":"1555","y":1555,"m":null,"d":null,"era":"中世","text":"上野国の大胡氏が牛込に移って牛込氏を名のり、袋町一帯の高台に居城(牛込城)を置いた","kind":"事実","grade":"準一次","quote":"区「天文24年（1555）、牛込氏を名のりました。…その居城は袋町一帯の高台にありました」/ 赤城神社「弘治元年（1555年）に、大胡宮内少輔（牛込氏）が現在の場所に遷した」(同年改元)","srcs":["https://www.city.shinjuku.lg.jp/kanko/file02_00002.html","https://www.akagi-jinja.jp/akagi/pedigree/"],"at":"2026-09-25","status":"確定","places":["P22","P24"]},{"id":"C02","date":"1595","y":1595,"m":null,"d":null,"era":"江戸","text":"毘沙門天 善國寺が馬喰町に創建された","kind":"事実","grade":"準一次","quote":"区「創建年代 文禄4年（1595）」/ 寺「文禄4年（1595年）に創設され」","srcs":["https://bunkakanko-annai.city.shinjuku.lg.jp/shosai3/?id=F009","https://kagurazaka-bishamonten.com/about/"],"at":"2026-09-25","status":"確定","places":["P18"]},{"id":"C03","date":"1636","y":1636,"m":null,"d":null,"era":"江戸","text":"江戸城外堀が造られ、牛込門(牛込見附)の枡形石垣が徳島藩主 蜂須賀忠英によって築かれた","kind":"事実","grade":"準一次","quote":"千代田区「牛込門は1636年（寛永13年）に、阿波徳島藩…藩主蜂須賀忠英…により築造されました」/ 区年表「寛永13（1636）年 江戸城外堀の牛込〜赤坂間を建設。同時に牛込・市谷・四谷の枡形石垣が築かれる」","srcs":["https://www.edo-chiyoda.jp/knainobunkazai/bunkazaisign_hyochu_setsumeiban/1/1/263.html","https://www.city.shinjuku.lg.jp/kusei/70kinenshi/edo.html"],"at":"2026-09-25","status":"確定","places":["P02","P03"]},{"id":"C05","date":"1645","y":1645,"m":null,"d":null,"era":"江戸","text":"牛込城跡に光照寺が神田から移った","kind":"事実","grade":"準一次","quote":"区「牛込氏の城館・牛込城跡で、正保2年(1645)光照寺が神田から移った」(1 資料)","srcs":["https://bunkakanko-annai.city.shinjuku.lg.jp/course/shosai7/"],"at":"2026-09-25","status":"確定","places":["P22"]},{"id":"C06","date":"1713","y":1713,"m":null,"d":null,"era":"江戸","text":"箪笥町は幕府の武器(箪笥)を扱う具足奉行・弓矢鑓奉行組の同心の拝領屋敷があったことから名づけられた","kind":"事実","grade":"準一次","quote":"都公文書館「幕府の武器を総称して、「箪笥」と呼んだことから、正徳３年（１７１３）年、町奉行支配となった際、町が起立し、牛込御箪笥町となりました」(1 資料)","srcs":["https://www.soumu.metro.tokyo.lg.jp/01soumu-archives/07edo_tokyo/0711town_name"],"at":"2026-09-25","status":"確定","places":["P23"]},{"id":"C08","date":"1793","y":1793,"m":null,"d":null,"era":"江戸","text":"善國寺が神楽坂へ移った。区は「寛政5年(1793)2月に馬喰町から」、寺は「1670 年の焼失後に麹町へ移り、寛政4年(1792)の火事で神楽坂へ」とする","kind":"事実","grade":"準一次","quote":"区「寛政4年（1792）の三回にわたり火災に遭い、寛政5年（1793）2月に神楽坂に移った」/ 寺「寛文10（1670）年に焼失した当山を麹町に移転し」「寛政4（1792）年の火事により、当、神楽坂へ移転してきた」","srcs":["https://bunkakanko-annai.city.shinjuku.lg.jp/shosai3/?id=F009","https://kagurazaka-bishamonten.com/about/"],"at":"2026-09-25","status":"諸説","places":["P18"]},{"id":"C09","date":"1842","y":1842,"m":null,"d":null,"era":"江戸","text":"天保13年(1842)、通寺町(今の神楽坂六丁目)付近からの出火で赤城神社の社殿が全焼した","kind":"事実","grade":"準一次","quote":"赤城神社「天保13年3月7日の午の刻（正午）通寺町（現神楽坂六丁目）附近から出火し、強い南風のため赤城神社の御社殿が全焼した」(1 資料)","srcs":["https://www.akagi-jinja.jp/akagi/pedigree/"],"at":"2026-09-25","status":"確定","places":["P24"]},{"id":"C10","date":"1848","y":1848,"m":null,"d":null,"era":"江戸","text":"善國寺本堂前の石虎が奉納された。台座には水準点の刻印がある","kind":"事実","grade":"準一次","quote":"区「本堂前の珍しい石虎は、台座に水準点を示す刻印があり、近代化遺産としても重要である」/ 区の石虎の頁(嘉永元年)","srcs":["https://bunkakanko-annai.city.shinjuku.lg.jp/course/shosai7/","https://bunkakanko-annai.city.shinjuku.lg.jp/shosai3/?id=A002"],"at":"2026-09-25","status":"確定","places":["P18"]},{"id":"C04","date":"1851","y":1851,"m":null,"d":null,"era":"江戸","text":"牛込御門の枡形は外堀の城側(今の千代田区富士見側)にあった。見附は門を2つ組み合わせた枡形で、番所を置いた","kind":"事実","grade":"一次","quote":"1851・1852 年の尾張屋版切絵図で、枡形の囲いは橋の城側に描かれる / 区「門を2つ組み合わせた桝形が造られ、番所を設けて門番を置いた」","srcs":["https://dl.ndl.go.jp/pid/1286670","https://dl.ndl.go.jp/pid/1286672","https://bunkakanko-annai.city.shinjuku.lg.jp/shosai3/?id=A166"],"at":"2026-09-25","status":"確定","places":["P02","P04"]},{"id":"C07","date":"1852","y":1852,"m":null,"d":null,"era":"江戸","text":"神楽河岸まで江戸湾から船が入り、揚場町で米・味噌・醤油・酒・材木などを荷揚げした。軽子坂はその荷を運ぶ軽子が上り下りした坂","kind":"事実","grade":"準一次","quote":"区「神楽河岸まで江戸湾から船が運航できた」/ 区の軽子坂の解説「米・味噌・醤油・酒・材木など」(塩は書かれていない)/ 1852 年の切絵図に「揚場町」「軽子坂」","srcs":["https://bunkakanko-annai.city.shinjuku.lg.jp/shosai3/?id=A166","https://bunkakanko-annai.city.shinjuku.lg.jp/shosai3/?id=B019","https://dl.ndl.go.jp/pid/1286672"],"at":"2026-09-25","status":"確定","places":["P06","P07","P08","P09"]},{"id":"C17","date":"1852〜1895","y":1852,"m":null,"d":null,"era":"明治","text":"路地は江戸の絵図には描かれず、明治の地図から現れる。明治20年の地図に芸者新道・かぐら横丁、明治28年の地図に兵庫横丁・かくれんぼ横丁が出る","kind":"事実","grade":"二次","quote":"松井・窪田 2012 p.2409「絵図から路地の存在を確認することはできない。…明治20 年の地図に芸者新道やかぐら横丁を確認することができる。明治28 年の地図には兵庫横丁やかくれんぼ横丁が出現し」/ 1852 年の切絵図では坂の北側は本多対馬守の屋敷など武家地の大区画","srcs":["https://www.jstage.jst.go.jp/article/aija/77/680/77_2407/_article/-char/ja","https://dl.ndl.go.jp/pid/1286672"],"at":"2026-09-25","status":"確定","places":["P14","P15","P16","P17","P19"]},{"id":"C15","date":"1868〜1912","y":1868,"m":null,"d":null,"era":"明治","text":"花街ができた時期は資料で違う。善國寺は明治初期、区は明治末〜大正とする。当時の新聞は、1895年ごろ待合が急に増えたと書く","kind":"事実","grade":"準一次","quote":"寺「明治初期に花街も形成され」/ 区「明治時代末から花街・繁華街として栄えてきました」/ 1895年9月7日 東京朝日新聞(牛垣 2006 の引用)「一昨年までは僅か七八軒なりしも,今では十五六軒の多きに及べり」","srcs":["https://kagurazaka-bishamonten.com/about/","https://www.city.shinjuku.lg.jp/kusei/keikan01_002096_00001.html","https://www.jstage.jst.go.jp/article/grj2002/79/10/79_10_527/_article/-char/ja"],"at":"2026-09-25","status":"諸説","places":["P12"]},{"id":"C11","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"牛込門が撤去された","kind":"事実","grade":"準一次","quote":"千代田区「門は1871年（明治4年）に撤去されました」(1 資料)","srcs":["https://www.edo-chiyoda.jp/knainobunkazai/bunkazaisign_hyochu_setsumeiban/1/1/263.html"],"at":"2026-09-25","status":"確定","places":["P02","P03"]},{"id":"C12","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"牛込揚場町に戮盟社の石鹸工場ができた(区年表は「我国石鹸製造の始め」とする)","kind":"事実","grade":"準一次","quote":"区年表「明治4（1871）年 牛込揚場町に戮盟社の石鹸工場開設（我国石鹸製造の始め）」(1 資料)","srcs":["https://www.city.shinjuku.lg.jp/kusei/70kinenshi/meiji.html"],"at":"2026-09-25","status":"確定","places":["P08"]},{"id":"C26","date":"1890頃〜1923","y":1890,"m":null,"d":null,"era":"大正","text":"「山手銀座」と呼ばれ始めた時期は資料で違う。区は明治・大正時代、善國寺は明治・大正初期、新宿歴史博物館は震災直後とする","kind":"事実","grade":"準一次","quote":"区「明治・大正時代には山手銀座と呼ばれ」/ 博物館「震災直後は「山の手銀座」という名が…神楽坂につけられました」","srcs":["https://www.city.shinjuku.lg.jp/kusei/shokai_5area_kagurazaka.html","https://www.regasu-shinjuku.or.jp/rekihaku/wp-content/uploads/2023/08/594fa911643e5656a7b33c28b7c37430-1.pdf"],"at":"2026-09-25","status":"諸説","places":[]},{"id":"C42","date":"1894〜1970年代","y":1894,"m":null,"d":null,"era":"明治","text":"「鉄道の開通で水運から鉄道へ移り、港の役割が終わった」とする説の出典は見つからない。揚場町前の飯田濠の水面は 1936年ごろ・戦後・1965〜68年の地図と写真にも残る","kind":"解釈","grade":"一次","quote":"今昔マップ 1965〜68年版 / 空中写真 1936年ごろ・戦後","srcs":["https://ktgis.net/kjmapw/kjmapw.html?lat=35.7010&lng=139.7420&zoom=16&dataset=tokyo50&age=4&screen=1"],"at":"2026-09-25","status":"要確認","places":["P06"]},{"id":"C13","date":"1894-10-09","y":1894,"m":10,"d":9,"era":"明治","text":"甲武鉄道の新宿〜牛込間が開業し、牛込駅(今の飯田橋駅西口付近)ができた。10月6日に免許が下り、9日に営業を始めた(『鉄道局年報』の開業表は6日を載せる)","kind":"事実","grade":"一次","quote":"官報 1894-10-10「本月六日甲武鐵道新宿牛込間運輸開業免許狀ヲ下付セシニ昨九日ヨリ開業ノ旨届出テタリ」/ 会社の記録「十月九日新宿牛込間ノ營業ヲ開始セリ」(OCR)/ 『鉄道局年報』「新宿牛込間 仝十月六日」","srcs":["https://dl.ndl.go.jp/pid/2946654/1/4","https://dl.ndl.go.jp/pid/805187/1/10","https://dl.ndl.go.jp/pid/805397/1/94"],"at":"2026-09-25","status":"確定","places":["P01","P04","P05"]},{"id":"C14","date":"1895","y":1895,"m":null,"d":null,"era":"明治","text":"牛込〜飯田町間が延びた。牛込駅は約半年、甲武鉄道の東京側の終点だった。延伸の日は「4月3日」(会社の記録)と「3月」(1998年版の区史)で食い違う","kind":"事実","grade":"一次","quote":"会社の記録「二十八年四月三日牛込飯田町間開業」(OCR)/ 1998年版の区史「翌28年3月飯田」(OCR 抜粋)","srcs":["https://dl.ndl.go.jp/pid/805187/1/10","https://dl.ndl.go.jp/search/searchResult?keyword=%E7%89%9B%E8%BE%BC%E9%A7%85&title=%E6%96%B0%E5%AE%BF%E5%8C%BA%E5%8F%B2&searchfield=fulltext"],"at":"2026-09-25","status":"諸説","places":["P01","P05"]},{"id":"C16","date":"1897〜1917","y":1897,"m":null,"d":null,"era":"大正","text":"牛込署管内の待合茶屋は 1897年13軒、1907年30軒、1917年77軒と増えた","kind":"数値","grade":"二次","quote":"牛垣 2006 p.531「1897年が13軒, 1907年が30軒, 1917年が77軒と増加している」(典拠『警視庁統計書』。1 資料)","srcs":["https://www.jstage.jst.go.jp/article/grj2002/79/10/79_10_527/_article/-char/ja"],"at":"2026-09-25","status":"要確認","places":["P12"]},{"id":"C18","date":"1917","y":1917,"m":null,"d":null,"era":"大正","text":"藁店(地蔵坂)の高等演芸館がのちに映画 File:Tokyo-daijingu_01.jpg","at":"2026-09-26","w":900,"h":675,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F22.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F23","file":"images/F23.webp","kind":"現地写真","year":"2025","cap":"アンスティチュ・フランセ東京の校舎と中庭 (縮小)","places":["S02"],"claims":[],"src":"Wikimedia Commons","author":"Syced","license":"CC0","url":"https://commons.wikimedia.org/wiki/File:Institut_fran%C3%A7ais,_Iidabashi_02.jpg","at":"2026-09-26","w":900,"h":678,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F23.webp","w":240,"h":181}},{"rep":true,"crop":null,"id":"F24","file":"images/F24.webp","kind":"現地写真","year":"2022","cap":"熱海湯の千鳥破風の正面。入口の脇に自動販売機 (縮小)","places":["S03"],"claims":[],"src":"Wikimedia Commons","author":"Higa4","license":"CC0","url":"https://commons.wikimedia.org/wiki/File:Atami-yu_(Kagurazaka,_Shinjuku)_02.jpg","at":"2026-09-26","w":1200,"h":900,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F24.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F25","file":"images/F25.webp","kind":"現地写真","year":"2022","cap":"筑土八幡神社の朱塗りの社殿 (縮小)","places":["S04"],"claims":[],"src":"Wikimedia Commons","author":"Higa4","license":"CC0","url":"https://commons.wikimedia.org/wiki/File:Tsukudo_Hachiman-jinja_(Tsukudo-Hachimanch%C5%8D,_Shinjuku)_02.jpg","at":"2026-09-26","w":1000,"h":750,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F25.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F26","file":"images/F26.webp","kind":"現地写真","year":"2022","cap":"梅花亭 神楽坂本店の店先。橙の看板と「御菓子司」の掛け看板(公式サイトの本店の写真と同じ店構え) (縮小)","places":["S06"],"claims":[],"src":"Wikimedia Commons","author":"Araisyohei","license":"CC BY 4.0","url":"https://commons.wikimedia.org/wiki/File:Baika-tei_in_Kagurazaka_2022-12-17_(1)_as.jpg","at":"2026-09-26","w":1200,"h":900,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F26.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F27","file":"images/F27.webp","kind":"現地写真","year":"2013","cap":"CANAL CAFE。外堀の水面と貸しボート、奥に店の建物とデッキ (縮小)","places":["S08"],"claims":[],"src":"Wikimedia Commons","author":"Daderot","license":"CC0","url":"https://commons.wikimedia.org/wiki/File:Canal_Cafe_-_Tokyo,_Japan_-_DSC06482.JPG","at":"2026-09-26","w":1200,"h":800,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F27.webp","w":240,"h":160}},{"rep":true,"crop":30.0,"id":"F28","file":"images/F28.webp","kind":"現地写真","year":"2021","cap":"神楽坂仲通り(神楽坂3丁目)を北から南へ見る。右手に「紅龍」「一品香」の看板、電柱に「神楽坂3-1」の番地表示 (縮小)","places":["P14"],"claims":[],"src":"Mapillary","author":"musashino5","license":"CC BY-SA 4.0","url":"https://www.mapillary.com/app/?pKey=204747371707352","at":"2026-09-26","w":1024,"h":768,"range":null,"mly":true,"thumb":{"file":"images/thumbs/F28.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F29","file":"images/F29.webp","kind":"現地写真","year":"2023","cap":"「牛込揚場」の碑。左に銅板の絵、右に碑文と「昭和五十九年三月 東京都」 (縮小)","places":["P07"],"claims":[],"src":"Mapillary","author":"mura","license":"CC BY-SA 4.0","url":"https://www.mapillary.com/app/?pKey=925345745514695","at":"2026-09-26","w":900,"h":675,"range":null,"mly":true,"thumb":{"file":"images/thumbs/F29.webp","w":240,"h":180}}],"story":[{"t":"h1","text":"神楽坂の歴史(5 分で話せる版)"},{"t":"p","text":"事実は `claims.md` の Claim から書いた。段落の末尾の [C..] が根拠。「〜という」「〜の説」と書いた段落は解釈か、資料が 1 つしかないもの。","refs":[],"img":null},{"t":"h2","text":"城の門と荷揚げ場(江戸)"},{"t":"p","text":"1636 年、江戸城の外堀とともに牛込御門が築かれた。門は 2 つの門を組み合わせた枡形で、外堀の城側、今の千代田区側にあった。飯田橋駅西口の石垣がその跡。[C03][C04]","refs":["C03","C04"],"img":"M01"},{"t":"p","text":"外堀は神田川につながり、江戸湾からの船が神楽河岸まで入った。揚場町で米・味噌・醤油・酒・材木を陸に揚げ、軽子が軽子坂を担いで上った。[C07]","refs":["C07"],"img":"M01"},{"t":"p","text":"坂の上は武家地と寺町だった。毘沙門天の善國寺は 18 世紀末に神楽坂へ移ってきた。移ってきた経緯は、区と寺で説明が違う。[C08][C17]","refs":["C08","C17"],"img":"M02"},{"t":"h2","text":"鉄道と花街(明治〜大正)"},{"t":"p","text":"1894 年 10 月、甲武鉄道の牛込駅が今の飯田橋駅西口のあたりに開業した。6 日に免許が下り、9 日に営業を始めた。[C13]","refs":["C13"],"img":"E06"},{"t":"p","text":"坂の北側の武家地に路地ができたのは明治に入ってからで、明治 20 年代の地図に芸者新道やかくれんぼ横丁が現れる。「江戸からの路地」ではない。[C17]","refs":["C17"],"img":"M04"},{"t":"p","text":"待合は 1895 年ごろから増え、1917 年には 77 軒になったという。花街ができた時期は、明治初期(寺)とも明治末(区)とも言われる。[C15][C16]","refs":["C15","C16"],"img":null},{"t":"h2","text":"震災と「山の手銀座」(大正末〜昭和初期)"},{"t":"p","text":"1923 年の関東大震災で、牛込区は大火をほぼ免れた。被害は各区で最も軽い部類だったが、坂下の揚場町では家が壊れている。当時の資料が挙げる理由は「火事にならなかった」ことで、「地盤が強かった」とする説には出典が見つからない。[C20][C21][C22]","refs":["C20","C21","C22"],"img":"E03"},{"t":"p","text":"1927 年、作家の加能作次郎は、神楽坂が「山の手の銀座」と呼ばれていると書いた。ただし、その呼び名は震災後まもなく新宿のものになる。1930 年代の案内記はそろって「新宿が神楽坂から山手銀座の名を奪った」と書いている。[C25][C27][C31]","refs":["C25","C27","C31"],"img":"E02"},{"t":"p","text":"坂の上の肴町には高島屋の「神楽坂十銭ストア」があり(1932 年の電話帳)、早慶戦で早稲田が勝つと学生は神楽坂で祝った。[C29][C30]","refs":["C29","C30"],"img":"E01"},{"t":"h2","text":"空襲と戦後"},{"t":"p","text":"1945 年、神楽坂は空襲で焼け野原になり、善國寺も焼けた。新宿区域の大空襲は 4 月 13 日と 5 月 24〜25 日の 2 回で、神楽坂がどちらで焼けたかは資料からは特定できない。近くの赤城神社は 4 月 13 日に焼けた。[C33][C34][C35]","refs":["C33","C34","C35"],"img":"M08"},{"t":"p","text":"戦後の空中写真を見ると、建物はまばらでも道筋は戦前と同じ。1951 年に「神楽坂」が正式な町名になり、1954 年には毘沙門天の縁日が戻った。[C36][C37][C40]","refs":["C36","C37","C40"],"img":"M07"},{"t":"h2","text":"路地が残った理由(研究者の説)"},{"t":"p","text":"松井・窪田(2012)によれば、戦災復興で大規模な区画整理が行われなかったため、街路の骨格が残った。細かな袋小路は多く消えたという。牛垣(2006)は、密集した料亭街の小さな敷地と建築基準法のために、建物が低中層のまま残ったと説明する。[C45]","refs":["C45"],"img":null},{"t":"p","text":"よく聞く「繁華街の競争に負けたからこそ残った」という説明は、出典が見つからない。[C46]","refs":["C46"],"img":null},{"t":"p","text":"1952 年に東京日仏学院が近くに開校し、今は通称「プチ・パリ」とも呼ばれる。[C39]","refs":["C39"],"img":null}],"base":{"svg":"<g class=\"base\"><path class=\"water\" fill-rule=\"evenodd\" d=\"M1537 142l0-35l0 6l-4 8l3 5l-4 8l-1 6l6 2ZM1158 0l30 106l14 40l32 111l11 43l19 84l21 24l-5 2l6-1l9 11l6 1l28-12l40-14l32-8l44-1l52-2l40 1l0 18l-135 4l-27 6l-93 39l-19-27l-19-30l-15-58l-88-308l-6-29l23 0ZM1282 452l-32 15l-44 33l-13 12l-9 10l-16 22l-33 50l-25 41l-5 13l-1 9l37 22l-27 47l-7 0l-5 6l-4 12l-6 10l-84 126l-20 21l-62 94l-72 0l110-159l24-30l22-29l5 3l1-1l3 2l3-3l-4-2l6-9l-2-2l31-42l3 3l6-7l5 3l1-1l15 11l10-14l16-1l17-28l-33-19l5-10l-2-3l-3-1l0-5l25-49l23-39l18-24l38-40l7-5l7-9l58-48l1-3l12 18Z\"/><      地図   OSM の下地 + Place の Pin(順路は番号、寄り道は番号なしの小さい丸)+ 順路の線。Pin を押すと Place の Detail

   スロット制(TGS / 大阪と同じ):
     スマホ(幅 720px 以下) 下からのシートを常に 1 枚(List か Detail)。Detail は「← 年表」で List に戻る

        押したら watchPosition、青い点と誤差の円。初回だけ寄せ、もう一度押すと寄せ直す。ページが隠れたら止める

    g.innerHTML = `<text text-anchor="middle" y="4">${esc(name)}</text>`;
    $('subLabels').appendChild(g);
    // 線の上の候補点(40m おき。地図の座標)。線の中ほどに近い順に並べておく
    const pts = [];
    try {
      const L = path.getTotalLength();
      for (let d = 20; d < L; d += 40) { const q = path.getPointAtLength(d); pts.push([q.x, q.y]); }
    } catch (e) { /* 無視 */ }
    const mid = pts[Math.floor(pts.length / 2)] || [0, 0];
    pts.sort((a, b) => Math.hypot(a[0] - mid[0], a[1] - mid[1]) - Math.hypot(b[0] - mid[0], b[1] - mid[1]));
    return { g, name, pts, w: null, pos: null };
  });
  function layoutSubLabels(k) {
    const avoid = [...lastLabelBoxes, ...lastDots.map((d) => d.slice(0, 4))];
    for (const it of stItems) {
      const x = it.x * k, y = it.y * k;
      avoid.push([x - 7, y - 9, x + 12 + 13 * (it.len || 4), y + 9]);
    }
    for (const it of subItems) {
      const t = it.g.firstChild;
      if (it.w == null) { try { it.w = t.getComputedTextLength(); } catch (e) { it.w = 0; } if (!it.w) it.w = 11 * it.name.length; }
      it.pos = null;
      for (const [ux, uy] of it.pts) {
        const x = ux * k, y = uy * k;
        const b = [x - it.w / 2 - 3, y - 8, x + it.w / 2 + 3, y + 7];
        if (!avoid.some((a) => hitBox(a, b))) { it.pos = [ux, uy]; avoid.push(b); break; }
      }
      it.g.style.display = it.pos ? '' : 'none';
    }
  }
  function placeSubLabels(st) {
    for (const it of subItems) {
      if (it.pos) it.g.setAttribute('transform', `translate(${(it.pos[0] * st.k + st.tx).toFixed(1)} ${(it.pos[1] * st.k + st.ty).toFixed(1)})`);
    }
  }

  /** 地点名: 順路の番号順 → 寄り道 の順に、右 → 左 の順で置き、先に置いた文字か、ほかの Pin の丸に
      重なるなら隠す(ズームして離れれば出てくる)。強調や選択では並べ替えない(選び直しはズームのときだけ) */
  function labelOrder(it) { return it.p.route != null ? it.p.route : it.cat === '歴史' ? 1e3 : 2e3; }
  function layoutLabels(k) {
    const boxes = lastLabelBoxes = [];
    const vis = pinItems.filter(pinShown);   // 出していない種類の Pin は数えない(Filter を切り替えたら選び直す)
    const dots = lastDots = vis.map((it) => { const x = it.p.x * k, y = it.p.y * k; return [x - DOT_R, y - DOT_R, x + DOT_R, y + DOT_R, it]; });
    for (const it of pinItems) if (!pinShown(it)) it.name.style.display = 'none';
    for (const it of [...vis].sort((a, b) => labelOrder(a) - labelOrder(b))) {
      const t = it.name;
      if (it.w == null) { try { it.w = t.getComputedTextLength(); } catch (e) { it.w = 12 * it.p.name.length; } if (!it.w) it.w = 12 * it.p.name.length; }
      const gap = it.p.route != null ? 19 : 14;
      const x = it.p.x * k, y = it.p.y * k;
      const y0 = y - LBL_H / 2 - 2, y1 = y + LBL_H / 2;
      const cands = [[x + gap, y0, x + gap + it.w, y1, 'r'], [x - gap - it.w, y0, x - gap, y1, 'l']];
      const fit = cands.find((b) => !boxes.some((o) => hitBox(o, b)) && !dots.some((d) => d[4] !== it && hitBox(d, b)));
      t.style.display = fit ? '' : 'none';
      if (fit) {
        boxes.push(fit);
        if (it.side !== fit[4]) {
          it.side = fit[4];
          t.setAttribute('x', it.side === 'r' ? gap : -gap);
          t.setAttribute('text-anchor', it.side === 'r' ? 'start' : 'end');
        }
      }
    }
  }
  /** 倍率が変わっていたら文字を選び直す(操作の終わり・拡大縮小のアニメーションの終わり・収め直しで呼ぶ) */
  function relayout(force) {
    const k = M.st.k;
    if (!force && layoutK === k) return;
    layoutK = k;
    layoutLabels(k);
    layoutSubLabels(k);
    placeSubLabels(M.st);
  }

  function panZoom(svgEl, viewEl, o) {
    const st = { k: 1, tx: 0, ty: 0, touched: false };
    function apply() { viewEl.setAttribute('transform', `matrix(${st.k} 0 0 ${st.k} ${st.tx} ${st.ty})`); if (o.onApply) o.onApply(st); }
    function zoomAt(px, py, f) {
      const nk = Math.max(o.min(), Math.min(o.max, st.k * f)); f = nk / st.k;
      st.tx = px - f * (px - st.tx); st.ty = py - f * (py - st.ty); st.k = nk; apply();
    }
    const TAP_PX = 10;
    const ptrs = new Map();
    let ghostUntil = 0;
    window.addEventListener('click', (e) => {
      if (performance.now() < ghostUntil && !svgEl.contains(e.target)) { e.preventDefault(); e.stopPropagation(); }
      ghostUntil = 0;
    }, true);
    let lastMid = null, lastDist = null, moved = false, pressed = null, slackX = 0, slackY = 0;
    svgEl.addEventListener('pointerdown', (e) => {
      st.touched = true; o.onStart && o.onStart();
      const r0 = svgEl.getBoundingClientRect();
      pressed = [e.clientX - r0.left, e.clientY - r0.top];   // 押した点(svg の中の画面座標)
      try { svgEl.setPointerCapture(e.pointerId); } catch (err) { /* 無視 */ }
      // 新しい主ポインタ = 前の指は全部離れている。取りこぼした pointerup(ピンチの 2 本目など)を捨てる
      if (e.isPrimary) ptrs.clear();
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      moved = ptrs.size > 1; lastMid = [e.clientX, e.clientY]; lastDist = null; slackX = slackY = 0;
      svgEl.classList.add('dragging');
    });
    svgEl.addEventListener('pointermove', (e) => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const p = [...ptrs.values()];
      if (p.length === 1) {
        const [x, y] = p[0];
        if (!lastMid) { lastMid = [x, y]; return; }
        let dx = x - lastMid[0], dy = y - lastMid[1];
        lastMid = [x, y];
        if (!moved) {
          slackX += dx; slackY += dy;
          if (Math.hypot(slackX, slackY) <= TAP_PX) return;
          moved = true; dx = slackX; dy = slackY;
        }
        st.tx += dx; st.ty += dy; apply();
      } else if (p.length >= 2) {
        const r = svgEl.getBoundingClientRect();
        const mid = [(p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2];
        const dist = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
        if (lastMid && lastDist) {
          st.tx += mid[0] - lastMid[0]; st.ty += mid[1] - lastMid[1];
          zoomAt(mid[0] - r.left, mid[1] - r.top, dist / lastDist); moved = true;
        }
        lastMid = mid; lastDist = dist;
      }
    });
    const up = (e) => {
      const single = ptrs.size === 1;
      ptrs.delete(e.pointerId); lastMid = null; lastDist = null;
      if (!ptrs.size) { svgEl.classList.remove('dragging'); if (o.onEnd) o.onEnd(); }
      if (e.type === 'pointerup' && single && !moved && pressed) {
        // タップで開いたシートが指の下に来ると、あとから来る互換の click がシートのボタン(閉じる など)に当たる。
        // タップの直後 500ms の click は地図の外なら捨てる(ゴーストクリック対策)
        // ゴーストクリック対策はタッチだけ(マウスの click は押した所に来るので、直後に「閉じる」を押しても捨てない)
        if (o.onTap(pressed[0], pressed[1]) && e.pointerType !== 'mouse') ghostUntil = performance.now() + 500;
      }
      if (!ptrs.size) pressed = null;
    };
    svgEl.addEventListener('pointerup', up);
    svgEl.addEventListener('pointercancel', up);
    let wheelT = null;
    svgEl.addEventListener('wheel', (e) => {
      st.touched = true; e.preventDefault(); o.onStart && o.onStart();
      const r = svgEl.getBoundingClientRect();
      zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015));
      clearTimeout(wheelT); wheelT = setTimeout(() => { if (o.onEnd) o.onEnd(); }, 200);   // ホイールが止まってから 1 回
    }, { passive: false });
    svgEl.addEventListener('dblclick', (e) => { const r = svgEl.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 1.8); if (o.onEnd) o.onEnd(); });
    return { st, apply, zoomAt };
  }

  let kFitAll = 0.2;
  const M = panZoom(svg, view, {
    min: () => kFitAll * 0.7, max: 14,
    onStart: () => stopPan(),
    onEnd: () => relayout(),
    onApply(st) {
      svg.style.setProperty('--u', String(1 / st.k));
      for (const it of pinItems) {
        it.sx = it.p.x * st.k + st.tx; it.sy = it.p.y * st.k + st.ty;
        it.g.setAttribute('transform', `translate(${it.sx.toFixed(1)} ${it.sy.toFixed(1)})`);
      }
      for (const it of stItems) it.g.setAttribute('transform', `translate(${(it.x * st.k + st.tx).toFixed(1)} ${(it.y * st.k + st.ty).toFixed(1)})`);
      if (layoutK == null) relayout(true);   // 最初の 1 回
      placeSubLabels(st);
      if (cardPin) placeCard();
      for (const f of onMapApply) f();
    },
    /** タップは「いちばん近い Pin」に当てる(当たり判定の円が重なっても、指に近いほうが開く)。
        44px の当たり判定 = 中心から 22px。少し甘く 26px まで拾う。開いたら true */
    onTap(x, y) {
      let best = null, bd = 26;
      for (const it of pinItems) {
        if (!pinShown(it)) continue;
        const d = Math.hypot(it.sx - x, it.sy - y);
        if (d < bd) { bd = d; best = it; }
      }
      if (!best) return false;
      openPlace(best.p.id, false);
      return true;
    },
  });
  pinItems.forEach(({ g, p }) => g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPlace(p.id, false); } }));

  /** 地図のうち、シートや凡例に隠れていない縦の帯 [上, 下](画面座標、stage の中) */
  function visibleBand() {
    const Hs = svg.clientHeight;
    let top = 0, bot = Hs;
    const lg = $('legend');
    if (lg && lg.offsetHeight) top = lg.offsetTop + lg.offsetHeight + 4;
    const sheet = $('sheet');
    if (isPhone() && sheet.classList.contains('open')) bot = Hs - sheet.offsetHeight;
    if (bot - top < 120) { top = 0; bot = Hs; }
    return [top, bot];
  }
  function fitBox(x0, y0, x1, y1, pad) {
    const [top, bot] = visibleBand();
    const Wv = svg.clientWidth, Hv = bot - top;
    const w = Math.max(1, x1 - x0), h = Math.max(1, y1 - y0);
    const k = Math.min((Wv - pad * 2) / w, (Hv - pad * 2) / h);
    return { k, tx: (Wv - w * k) / 2 - x0 * k, ty: top + (Hv - h * k) / 2 - y0 * k };
  }
  function computeFitAll() { kFitAll = fitBox(0, 0, W, H, 8).k; }
  function placesBox(list, margin) {
    const xs = list.map((p) => p.x), ys = list.map((p) => p.y);
    let x0 = Math.min(...xs) - margin, x1 = Math.max(...xs) + margin, y0 = Math.min(...ys) - margin, y1 = Math.max(...ys) + margin;
    const minS = 260;
    if (x1 - x0 < minS) { const c = (x0 + x1) / 2; x0 = c - minS / 2; x1 = c + minS / 2; }
    if (y1 - y0 < minS) { const c = (y0 + y1) / 2; y0 = c - minS / 2; y1 = c + minS / 2; }
    return [x0, y0, x1, y1];
  }
  /** Pin の丸どうしが重ならない倍率(いちばん近い 2 地点が画面上で START_GAP px 離れる)。上限 K_START_MAX */
  const START_GAP = 32, K_START_MAX = 2.5;
  function kSeparate() {
    let m = Infinity;
    for (let i = 0; i < D.places.length; i++) for (let j = i + 1; j < D.places.length; j++) {
      m = Math.min(m, Math.hypot(D.places[i].x - D.places[j].x, D.places[i].y - D.places[j].y));
    }
    return Number.isFinite(m) && m > 0 ? Math.min(K_START_MAX, START_GAP / m) : 1;
  }
  function fitStart() {
    computeFitAll();
    // スマホは順路 1 の付近に寄せる(全体だと Pin が重なって押せない)。順路 1 が無ければ最初の地点
    if (isPhone() && D.places.length) {
      const first = D.places.find((p) => p.route != null) || D.places[0];
      const [top, bot] = visibleBand();
      const k = Math.max(kFitAll, kSeparate());
      Object.assign(M.st, { k, tx: svg.clientWidth / 2 - first.x * k, ty: (top + bot) / 2 - first.y * k });
      M.apply(); relayout();
      return;
    }
    const f = D.places.length ? fitBox(...placesBox(D.places, 120), 16) : fitBox(0, 0, W, H, 8);
    Object.assign(M.st, { k: Math.max(f.k, kFitAll), tx: f.tx, ty: f.ty });
    if (f.k < kFitAll) Object.assign(M.st, fitBox(0, 0, W, H, 8));
    M.apply(); relayout();
  }
  function fitAll() { stopPan(); computeFitAll(); Object.assign(M.st, fitBox(0, 0, W, H, 8)); M.apply(); relayout(); }

  let anim = null;
  function stopPan() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
  function animateTo(k, tx, ty) {
    stopPan();
    const s0 = { k: M.st.k, tx: M.st.tx, ty: M.st.ty };
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { Object.assign(M.st, { k, tx, ty }); M.apply(); relayout(); return; }
    const t0 = performance.now(), DUR = 240;
    const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    const frame = (now) => {
      if (!anim) return;
      const u = Math.min(1, (now - t0) / DUR), e = ease(u);
      M.st.k = s0.k + (k - s0.k) * e; M.st.tx = s0.tx + (tx - s0.tx) * e; M.st.ty = s0.ty + (ty - s0.ty) * e; M.apply();
      anim = u < 1 ? requestAnimationFrame(frame) : null;
      if (u >= 1) relayout();
    };
    anim = requestAnimationFrame(frame);
  }
  /** Place の列が、シートに隠れない所に収まるように動かす(拡大は今より上げない。入らなければ縮める) */
  function showPlaces(list) {
    if (!list.length) return;
    const [top, bot] = visibleBand();
    const Wv = svg.clientWidth;
    const [x0, y0, x1, y1] = placesBox(list, 60);
    let k = M.st.k;
    const kFit = Math.min((Wv - 32) / (x1 - x0), (bot - top - 32) / (y1 - y0));
    if (kFit < k) k = Math.max(kFit, kFitAll * 0.7);
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const inView = list.every((p) => {
      const px = p.x * M.st.k + M.st.tx, py = p.y * M.st.k + M.st.ty;
      return px > 24 && px < Wv - 24 && py > top + 24 && py < bot - 24;
    });
    if (inView && k === M.st.k) return;
    animateTo(k, Wv / 2 - cx * k, (top + bot) / 2 - cy * k);
  }

  // ---------- 強調 ----------
  let hl = new Set(), selPlace = null;
  function renderPins() {
    for (const { g, p } of pinItems) {
      g.classList.toggle('hl', hl.has(p.id));
      g.classList.toggle('sel', selPlace === p.id);
      g.classList.toggle('dim', hl.size > 0 && !hl.has(p.id) && selPlace !== p.id);
    }
    // 強調した Pin を最前面へ(名前が他の Pin に隠れない)
    for (const { g, p } of pinItems) if (hl.has(p.id) || selPlace === p.id) pinsG.appendChild(g);
  }

  // ---------- パネル(スロット制) ----------
  const PAN = { list: $('pList'), det: $('pDet') };
  const PC_WIDE = 1100;   // これ以上は List と Detail を別の列に(左 / 右)
  const sheet = $('sheet'), sheetSlot = $('sheetSlot'), stash = $('stash');
  const colL = $('colL'), colR = $('colR'), slotL = $('slotL'), slotR = $('slotR');
  const isWide = () => !isPhone() && window.innerWidth >= PC_WIDE;
  let lastStageW = 0;
  let sheetCur = null;   // スマホ: null | 'list' | 'det'
  let detOpen = false;   // PC: 下の段に Detail があるか
  let backTo = false;    // スマホ: Detail から「← 年表」で戻れるか
  let cur = null;        // { type: 'place' | 'claim', id }
  function place(k, slot) { if (PAN[k].parentNode !== slot) slot.appendChild(PAN[k]); }
  function layout() {
    if (isPhone()) {
      for (const k of Object.keys(PAN)) if (k !== sheetCur) place(k, stash);
      if (sheetCur) place(sheetCur, sheetSlot);
      sheet.classList.toggle('open', !!sheetCur);
      sheet.classList.toggle('det', sheetCur === 'det');
      for (const k of Object.keys(PAN)) PAN[k].classList.toggle('open', sheetCur === k);
      $('drawerHandle').hidden = !!sheetCur;
      $('listBtn').setAttribute('aria-pressed', String(sheetCur === 'list'));
      $('detBack').hidden = !(sheetCur === 'det' && backTo);
    } else if (isWide()) {
      // 左 = List / 右 = Detail(開いているときだけ右の列を出す)
      sheet.classList.remove('open', 'det');
      place('list', slotL);
      if (detOpen) place('det', slotR); else place('det', stash);
      PAN.list.classList.add('open');
      PAN.det.classList.toggle('open', detOpen);
      colR.hidden = !detOpen;
      $('detBack').hidden = true;
    } else {
      // 左の列 1 本で List と Detail を切り替える
      sheet.classList.remove('open', 'det');
      colR.hidden = true;
      place(detOpen ? 'det' : 'list', slotL);
      place(detOpen ? 'list' : 'det', stash);
      PAN.list.classList.toggle('open', !detOpen);
      PAN.det.classList.toggle('open', detOpen);
      $('detBack').hidden = !detOpen;
    }
    // 地図の幅が変わったら(右の列が出た・消えた)ラベルとカードを置き直す
    const w = svg.clientWidth;
    if (w !== lastStageW) { lastStageW = w; M.apply(); }
  }
  function showList() {
    if (isPhone()) { sheetCur = 'list'; backTo = false; }
    layout(); scrollToCurrent();
  }
  function showDet(fromList) {
    if (isPhone()) { sheetCur = 'det'; backTo = !!fromList; } else detOpen = true;
    layout();
    $('detBody').scrollTop = 0;
  }
  function closePanel(k) {
    if (isPhone()) { sheetCur = null; backTo = false; }
    else if (k === 'det') detOpen = false;
    if (k === 'det' || isPhone()) { cur = null; hl = new Set(); selPlace = null; renderPins(); markRows(); setHash(''); }
    layout();
  }
  document.addEventListener('click', (e) => {
    const z = e.target.closest('[data-zoom]');
    if (z) { openZoom(z.getAttribute('data-zoom'), z); return; }
    const cr = e.target.closest('[data-cref]');
    if (cr) { e.preventDefault(); gotoRow(cr.getAttribute('data-cref')); return; }
    const b = e.target.closest('[data-act]');
    if (b) {
      const pan = b.closest('.panel');
      const k = pan === PAN.det ? 'det' : 'list';
      if (b.dataset.act === 'close') closePanel(k);
      else if (b.dataset.act === 'back') {
        if (isPhone()) { sheetCur = 'list'; backTo = false; } else detOpen = false;   // PC(幅 1099 以下)は同じ列を List に戻す
        layout(); scrollToCurrent();
      }
      return;
    }
    const r = e.target.closest('[data-claim]');
    if (r) { openClaim(r.getAttribute('data-claim'), !!r.closest('#listBody')); return; }
    const pl = e.target.closest('[data-goplace]');
    if (pl) { openPlace(pl.getAttribute('data-goplace'), !!pl.closest('#routeBody')); }
  });
  $('listBtn').addEventListener('click', () => { if (sheetCur === 'list') closePanel('list'); else showList(); });
  $('drawerHandle').addEventListener('click', showList);
  $('fitBtn').addEventListener('click', fitAll);

  // ---------- 年表(List) ----------
  function whenOf(c) { return c.date || '年不明'; }
  function interpLabel(c) {
    if (c.kind !== '解釈') return '';
    return `<span class="ilabel">${c.status === '要確認' ? '解釈(要確認):' : '解釈:'}</span>`;
  }
  /** 格(Source の種類)と状態(確かさ)。種類(事実・数値…)は出さない(解釈は本文の「解釈:」で見分ける) */
  function chips(c) {
    return `<span class="chip g-${esc(c.grade)}">${esc(c.grade)}</span><span class="chip s-${esc(c.status)}">${esc(c.status)}</span>`;
  }
  function renderList() {
    let html = '', era = null;
    for (const c of D.claims) {
      if (c.era !== era) { era = c.era; html += `<div class="era">${esc(era || '時代不明')}</div>`; }
      const ims = claimImages(c.id);
      html += `<div class="cwrap${ims.length ? ' hasimg' : ''}"><button type="button" class="crow${c.kind === '解釈' ? ' interp' : ''}" data-claim="${esc(c.id)}">`
        + `<span class="when">${esc(whenOf(c))}</span>`
        + `<span class="txt">${interpLabel(c)}${esc(c.text)}</span>`
        + `<span class="meta">${chips(c)}</span>`
        + '</button>'
        + (ims.length ? `<div class="thumbs">${ims.slice(0, 3).map((im) => `<button type="button" class="thumb" data-zoom="${esc(im.id)}" aria-label="拡大: ${esc(altOf(im))}">`
          + thumbImg(im) + '</button>').join('')}`
          + '</div>' : '')
        + '</div>';
    }
    $('listBody').innerHTML = html || '<p class="dsec">Claim がありません</p>';
  }
  /** 一覧用のサムネイル(images/thumbs/<id>.webp。無ければ元の画像) */
  function thumbImg(im) {
    const t = im.thumb || { file: im.file, w: im.w, h: im.h };
    return `<img src="${esc(t.file)}" width="${t.w}" height="${t.h}" alt="${esc(altOf(im))}" loading="lazy" decoding="async"${cropStyle(im)}>`;

  /** 地点の現地写真。先頭が代表写真(「代表」が ○ の写真。無ければ CSV の最初)。代表写真は一覧のサムネイル・Detail の先頭・ホバーのカードに使う */
  function placePhotos(p) {
    const all = IMAGES.filter((im) => im.kind === '現地写真' && im.places.includes(p.id));
    const rep = all.find((im) => im.rep);
    return rep ? [rep, ...all.filter((im) => im !== rep)] : all;

  /** 切り出し(横長の枠での縦位置 %)。空なら付けない。拡大表示には付けない */
  const cropStyle = (im) => (im && im.crop != null ? ` style="object-position:50% ${im.crop}%"` : '');

  // ---------- 順路の一覧(地点。現地写真のサムネイル付き) ----------
  function renderRoute() {
    const on = D.places.filter((p) => p.route != null), off = D.places.filter((p) => p.route == null);

      + sec('見どころ', '今の見どころ') + sec('休憩', '休憩'))

  }
  let listMode = 'route';   // 'route' | 'chrono'

  function markRows() {

    if (r) { const el = r.classList.contains('crow') ? r.parentNode : r; body.scrollTop = el.offsetTop - body.clientHeight / 3; }

  // ---------- 画像 ----------
  const OLD_KINDS = ['古地図', '空中写真', '現在の地図'];   // 「昔」のグループ(現在の地図は昔の図と比べるためのもの)
  function altOf(im) { return `${im.cap}(${im.kind}${im.year ? '・' + im.year : ''})`; }
  function claimImages(cid) { return IMAGES.filter((im) => im.claims.includes(cid)); }
  /** 地点の画像: place ids にその地点があるもの + place ids が空で、地点の Claim に結びつくもの */
  function placeImages(p) {
    return IMAGES.filter((im) => im.places.includes(p.id) || (!im.places.length && im.claims.some((c) => p.claims.includes(c))));
  }
  // 年の順。現在の地図は同じ年でも最後
  const byYear = (a, b) => (a.kind === '現在の地図') - (b.kind === '現在の地図')
    || (parseInt(a.year, 10) || 9999) - (parseInt(b.year, 10) || 9999) || (a.id < b.id ? -1 : 1);
  /** 「昔」の画像を、同じ範囲で年の違うまとまり(並べて比べる)と、単独の画像に分ける。
      同じ範囲 = 元URL の範囲(build_map.py の range_key)が同じ。range が無いものは
      空中写真・現在の地図のうち place ids が完全に一致するもの */
  function compareGroups(old) {
    const groups = new Map();
    for (const im of old) {
      const key = im.range || (im.kind !== '古地図' ? 'places:' + [...im.places].sort().join(';') : 'single:' + im.id);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(im);
    }
    const cmp = [], single = [];
    for (const g of groups.values()) {
      const years = new Set(g.map((im) => im.kind === '現在の地図' ? 'now' : im.year));
      if (g.length >= 2 && years.size >= 2) cmp.push(g.sort(byYear)); else single.push(...g);
    }
    return { cmp, single: single.sort(byYear) };
  }
  function figHTML(im, cls) {
    return `<figure class="fig${cls ? ' ' + cls : ''}" data-img="${esc(im.id)}">`
      + `<button type="button" class="figbtn" data-zoom="${esc(im.id)}" aria-label="拡大: ${esc(altOf(im))}">`
      + `<img src="${esc(im.file)}" width="${im.w}" height="${im.h}" alt="${esc(altOf(im))}" loading="lazy" decoding="async"`
      // 読み込む前から枠の大きさを決める(レイアウトのずれを出さない)。縦長は高さ 520px まで
      + ` style="aspect-ratio:${im.w}/${im.h};width:${cls === 'in-cmp' ? '100%' : `min(100%,${Math.round(520 * im.w / im.h)}px)`}"></button>`
      + `<figcaption>${creditHTML(im, cls === 'in-cmp')}</figcaption></figure>`;
  }
  /** キャプション・年・作者・ライセンス・元の資料(クレジットは省かない)。比較の中では年を列の見出しに出すので省く */
  function creditHTML(im, noYear) {
    return `<span class="cap">${esc(im.cap)}</span>${im.year && !noYear ? `<span class="yr">${esc(im.year)}</span>` : ''}`
      + `<span class="credit">${esc(im.author)} ・ ${esc(im.license)}</span>`
      + `<a class="orig" href="${esc(im.url)}" target="_blank" rel="noopener noreferrer">元の資料</a>`
      // Mapillary の画像: 規約どおりロゴを見える形で出し、その画像の Mapillary のページへリンクする
      + (im.mly ? `<a class="mly" href="${esc(im.url)}" target="_blank" rel="noopener noreferrer" aria-label="Mapillary(この画像のページ)"><span class="mly-logo" role="img" aria-label="Mapillary"></span></a>` : '');
  }
  /** 「昔」(古地図・空中写真)→「今」(現地写真)→「証拠」。同じ場所の空中写真が 2 枚以上なら年の順に並べて比べる */
  /** 地点の Detail の先頭: 現地写真を大きく 1 枚。無ければ同じ高さの空の枠 */

      + `<img src="${esc(ph.file)}" width="${ph.w}" height="${ph.h}" alt="${esc(altOf(ph))}" loading="lazy" decoding="async"${cropStyle(ph)}></button>`

    const ev = list.filter((im) => im.kind === '証拠').sort(byYear);

      const { cmp, single } = compareGroups(old);
      h += '<div class="imgsec"><h3>昔</h3>';
      for (const g of cmp) {
        h += `<div class="cmp n${g.length}" aria-label="同じ範囲の比較(${g.map((im) => esc(im.kind === '現在の地図' ? '現在' : im.year)).join(' / ')})">`
          + g.map((im) => `<div class="cmp-col"><div class="cmp-yr">${esc(im.kind === '現在の地図' ? '現在' : (im.year || '年不明'))}</div>${figHTML(im, 'in-cmp')}</div>`).join('')
          + '</div>';
      }
      h += single.map((im) => figHTML(im)).join('');

    if (ev.length) h += `<div class="imgsec"><h3>証拠</h3>${ev.map((im) => figHTML(im)).join('')}</div>`;

  // ---------- 拡大表示 ----------
  const lb = $('lightbox');

  // ---------- Detail ----------
  function srcList(srcs, at) {
    return `<ul class="srcs">${srcs.map((u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul>`
      + (at ? `<p class="small">取得日 ${esc(at)}</p>` : '');
  }
  function openPlace(id, fromList) {
    const p = placeById.get(id);

    if (p.cat) { openSpot(p, fromList); return; }
    cur = { type: 'place', id }; selPlace = id; hl = new Set([id]);
    const on = p.route != null;
    const b = $('detBadge');
    b.textContent = on ? `順路 ${p.route}` : ''; b.className = 'badge'; b.hidden = !on;

    $('detBody').innerHTML =
      `<div class="dsec herosec">${heroHTML(hero)}</div>`
      + `<div class="dsec gmap"><a href="https://www.google.com/maps/search/?api=1&amp;query=${p.lat},${p.lng}" target="_blank" rel="noopener">Google マップで開く</a>`
      // ストリートビュー(places.csv に pano id がある地点だけ。写真の無い地点の見分けに)
      + (p.sv ? `<a class="sv" href="https://www.google.com/maps/@?api=1&amp;map_action=pano&amp;pano=${encodeURIComponent(p.sv.pano)}${p.sv.heading != null ? `&amp;heading=${p.sv.heading}` : ''}" target="_blank" rel="noopener">ストリートビューで見る</a>` : '')
      + '</div>'
      + `<div class="dsec"><h3>時代</h3><p>${esc(p.era || '—')}</p></div>`
      + `<div class="dsec"><h3>ここで何があったか</h3><p>${esc(p.what || '—')}</p></div>`

  /** Spot の Detail: 代表写真・営業時間・定休日・予約要否・創業年(あれば)・一言・Source と取得日・Google マップ */

  // ---------- 読み物(#story) ----------
  const STORY = D.story || [];
  let storyBuilt = false;
  function inline(t) {
    return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\[([A-Z][A-Za-z]?[0-9][0-9A-Za-z_-]*)\]/g, (m, id) => (claimById.has(id)

  }

  /** [Cxx] → 地図に戻り、年表のその行を示す(Detail は開かない。関連 Pin を強調) */

  // ---------- ホバーのカード(PC のマウスだけ) ----------
  const hoverOK = () => !isPhone() && window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const card = $('hoverCard');
  let cardPin = null;   // カードを出している Pin(pinItems の要素)
  function cardHTML(p) {
    const ph = placePhotos(p)[0];
    const t = ph && (ph.thumb || { file: ph.file, w: ph.w, h: ph.h });
    return (t ? `<img src="${esc(t.file)}" width="${t.w}" height="${t.h}" alt="${esc(altOf(ph))}" decoding="async"${cropStyle(ph)}>`
      : '<span class="hc-empty">現地写真なし</span>') + `<span class="hc-name">${esc(p.name)}</span>`;
  }
  /** カードを Pin の横に置く。地図(stage)の外にはみ出さない。Pin が見えていなければ出さない */
  function placeCard() {
    if (!cardPin) return;
    const Wv = svg.clientWidth, Hv = svg.clientHeight, { sx, sy } = cardPin;
    if (sx < 0 || sy < 0 || sx > Wv || sy > Hv) { card.hidden = true; return; }
    card.hidden = false;
    const w = card.offsetWidth, h = card.offsetHeight, gap = 22;
    let x = sx + gap;
    if (x + w > Wv - 6) x = sx - gap - w;          // 右に入らなければ左へ
    x = Math.max(6, Math.min(Wv - w - 6, x));
    const y = Math.max(6, Math.min(Hv - h - 6, sy - h / 2));
    card.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  }
  function showCard(it) {
    if (!hoverOK() || !it) { hideCard(); return; }
    if (cardPin !== it) {
      if (cardPin) cardPin.g.classList.remove('hov');

      card.innerHTML = cardHTML(it.p);

    }
    placeCard();
  }
  function hideCard() {
    if (cardPin) cardPin.g.classList.remove('hov');
    cardPin = null; card.hidden = true; card.removeAttribute('data-place');
  }
  function nearestPin(x, y, r) {
    let best = null, bd = r;
    for (const it of pinItems) { if (!pinShown(it)) continue; const d = Math.hypot(it.sx - x, it.sy - y); if (d < bd) { bd = d; best = it; } }
    return best;
  }
  svg.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' || !hoverOK()) return;
    if (e.buttons) { hideCard(); return; }        // ドラッグ中は出さない
    const r = svg.getBoundingClientRect();
    const it = nearestPin(e.clientX - r.left, e.clientY - r.top, 24);
    if (it) showCard(it); else hideCard();
  });
  svg.addEventListener('pointerleave', () => { if (!hovRow) hideCard(); });
  svg.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') hideCard(); });
  // 順路の一覧の行 → 地図の Pin を強調してカード(Pin が今の表示範囲の外なら何もしない。地図は動かさない)
  let hovRow = null;
  $('routeBody').addEventListener('pointerover', (e) => {
    if (e.pointerType !== 'mouse' || !hoverOK()) return;
    const row = e.target.closest('.prow');
    if (!row || row === hovRow) return;
    hovRow = row;
    const it = pinOf(row.getAttribute('data-goplace'));
    const Wv = svg.clientWidth, Hv = svg.clientHeight;
    if (it && it.sx >= 0 && it.sy >= 0 && it.sx <= Wv && it.sy <= Hv) showCard(it); else hideCard();
  });
  $('routeBody').addEventListener('pointerleave', () => { hovRow = null; hideCard(); });

  // ---------- Filter の適用 ----------
  function applyFilter() {
    for (const it of pinItems) it.g.style.display = pinShown(it) ? '' : 'none';
    $('route').style.display = show['歴史'] ? '' : 'none';
    for (const el of $('routeBody').querySelectorAll('[data-cat]')) el.hidden = show[el.getAttribute('data-cat')] === false;
    for (const b of document.querySelectorAll('#filters .fbtn')) b.setAttribute('aria-pressed', String(show[b.getAttribute('data-cat')] !== false));
    if (cardPin && !pinShown(cardPin)) hideCard();
    if (layoutK != null) relayout(true);   // 見えている Pin が変わったので文字を選び直す(パンでは選び直さない)
  }
  function setShow(cat, v) {
    show[cat] = v;
    try { localStorage.setItem(FILTER_KEY, JSON.stringify(show)); } catch (e) { /* 保存できなくても表示は切り替える */ }
    applyFilter();
  }
  for (const b of document.querySelectorAll('#filters .fbtn')) {
    b.addEventListener('click', () => { const c = b.getAttribute('data-cat'); setShow(c, show[c] === false); });
  }

  // ---------- 短い案内(地図の上。操作は奪わない) ----------
  let toastT = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4000);
  }

  // ---------- 現在地(Pages 版だけ。Artifact の iframe は位置情報を許可していない) ----------
  if (D.meta.target === 'pages' && navigator.geolocation) {
    const P = D.meta.proj, BB = D.meta.bbox;
    const toXY = (lng, lat) => [(lng - P.lng0) * P.mx, (P.lat1 - lat) * P.my];   // geo.proj と同じ式
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'btn small'; btn.id = 'locBtn';
    btn.setAttribute('aria-pressed', 'false'); btn.title = '現在地'; btn.textContent = '現在地';
    document.querySelector('.hud').appendChild(btn);
    const meG = $('me');
    meG.innerHTML = '<circle class="me-acc" id="meAcc" r="0"/><circle class="me-dot" id="meDot" r="7"/>';
    meG.style.display = 'none';
    let watchId = null, active = false, me = null, needCenter = false;
    const inRange = (m) => m.lng >= BB[0] && m.lng <= BB[2] && m.lat >= BB[1] && m.lat <= BB[3];
    function drawMe() {
      if (!me || !inRange(me)) { meG.style.display = 'none'; return; }
      const [x, y] = toXY(me.lng, me.lat), k = M.st.k;
      meG.style.display = '';
      meG.setAttribute('transform', `translate(${(x * k + M.st.tx).toFixed(1)} ${(y * k + M.st.ty).toFixed(1)})`);
      $('meAcc').setAttribute('r', Math.max(0, me.acc * k).toFixed(1));   // 誤差(メートル)を地図の縮尺で
    }
    function centerMe() {
      if (!me) return;
      if (!inRange(me)) { toast('地図の範囲の外にいます'); return; }
      const [x, y] = toXY(me.lng, me.lat);
      const [top, bot] = visibleBand();
      M.st.touched = true;
      animateTo(M.st.k, svg.clientWidth / 2 - x * M.st.k, (top + bot) / 2 - y * M.st.k);
    }
    function onPos(pos) {
      me = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy || 0 };
      drawMe();
      if (needCenter) { needCenter = false; centerMe(); }
    }
    function onErr(e) {
      if (e && e.code === 1) { toast('位置情報が許可されていません'); stop(); active = false; btn.setAttribute('aria-pressed', 'false'); }
    }
    function start() {
      if (watchId != null) return;
      watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
    }
    function stop() { if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }
    btn.addEventListener('click', () => {
      if (!active) { active = true; needCenter = true; btn.setAttribute('aria-pressed', 'true'); start(); }
      else if (me) centerMe();
      else needCenter = true;
    });
    document.addEventListener('visibilitychange', () => {
      if (!active) return;
      if (document.hidden) stop(); else start();
    });
    onMapApply.push(drawMe);
  }

  // ---------- 深いリンク ----------
  let hashBusy = false;
  function setHash(h) {
    hashBusy = true;
    try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* sandbox では無視 */ }
    hashBusy = false;
  }
  function applyHash() {
    if (location.hash === '#story') { openStory(); return true; }
    const m = /^#([pc])=(.+)$/.exec(location.hash || '');
    if (!m) return false;
    const id = decodeURIComponent(m[2]);
    if (isStory()) closeStory();
    if (m[1] === 'p' && placeById.has(id)) { openPlace(id, false); return true; }
    if (m[1] === 'c' && claimById.has(id)) { openClaim(id, false); return true; }
    return false;
  }
  window.addEventListener('hashchange', () => { if (!hashBusy) applyHash(); });

  // ---------- 起動 ----------
  renderList();
  renderRoute();
  applyFilter();
  setListMode('route');
  layout();
  fitStart();
  applyHash();
  let rT = null;
  window.addEventListener('resize', () => {
    clearTimeout(rT);
    rT = setTimeout(() => { layout(); computeFitAll(); if (!M.st.touched) fitStart(); else M.apply(); relayout(); }, 80);
  });
})();

</script>
</body>
</html>
