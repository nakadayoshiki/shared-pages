<script type="application/json" id="page-data">{"claims":[{"id":"C02","date":"","y":null,"m":null,"d":null,"era":"江戸","text":"大友堀は南3条あたりから北6条まで真っすぐ北へ掘られ、そこから東北へ折れた。この直線の区間がのちの創成川になった","kind":"事実","grade":"準一次","quote":"kushi177:「尙南三條橋下を直線に北六條橋下に至り、東北に折れ」「大友堀は後創成川となりたるものにして」 / storyoo:「南3条付近から北6条へ北上し、そこから東北方向に伸ばしてフシコサツホロ川に合流させる」","srcs":["https://dl.ndl.go.jp/pid/763043/1/177","https://www.city.sapporo.jp/shimin/bunkazai/documents/r2story_ootomobori.pdf"],"at":"2026-10-13","status":"確定","places":["P10"]},{"id":"C03","date":"","y":null,"m":null,"d":null,"era":"江戸","text":"大友堀の目的を、市は直営農場の用排水路、または飲料と水田の用水と書き、『札幌沿革史』は札幌・篠路の農民の飲み水とする","kind":"解釈","grade":"準一次","quote":"storyoo:「箱館奉行の直営農場のための用排水路」 / listoo:「飲料と水田への用水を目的として」 / enkaku39:「清水を札幌篠路二村農民の飲料に給せんとて」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2story_ootomobori.pdf","https://www.city.sapporo.jp/shimin/bunkazai/documents/r2kouseibunkazai_ootomobori210316.pdf","https://dl.ndl.go.jp/pid/994466/1/39"],"at":"2026-10-13","status":"帰属","places":["P10"]},{"id":"C65","date":"","y":null,"m":null,"d":null,"era":"江戸","text":"札幌の中心は豊平川がつくった扇状地の上にあり、扇状地の末端の札幌駅のあたりで地下の水がメム(湧き水)として湧いた","kind":"事実","grade":"準一次","quote":"listk:「札幌の中心市街地は豊平川が形成した扇状地上にある。」「扇状地末端にあたる現・JR札幌駅周辺などで湧き水となって流れ出していた。」 / nagaoka:「この泉は豊平川扇状地の末端部に位置し，そこから多くの地下水が湧き出し，人々に利用されていた。」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2kouseibunkazai_kaitakushi2.pdf","https://www.jstage.jst.go.jp/article/jjca/55/3/55_3_1/_pdf"],"at":"2026-10-13","status":"確定","places":["P01"]},{"id":"C70","date":"1801〜1802","y":1801,"m":null,"d":null,"era":"江戸","text":"市の博物館活動センターは、今の豊平川はおよそ200年前の1801〜2年ころの洪水で流れを変えたと書く","kind":"事実","grade":"準一次","quote":"muse69:「現在の豊平川は今からおよそ200年前の1801～2年ころに、洪水によって流れを変えたことが記録に残されています。」","srcs":["https://www.city.sapporo.jp/museum/museletter/documents/museletter_69.pdf"],"at":"2026-10-13","status":"要確認","places":[]},{"id":"C01","date":"1866","y":1866,"m":null,"d":null,"era":"江戸","text":"市は大友亀太郎が慶応2年(1866)に大友堀を開いたとする。『札幌区史』の大友堀の項は堀の年を書かない","kind":"事実","grade":"準一次","quote":"storyoo:「慶応2年(1866年)に、箱館奉行の直営農場のための用排水路として大友亀太郎によって開鑿されたもの」 / listoo:「幕府の命を受けた大友亀太郎が慶応2年(1866年)、伏篭川流域の沖積土地帯に御手作場をつくるため」 / kushi177:「慶應三年の移住農夫は皆其大友堀を挾んで居をトし」(堀の年は書かない)","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2story_ootomobori.pdf","https://www.city.sapporo.jp/shimin/bunkazai/documents/r2kouseibunkazai_ootomobori210316.pdf","https://dl.ndl.go.jp/pid/763043/1/177"],"at":"2026-10-13","status":"要確認","places":["P10"]},{"id":"C22","date":"","y":null,"m":null,"d":null,"era":"明治","text":"狸小路の名の由来について、市の広報は明治にこのあたりにいた娼婦が男たちをタヌキのようにだましたからという説と、タヌキが多くいたからという説を並べる。説の主は書かない(説が分かれる)","kind":"解釈","grade":"準一次","quote":"koho0704:「明治時代、この辺りに白首と呼ばれる娼婦が百人以上もいて、歩いている男たちをタヌキのようにだましていたことから、こう呼ばれるようになりました。タヌキがこの辺りに多くいたからという説もあります。」","srcs":["https://www.city.sapporo.jp/somu/koho-shi/200704/documents/200704chuo02.pdf"],"at":"2026-10-13","status":"帰属","places":["P18"]},{"id":"C25","date":"","y":null,"m":null,"d":null,"era":"明治","text":"二条市場は、明治初期に石狩浜の漁師が魚を売ったのが発端と「いわれています」と書き、創成川の西の魚売りが東へ店を開き十三組合ができたのを始まりとする","kind":"解釈","grade":"準一次","quote":"nijo:「明治初期に石狩浜の漁師が石狩川をさかのぼり、この付近で新鮮な魚を売ったことが発端といわれています。」「13 軒の商店による「十三組合」ができ、今の二条市場のはじまりとなりました。」","srcs":["https://nijomarket.com/about"],"at":"2026-10-13","status":"帰属","places":["P12"]},{"id":"C06","date":"1869","y":1869,"m":null,"d":null,"era":"明治","text":"1869年に開拓使が置かれ、開拓判官の島義勇が札幌本府の建設に着手した(中央区年表は今の北1西1とする)。初代長官は鍋島直正で、島は判官","kind":"事実","grade":"準一次","quote":"nenpyo:「開拓使設置、初代長官に鍋島直正」「島判官、札幌本府建設に着手（現北1西1）」 / jacar:「明治2年(1869)7月に設置。」 / kushi193:「島判官來札の當時」","srcs":["https://www.city.sapporo.jp/chuo/gaiyo/nenpyo.html","https://jacar.go.jp/exhibition/glossary/term3/0010-0060-0020.html","https://dl.ndl.go.jp/pid/763043/1/193"],"at":"2026-10-13","status":"確定","places":[]},{"id":"C07","date":"1869","y":1869,"m":null,"d":null,"era":"明治","text":"『札幌区史』は、島判官の本府の地割を三町四方、長官・判官の邸宅地を幅50間・奥行60間、道幅を3間としたと書く","kind":"数値","grade":"準一次","quote":"kushi190:「其經營は本府の地割を三町四方と定め、長官判官邸宅地各幅五十間奥行六十間、道幅三間たり。」","srcs":["https://dl.ndl.go.jp/pid/763043/1/190"],"at":"2026-10-13","status":"要確認","places":[]},{"id":"C08","date":"1869","y":1869,"m":null,"d":null,"era":"明治","text":"島はコタンベツの丘から真東を望み、大友堀との交点を町づくりの原点にしたと市は「いわれています」と書く。小林は基点を渡島通(今の南1条通)と大友堀の交点とする","kind":"解釈","grade":"準一次","quote":"shiryo5:「「コタンベツの丘(現在の北海道神宮の背後の丘)」から真東を望み、創成川(当時は大友堀)との交点が町づくりの原点となったといわれています。」 / kobayashi:「渡島通（現在の南1条通）と大友堀(現在の創成川)と交点を基点とした。」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/3shiryo-5.pdf","https://www.jila-zouen.org/wpdata/wp-content/uploads/2014/04/633.pdf"],"at":"2026-10-13","status":"帰属","places":["P11"]},{"id":"C10","date":"1869 / 1871","y":1869,"m":null,"d":null,"era":"明治","text":"「一里四方」の市街の計画を、市の都市計画課の頁は島義勇(「開拓使初代長官」と書く)の策定とし、『札幌区史』は1871年の岩村の再経営の中で書く","kind":"事実","grade":"準一次","quote":"mame:「開拓使初代長官の島義勇（しま　よしたけ）は、東西南北に街区を分け一里四方の格子状に配置する市街地計画を策定しました。」 / kushi229:「先つ開拓使假廳舍を中心となし一里四方を市街地と定め、四年五月」","srcs":["https://www.city.sapporo.jp/keikaku/machibon/machibon6/mamechisiki.html","https://dl.ndl.go.jp/pid/763043/1/229"],"at":"2026-10-13","status":"諸説","places":["P11"]},{"id":"C11","date":"1869〜1871","y":1869,"m":null,"d":null,"era":"明治","text":"町割りの東西の軸は説が分かれる。市の大友堀の物語は岩村が後志通(今の大通)を基線にしたとし、市の会議資料は南1条通を東西軸とし、小林は大通を基点の東西軸から一区画北にずらして敷いたとする","kind":"解釈","grade":"準一次","quote":"storyoo:「島の後任の岩村通俊判官は東西に走る後志通(現・大通)の広い緑地帯を基線にして」 / shiryo5:「現在の南1条通りを東西軸、創成川を南北軸として」 / kobayashi:「大通は基点を通る東西軸(現在の南1条通)ではなく，一区画分，北に移動し，これと並行して敷設された。」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2story_ootomobori.pdf","https://www.city.sapporo.jp/shimin/bunkazai/documents/3shiryo-5.pdf","https://www.jila-zouen.org/wpdata/wp-content/uploads/2014/04/633.pdf"],"at":"2026-10-13","status":"帰属","places":["P11"]},{"id":"C68","date":"1869","y":1869,"m":null,"d":null,"era":"明治","text":"島判官が来た頃、シャクシコトニ(今の偕楽園附近)にアイヌの乙名・琴似又市らが暮らしていた(市の計画は名を「琴似又一」と書く)","kind":"事実","grade":"準一次","quote":"kushi193:「シヤクシコトニ(今の偕樂園附近)乙名琴似又市、發寒乙名コマンダ等のアイヌ人ありて、小部落に散在し」 / tanimoto:「明治初頭の札幌本府膝下に居を構えたアイヌ民族…琴似又市氏」 / plan4:「サクシュコトニ川沿いに暮らす琴似又一ら」","srcs":["https://dl.ndl.go.jp/pid/763043/1/193","https://eprints.lib.hokudai.ac.jp/dspace/bitstream/2115/70078/1/11_06_tanimoto.pdf","https://www.city.sapporo.jp/shimin/bunkazai/documents/06_dai2kikeikaku_dai4syou.pdf"],"at":"2026-10-13","status":"確定","places":["P03"]},{"id":"C05","date":"1870 / 1871","y":1870,"m":null,"d":null,"era":"明治","text":"大友堀を南へ延ばした吉田堀の年は、市が1870年、『札幌沿革史』が1871年。北へ延ばした寺尾堀は市が1870年とする","kind":"事実","grade":"準一次","quote":"storyoo:「明治3年(1870年)、「大友堀」の北6条から北の旧琴似川の合流点に「寺尾堀」が、「大友堀」の南3条から南6条に「吉田堀」が開鑿されて」 / enkaku39:「明治四年南六條橋より三條橋下まで、直線に開鑿せり、此は吉田茂八の堀割なれば當時之を吉田堀といひ」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2story_ootomobori.pdf","https://dl.ndl.go.jp/pid/994466/1/39"],"at":"2026-10-13","status":"諸説","places":["P10","P22"]},{"id":"C12","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"創成川筋の関門の南を町地、北を官宅地と呼んだ。市は、大通の北に官庁街、南に民間の店を置いた名残で道庁や国の役所が大通の北にあると説明する","kind":"事実","grade":"準一次","quote":"enkaku34:「當時創成川筋(今豐平館東南隅の外水門の邊)に關門を設け、南を町地、北を官宅地と稱し」 / kushi229:「當時創成川畔に設置したる關門の南を町地北を官宅地と稱し」 / mame:「北海道庁や国の役所（合同庁舎）が大通より北にあるのは、そのなごりなんですね。」","srcs":["https://dl.ndl.go.jp/pid/994466/1/34","https://dl.ndl.go.jp/pid/763043/1/229","https://www.city.sapporo.jp/keikaku/machibon/machibon6/mamechisiki.html"],"at":"2026-10-13","status":"確定","places":["P16"]},{"id":"C13","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"1871年に開拓使の本庁が札幌へ移り、仮本庁が北4条東1丁目に建った","kind":"事実","grade":"準一次","quote":"jacar:「明治4年(1871)5月に札幌へ移された。」 / nenpyo:「開拓使仮本庁竣工（北4東1）」","srcs":["https://jacar.go.jp/exhibition/glossary/term3/0010-0060-0020.html","https://www.city.sapporo.jp/chuo/gaiyo/nenpyo.html"],"at":"2026-10-13","status":"要確認","places":[]},{"id":"C14","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"南1条で大友堀に架かる橋を、岩村通俊が創成橋と名付けた。年は市の資料が1871年","kind":"事実","grade":"準一次","quote":"listk:「明治4年(1871年)、現在の南1条の「大友堀」に架けられた橋が岩村通俊判官により創成橋と名付けられた。」 / enkaku39:「南一條通に橋を架設し、大判官名けて創成橋といふ」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2kouseibunkazai_kaitakushi2.pdf","https://dl.ndl.go.jp/pid/994466/1/39"],"at":"2026-10-13","status":"要確認","places":["P11"]},{"id":"C27","date":"1871〜1911","y":1871,"m":null,"d":null,"era":"明治","text":"大通の幅は資料で違う。『札幌沿革史』は50間、『札幌区史』は「八十間の大防線」と1911年現況の58間、小林は1875年の図で60間(108m)とする","kind":"数値","grade":"準一次","quote":"enkaku34:「幅五十間の廣街を開きて火防線とせり」 / kushi229:「八十間の大防線を作り」 / kushi71:「大通火防線の五十八間あり」 / kobayashi:「幅員は「明治 8 年札幌市街図」21)では 60 間（108ｍ）であり」","srcs":["https://dl.ndl.go.jp/pid/994466/1/34","https://dl.ndl.go.jp/pid/763043/1/229","https://dl.ndl.go.jp/pid/763043/1/71","https://www.jila-zouen.org/wpdata/wp-content/uploads/2014/04/633.pdf"],"at":"2026-10-13","status":"諸説","places":["P16"]},{"id":"C28","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"市と『札幌沿革史』は、大通を1871年に開拓使が火防線として開いた通りとする","kind":"解釈","grade":"準一次","quote":"odori:「明治4年 （1871年） 開拓使により火防線等を目的に広幅員の道路を整備」 / enkaku34:「されば當時大通を火防線と呼び、其の後ち後志通と稱す」","srcs":["https://www.city.sapporo.jp/ryokuka/midori/documents/idealofodoripark.pdf","https://dl.ndl.go.jp/pid/994466/1/34"],"at":"2026-10-13","status":"帰属","places":["P16"]},{"id":"C48","date":"1871","y":1871,"m":null,"d":null,"era":"明治","text":"1871年、岩村通俊が湧き水のある琴似川の上流の地に偕楽園を開いた。市は札幌で最初の公園とする(場所は市が北7条西7丁目付近、『札幌区史』が北6条西6・7丁目と書く)","kind":"事実","grade":"準一次","quote":"seikapdf:「偕楽園は明治4年、開拓判官岩村通俊によってシャクシコトニ川河畔で、かつ涌泉がある現中央区北7条西7丁目付近に、札幌で最初の公園としてつくられた。」 / kushi236:「明治四年岩村判官は、地を今の北六條西六七丁目に當る水木幽邃の地にトして、庶民遊覽の場所を開設せり。」","srcs":["https://www.city.sapporo.jp/ncms/shimin/bunkazai/pdf/SEIKATEI.pdf","https://dl.ndl.go.jp/pid/763043/1/236"],"at":"2026-10-13","status":"確定","places":["P03"]},{"id":"C09","date":"1871-05","y":1871,"m":5,"d":null,"era":"明治","text":"1871年5月、岩村通俊が中田為信に測量させ、市街の区画を60間、道幅を11間、裏道を6間と定めた","kind":"数値","grade":"準一次","quote":"kushi229:「四年五月、中田孝吉爲信に命じて測量せしむ。市區を六十間に區畫し、道幅を十一間、裏道を六間と定む。」 / enkaku34:「明治四年五月、開拓使大判官岩村通俊、始て中田爲信に命じて測量せしめたるを始とす、市區を六十間に區畫し、道幅を十一間、裏道を六間と定む」","srcs":["https://dl.ndl.go.jp/pid/763043/1/229","https://dl.ndl.go.jp/pid/994466/1/34"],"at":"2026-10-13","status":"確定","places":["P11"]},{"id":"C15","date":"1872-02 / 1874-07","y":1872,"m":null,"d":null,"era":"明治","text":"創成川の名が付いた年は、『札幌区史』が1872年2月、『札幌沿革史』と市が1874年。沿革史は同じ頁で「(五年)創成川を堀割り」とも書く","kind":"事実","grade":"準一次","quote":"kushi229:「五年二月創成川の名稱を付し」 / enkaku39:「堀割は唯新川と稱し、未だ創成川の稱あらず」「七月工を竣へ、創成川と稱す」 / listk:「明治7年(1874年)、開拓使によって創成川と命名された。」","srcs":["https://dl.ndl.go.jp/pid/763043/1/229","https://dl.ndl.go.jp/pid/994466/1/39","https://www.city.sapporo.jp/shimin/bunkazai/documents/r2kouseibunkazai_kaitakushi2.pdf"],"at":"2026-10-13","status":"諸説","places":["P10"]},{"id":"C17","date":"1872","y":1872,"m":null,"d":null,"era":"明治","text":"1872年から創成川の東に開拓使の工場(製材・木工・鋳物・製粉・製糸・味噌醤油など)が並び、水車と蒸気エンジンを動力にした","kind":"事実","grade":"準一次","quote":"storyk:「創成川(大友堀)の東側には、明治5年(1872年)から後に工業局・物産局・民事局となる開拓使の担当掛により、製材、木工、馬具、鋳物、製粉、製網、製糸(紡織所)、製糖、味噌醤油醸造などの工場群が整備されました。それらでは水車に加え最新鋭の蒸気エンジンを動力にしていました。」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2story_kaitakushi210316.pdf"],"at":"2026-10-13","status":"要確認","places":["P10"]},{"id":"C16","date":"1872-02","y":1872,"m":2,"d":null,"era":"明治","text":"創成橋のたもとに高札と里程元標が置かれ、1911年にも創成橋畔に全道の里程元標があった","kind":"事実","grade":"準一次","quote":"kushi229:「高札を橋畔に建て、里程元標を置き」 / kushi32:「札幌區の中心創成橋畔の全道の里程元標より」","srcs":["https://dl.ndl.go.jp/pid/763043/1/229","https://dl.ndl.go.jp/pid/763043/1/32"],"at":"2026-10-13","status":"要確認","places":["P11"]},{"id":"C21","date":"1873","y":1873,"m":null,"d":null,"era":"明治","text":"狸小路商店街は、明治6年頃に今の2丁目・3丁目あたりの一角が「狸小路」と呼ばれるようになったとし、明治6年を始まりに数える","kind":"解釈","grade":"準一次","quote":"tanuki:「明治6年頃に、その一角が「狸小路」と呼ばれるようになりました。」「2026年で153年（明治6年～）を迎えました。」","srcs":["https://tanukikoji.or.jp/about-tanukikoji/"],"at":"2026-10-13","status":"帰属","places":["P18"]},{"id":"C40","date":"1873-10","y":1873,"m":10,"d":null,"era":"明治","text":"開拓使の本庁舎は1873年10月に完成した(文化庁は10月29日)。『札幌区史』はケプロンの設計による三層の洋館とする","kind":"事実","grade":"準一次","quote":"bunka:「翌明治６年（１８７３）１０月２９日、本庁舎と付属建物が完成したが」 / kushi264:「ケプロンの設計に基き」「翌六年七月六日市民の參觀を許して、上棟式を擧行し」「十月に至り、全部落成を告げたり。廣百六十八坪餘、桁行十六間六分六厘梁間十間の三層樓洋館にして」","srcs":["https://online.bunka.go.jp/heritages/detail/189962","https://dl.ndl.go.jp/pid/763043/1/264"],"at":"2026-10-13","status":"確定","places":["P07"]},{"id":"C52","date":"1876","y":1876,"m":null,"d":null,"era":"明治","text":"1876年、開拓使麦酒醸造所が北2条東4丁目(今のサッポロファクトリーの地)に設けられた。技師は中川清兵衛","kind":"事実","grade":"準一次","quote":"listk:「翌9年(1876年)に開拓使麦酒醸造所を北2条東4丁目に設けた。」 / kushi405:「明治九年九月始めて今の札幌麥酒釀造場の地をトし」「其技師は嘗て獨國に學びたる中川清兵衞にして。」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/r2kouseibunkazai_kaitakushi2.pdf","https://dl.ndl.go.jp/pid/763043/1/405"],"at":"2026-10-13","status":"確定","places":["P13"]},{"id":"C51","date":"1877〜1880 / 1880","y":1877,"m":null,"d":null,"era":"明治","text":"永山武四郎の私邸が建った年を、施設の公式は明治10年代前半、中央区の頁は明治13年と書く(どちらも札幌市の側の資料で、食い違いではない)","kind":"事実","grade":"準一次","quote":"nagayama:「旧永山武四郎邸は、明治10年代前半、屯田事務局長時代の永山武四郎が私邸として建築しました。」 / tohoku:「明治13年　第2代北海道長官永山武四郎私邸建設される」","srcs":["https://sapporoshi-nagayamatei.jp/","https://www.city.sapporo.jp/chuo/tohoku/monogatari.html"],"at":"2026-10-13","status":"要確認","places":["P14"]},{"id":"C69","date":"1878","y":1878,"m":null,"d":null,"era":"明治","text":"1878年に石狩川の支流での鮭鱒漁が禁じられ、札幌に暮らしたアイヌの多くが茨戸へ、次いで旭川近文へ移ることを余儀なくされた","kind":"事実","grade":"準一次","quote":"plan4:「明治11年(1878年)に漁業資源保護を名目に現在の札幌市域の諸川を含む石狩川支流での鮭鱒漁が禁止され、市域内に暮らしたアイヌ民族の多くが石狩川本流の茨戸へ、次いで旭川近文の「旧土人保護地」への移住を余儀なくされました。」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/documents/06_dai2kikeikaku_dai4syou.pdf"],"at":"2026-10-13","status":"要確認","places":[]},{"id":"C45","date":"1878-10","y":1878,"m":10,"d":null,"era":"明治","text":"時計台は1878年10月に札幌農学校の演武場として完成した。日は時計台の頁が10月16日とする","kind":"事実","grade":"準一次","quote":"tokeipdf:「開拓使工業局の設計・監督により、明治11年10月に完成した。」 / kushi327:「十月演武場を建築して、盛大なる開場式を擧行し」 / tokeidai:「演武場が1878年（明治11年）10月16日に完成しました。」","srcs":["https://www.city.sapporo.jp/ncms/shimin/bunkazai/pdf/TOKEIDAI.pdf","https://dl.ndl.go.jp/pid/763043/1/327","https://sapporoshi-tokeidai.jp/know/walking.php"],"at":"2026-10-13","status":"確定","places":["P08"]},{"id":"C41","date":"1879-01-12 / 1879-01-17","y":1879,"m":null,"d":null,"era":"明治","text":"開拓使本庁舎が焼けた日は、『札幌区史』が1879年1月12日(暖炉の煙筒から出火)、文化庁が1月17日","kind":"事実","grade":"準一次","quote":"kushi299:「明治十二年一月十二日 札幌本廳暖爐煙筒より發火し」 / bunka:「明治１２年（１８７９）１月１７日の火災で焼失した。」","srcs":["https://dl.ndl.go.jp/pid/763043/1/299","https://online.bunka.go.jp/heritages/detail/189962"],"at":"2026-10-13","status":"諸説","places":["P07"]},{"id":"C39","date":"1880 / 1881","y":1880,"m":null,"d":null,"era":"明治","text":"豊平館が北1条西1丁目に建った年は、市の文化財課が1880年(建築)、中央区年表が1881年(落成)。『札幌区史』は1879年1月着手・1881年8月竣工と書く","kind":"事実","grade":"準一次","quote":"houheikan:「明治13年に開拓使がホテルとして現在の北1条西1丁目に建築した」 / nenpyo:「豊平館落成」(明治14年) / kushi265:「明治十二年一月著手、十四年八月竣工す」","srcs":["https://www.city.sapporo.jp/shimin/bunkazai/houheikan.html","https://www.city.sapporo.jp/chuo/gaiyo/nenpyo.html","https://dl.ndl.go.jp/pid/763043/1/265"],"at":"2026-10-13","status":"諸説","places":["P09"]},{"id":"C49","date":"1880","y":1880,"m":null,"d":null,"era":"明治","text":"清華亭は1880年に偕楽園の中に開拓使の貴賓接待所として建ち、黒田清隆が「水木清華亭」と名付けた","kind":"事実","grade":"準一次","quote":"seikapdf:「この建物は、明治13年、札幌最初の公園である偕楽園内に、開拓使の貴賓接待所として建てられた。」「開拓長官黒田清隆によって「水木清華亭」と名付けられた。」 / yokoyama63:「起工 12 年 10 月・竣工 13 年 6 月」","srcs":["https://www.city.sapporo.jp/ncms/shimin/bunkazai/pdf/SEIKATEI.pdf","https://www.jstage.jst.go.jp/article/aijsaxx/89/0/89_KJ00004496060/_pdf"],"at":"2026-10-13","status":"確定","places":["P04"]},{"id":"C18","date":"1881","y":1881,"m":null,"d":null,"era":"明治","text":"1881年、町名を改め、大通を境に南北(条)、創成川を境に東西(丁目)に分けた今の呼び方になった(『札幌区史』は6月25日)","kind":"事実","grade":"準一次","quote":"kushi229:「十四年六月廿五日、御巡幸に先立ち」「大通火防線を中心として南北に分ち、又創成川を界として東西に分ち、以て今の名稱に改めたる」 / nenpyo:「札幌市街に条丁目設定」","srcs":["https://dl.ndl.go.jp/pid/763043/1/229","https://www.city.sapporo.jp/chuo/gaiyo/nenpyo.html"],"at":"2026-10-13","status":"確定","places":["P16"]},{"id":"C19","date":"1881","y":1881,"m":null,"d":null,"era":"明治","text":"『札幌沿革史』は、条丁目の改称を創成川中央と後志通中央を基線にしたものと書き、御巡幸を前に京都の町名に倣っただけという説も並べる","kind":"解釈","grade":"準一次","quote":"enkaku35:「先つ創成川中央の方向を以て、東西への町區基線と定め」「南北は後志通中央の方向を以て、南北への町名起線と定め」「西京の街名に擬摸せしに過ぎず」","srcs":["https://dl.ndl.go.jp/pid/994466/1/35"],"at":"2026-10-13","status":"帰属","places":["P16"]},{"id":"C46","date":"1881","y":1881,"m":null,"d":null,"era":"明治","text":"1881年に演武場の鐘楼を改めて塔時計が付いた(時計台の頁は8月12日に動き始めたとする)。時計はハワード社製","kind":"事実","grade":"準一次","quote":"tokeipdf:「明治14年、時計塔を付設し、同21年1月、札幌の標準時計とすることが告示された。」「なお、時計は米国ボストン市ハワード社製である。」 / kushi327:「十四年七月演武場鐘樓を改築し、自鳴鐘を裝置す、今の札幌標準時時計臺卽ち是なり。」 / tokeidai:「1881年（明治14年）8月12日、塔時計は澄んだ鐘の音とともに正しい時刻を札幌の住民に知らせ始めました。」","srcs":["https://www.city.sapporo.jp/ncms/shimin/bunkazai/pdf/TOKEIDAI.pdf","https://dl.ndl.go.jp/pid/763043/1/327","https://sapporoshi-tokeidai.jp/know/walking.php"],"at":"2026-10-13","status":"確定","places":["P08"]},{"id":"C50","date":"1881","y":1881,"m":null,"d":null,"era":"明治","text":"1881年の行幸で明治天皇が清華亭に立ち寄った(市は9月1日とする)","kind":"事実","grade":"準一次","quote":"seikapdf:「明治14年9月1日、明治天皇行幸の際、ご休憩された由緒ある建物である。」 / kushi320:「三時十分清華亭臨御、舊樺太土人(對雁在住者)の舞踏天覽あり。」","srcs":["https://www.city.sapporo.jp/ncms/shimin/bunkazai/pdf/SEIKATEI.pdf","https://dl.ndl.go.jp/pid/763043/1/320"],"at":"2026-10-13","status":"要確認","places":["P04"]},{"id":"C23","date":"1885","y":1885,"m":null,"d":null,"era":"明治","text":"1885年、狸小路(南2条西1丁目)に勧工場が置かれた","kind":"事実","grade":"準一次","quote":"nenpyo:「狸小路に勧工場設置（南2西1）」","srcs":["https://www.city.sapporo.jp/chuo/gaiyo/nenpyo.html"],"at":"2026-10-13","status":"要確認","places":["P18"]},{"id":"C54","date":"1886","y":1886,"m":null,"d":null,"era":"明治","text":"北大植物園は、1877年のクラークの進言に始まり、宮部金吾の計画で1886年に開園した。植物園は日本で2番目に古いとする","kind":"事実","grade":"一次","quote":"bg:「宮部金吾が計画・設計をし、1886（明治19）年に開園しました。近代的植物園として我が国で初めて造られたもので、日本で2番目に古い植物園です。」","srcs":["https://www.hokudai.ac.jp/fsc/bg/g_aboutus.html"],"at":"2026-10-13","status":"要確認","places":["P05"]},{"id":"C42","date":"1888-12-14","y":1888,"m":12,"d":14,"era":"明治","text":"北海道庁の本庁舎(赤れんが庁舎)は1888年12月14日に完成し、道庁が移った。開拓使本庁舎の敷地の南側に建つ","kind":"事実","grade":"準一次","quote":"bunka:「明治２１年（１８８ news17.pdf"],"at":"2026-10-13","status":"帰属","places":["P16"]},{"id":"C04","date":"1897","y":1897,"m":null,"d":null,"era":"明治","text":"榎本洋介は、水路が「大友堀」と呼ばれるようになったのは1897年の『札幌沿革史』の編纂のころからと推測する","kind":"解釈","grade":"二次","quote":"teine155:「おそらく明治30年に札幌史学会が『札幌沿革史』を編纂発行した際に史実として判明したのであろう。それ以降と思われるが、大友による水路は「大友堀」と呼ばれるようになった。」","srcs":["https://www.city.sapporo.jp/teine/shimin/chiikishinkou/rekishi/documents/kaihou155.pdf"],"at":"2026-10-13","status":"帰属","places":["P10"]},{"id":"C24","date":"1897","y":1897,"m":null,"d":null,"era":"明治","text":"1897年の『札幌沿革史』は、南2条西1丁目を同業者の集まる「肴屋町」と書く","kind":"事実","grade":"準一次","quote":"enkaku95:「南二條西一丁目の肴屋町、雨龍通の古着屋町」「同業者自然と一ケ所に集合するは、札幌商業進化の一現象なり」","srcs":["https://dl.ndl.go.jp/pid/994466/1/95"],"at":"2026-10-13","status":"要確認","places":["P12"]},{"id":"C29","date":"1897","y":1897,"m":null,"d":null,"era":"明治","text":"榎本洋介は、大通に「火防線」と書いた図は1897年の『札幌沿革史』の編纂時の付図で明治4・5年の図ではないとし、大通は城下町の武家地と町人地を分ける空間と大門だったと考える","kind":"解釈","grade":"準一次","quote":"news17:「『札幌沿革史』を編纂する際に作成されたもので、付図の名称である明治４、５年に作成されたものではない。」「やはり近世の城下町のように武家と町人地を区分する空間と大門と考えるのが妥当である。」","srcs":["https://www.city.sapporo.jp/kobunshokan/kankobutsu/bunkashiryoshitsunews/documents/news17.pdf"],"at":"2026-10-13","status":"帰属","places":["P16"]},{"id":"C47","date":"1906","y":1906,"m":null,"d":null,"era":"明治","text":"札幌農学校が1903年に今の北大の位置へ移った後、演武場は1906年に今の場所へ移された。元は北2条通の路上と北2条西2丁目にまたがる所","kind":"事実","grade":"準一次","quote":"tokeipdf:「明治36年7月、農学校は現在の北海道大学の位置に移転し」「明治39年、それらは札幌区の所有になるとともに、建物は現在地に移された。旧位置は、現在の北2条通りの路上と、北2条西2丁目にまたがる一帯であった。」 / yokoyama61:「39 年 8 月に現在地に移築された。」","srcs":["https://www.city.sapporo.jp/ncms/shimin/bunkazai/pdf/TOKEIDAI.pdf","https://www.jstage.jst.go.jp/article/aijsaxx/69.2/0/69.2_KJ00004445663/_pdf"],"at":"2026-10-13","status":"確定","places":["P02","P08"]},{"id":"C61","date":"1909 / 1918 / 1927","y":1909,"m":null,"d":null,"era":"明治","text":"市電の始まりは何を数えるかで違う。石材を運ぶ馬車鉄道が1909年(中央区年表は馬鉄を1912年)、電車が1918年、市営は1927年(中央区年表は市電運行開始を1927年とする)","kind":"事実","grade":"準一次","quote":"shiden:「1909年（明治42年 }},{"rep":true,"crop":null,"id":"F11","file":"images/F11-3a6f1d0c.webp","kind":"現地写真","year":"2024","cap":"さっぽろテレビ塔。","note":"","change":"(縮小・WebP に変換。切り出しなし)","places":["P15"],"claims":[],"src":"Wikimedia Commons","author":"ノボホショコロトソ","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Sapporo_TV_Tower_札幌テレビ塔_2024_01.jpg","at":"2026-10-23","w":1600,"h":1200,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F11-cd711e8d.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F12","file":"images/F12-d00f9cd7.webp","kind":"現地写真","year":"2011","cap":"札幌市資料館(旧札幌控訴院)。","note":"","change":"(縮小・WebP に変換。切り出しなし)","places":["P17"],"claims":[],"src":"Wikimedia Commons","author":"Ninosan","license":"CC0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:SapporoShiShiryokan201109.JPG","at":"2026-10-23","w":1600,"h":1200,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F12-3a2724dd.webp","w":240,"h":180}},{"rep":true,"crop":null,"id":"F13","file":"images/F13-d35fe4e9.webp","kind":"現地写真","year":"2023","cap":"狸小路商店街。","note":"","change":"(縮小・WebP に変換。切り出しなし)","places":["P18"],"claims":[],"src":"Wikimedia Commons","author":"禁樹なずな","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Tanukikoji_-_the_150th_Anniversary.jpg","at":"2026-10-23","w":1600,"h":1060,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F13-51bffd17.webp","w":240,"h":159}},{"rep":true,"crop":null,"id":"F14","file":"images/F14-a7b6316b.webp","kind":"現地写真","year":"2011","cap":"チ・カ・ホ(札幌駅前通地下歩行空間)。","note":"","change":"(縮小・WebP に変換。切り出しなし)","places":["P19"],"claims":[],"src":"Wikimedia Commons","author":"663highland","license":"CC BY 2.5","licenseUrl":"https://creativecommons.org/licenses/by/2.5/deed.ja","url":"https://commons.wikimedia.org/wiki/File:Sapporo_Underground_Pedestrian_Space_Station_Road01s3.jpg","at":"2026-10-23","w":1600,"h":1063,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F14-0544fe9c.webp","w":240,"h":159}},{"rep":false,"crop":null,"id":"F15","file":"images/F15-f1c08b93.webp","kind":"現地写真","year":"2007","cap":"ポールタウン。","note":"2007年の撮影で古い。","change":"(WebP に変換。切り出しなし)","places":["P20"],"claims":[],"src":"Wikimedia Commons","author":"モンモン","license":"パブリックドメイン(作者による公開)","licenseUrl":null,"url":"https://commons.wikimedia.org/wiki/File:POLE_TOWN.jpg","at":"2026-10-23","w":640,"h":480,"range":null,"mly":false,"thumb":{"file":"images/thumbs/F15-14cb4ff8.webp","w":240,"h":180}}],"story":[{"t":"h1","text":"札幌都心の読み物"},{"t":"h2","text":"1. 町割りの骨格"},{"t":"p","text":"札幌の碁盤の目は、開拓使より前に掘られた一本の水路から始まる。市は大友亀太郎が1866年に大友堀を開いたとする。南3条あたりから北6条まで真っすぐ北へ掘られたこの区間が、今の創成川として残る。","refs":[],"img":null},{"t":"p","text":"堀の目的は資料によって農場の用排水路とも農民の飲み水とも書かれ、「大友堀」という呼び名そのものも1897年の『札幌沿革史』の頃からと推測されている。堀を南北へ延ばした吉田堀の年も、市と沿革史で1年違う。[C01][C02][C03][C04][C05]","refs":["C01","C02","C03","C04","C05"],"img":null},{"t":"p","text":"1869年に開拓使が置かれ、判官の島義勇が本府の建設に取りかかった。『札幌区史』は島の地割を三町四方と書く。島がどこを町の基点にしたかは、市の資料が「いわれています」と伝え、研究者は南1条通と大友堀の交点とみる。","refs":[],"img":null},{"t":"p","text":"町の東西の軸を大通とするか南1条通とするかも、資料によって違う。創成川の西に立つときは、川が南北の軸であることだけは資料がそろっていると覚えておくとよい。[C06][C07][C08][C11]","refs":["C06","C07","C08","C11"],"img":null},{"t":"p","text":"島の後を継いだ岩村通俊のもとで、1871年5月に測量が行われ、区画60間・道幅11間・裏道6間が定められた。『札幌区史』と『札幌沿革史』がこの数を同じに書く。","refs":[],"img":null},{"t":"p","text":"「一里四方」の計画を誰のものとするかは、市の頁と区史で分かれる。同じ年に開拓使の本庁が札幌へ移り、創成川の関門の南を町地、北を官宅地と呼んだ。道庁や国の役所が今も大通の北にあるのはその名残と市は説明する。[C09][C10][C12][C13]","refs":["C09","C10","C12","C13"],"img":null},{"t":"p","text":"南1条通が堀を渡る橋を、岩村が創成橋と名付けた。橋のたもとには里程元標が置かれ、1911年にも全道の距離の起点だった。創成川という名が付いた年は1872年とも1874年ともいわれ、同じ沿革史の中でも揺れる。","refs":[],"img":null},{"t":"p","text":"今の石橋は1910年の橋を2010年に復元したもの。川の東側には1872年から開拓使の工場が並んだ。[C14][C15][C16][C17][C26]","refs":["C14","C15","C16","C17","C26"],"img":"E04"},{"t":"p","text":"1881年、国郡の名から付けた町名をやめ、大通を境に南北を「条」、創成川を境に東西を「丁目」と呼ぶ今の形になった。沿革史はこれを基線を定めた改称と書きつつ、御巡幸を前に京都の町名に倣っただけという説も並べる。今も住所の東西の丁目は創成川が基線になっている。[C18][C19][C20]","refs":["C18","C19","C20"],"img":"M01"},{"t":"p","text":"南の端の狸小路は、商店街が明治6年頃にその名で呼ばれ始めたとし、1885年には勧工場が置かれた。名の由来は、市の広報も娼婦が男たちをタヌキのようにだましたからとする説とタヌキが多くいたからとする説を並べる。","refs":[],"img":null},{"t":"p","text":"創成川の東の二条市場は、明治初期に石狩の漁師が魚を売ったのが発端といわれ、1897年の沿革史は南2条西1丁目を「肴屋町」と書く。[C21][C22][C23][C24][C25]","refs":["C21","C22","C23","C24","C25"],"img":null},{"t":"h2","text":"2. 大通"},{"t":"p","text":"大通は、関門の北の官宅地と南の町地の間に開かれた広い通りだった。幅は『札幌沿革史』が50間、『札幌区史』が80間と1911年の58間、1875年の図では60間と、数がそろわない。","refs":[],"img":null},{"t":"p","text":"市と沿革史は、開拓使が1871年に火防線として開いたとする。一方で、大通に「火防線」と書いた図は1897年の沿革史の編纂時に作られたもので、大通はもともと城下町のように身分を分ける空間だったという研究者の考えもある。[C27][C28][C29]","refs":["C27","C28","C29"],"img":"M02"},{"t":"p","text":"1892年の大火では887戸が焼け、大通で火が止まった。研究者は、この火事の後に大通が火防線と位置づけられていったと推察する。[C30][C31]","refs":["C30","C31"],"img":null},{"t":"p","text":"1911年、東京市から招いた長岡安平の設計で西3〜7丁目が公園として整った。戦後の1950年、雪捨て場だった7丁目の広場に中高生の雪像6基が並んだのが、第1回のさっぽろ雪まつりである。","refs":[],"img":null},{"t":"p","text":"訪れる1月下旬は、次の雪まつりの雪像を作っている最中にあたる。[C32][C33]","refs":["C32","C33"],"img":null},{"t":"p","text":"大通の東の端には1957年に開業したさっぽろテレビ塔が立つ。全長は144mで、1961年には市民の声から電光時計が付いた。西の端の西13丁目には1926年に建った札幌控訴院が、今は札幌市資料館として残る。全国8か所の控訴院のうち残るのは2か所だけという。","refs":[],"img":null},{"t":"p","text":"大通の北の北1条西1丁目には、開拓使のホテル豊平館があった。建った年は資料で1880年と1881年に分かれ、建物は今は中島公園にある。[C34][C35][C36][C37][C38][C39]","refs":["C34","C35","C36","C37","C38","C39"],"img":null},{"t":"h2","text":"3. 開拓使と道庁の建物"},{"t":"p","text":"開拓使の本庁舎は1873年10月に完成した三層の洋館だったが、1879年1月の火災で焼けた。焼けた日は区史が12日、文化庁が17日と書く。1967年に道の新しい庁舎を建てる工事で基礎杭の跡が見つかり、跡地は史跡として赤れんが庁舎の前庭に残る。","refs":[],"img":null},{"t":"p","text":"その敷地の南側に1888年12月14日に完成したのが赤れんが庁舎で、1909年の火災で内部を失いながら外壁は残った。[C40][C41][C42][C43][C44]","refs":["C40","C41","C42","C43","C44"],"img":"E01"},{"t":"p","text":"時計台は1878年10月に札幌農学校の演武場として建ち、1881年に塔時計が付いた。時計台の頁は完成を10月16日とする。農学校が今の北大へ移った後、1906年に建物は北2条から今の場所へ移された。北大の正門は、その移った先の入口である。[C45][C46][C47]","refs":["C45","C46","C47"],"img":"E03"},{"t":"p","text":"西の偕楽園は1871年に岩村が湧き水のほとりに開いた公園で、その中に1880年、開拓使の貴賓接待所として清華亭が建った。1881年には明治天皇がここに立ち寄った。[C48][C49][C50]","refs":["C48","C49","C50"],"img":"E05"},{"t":"p","text":"創成川の東では、1876年に開拓使麦酒醸造所が設けられた。その跡地に1993年にサッポロファクトリーが開業し、赤れんがと煙突が残る。近くの永山武四郎の邸は、建った年が明治10年代前半とも明治13年ともいわれる。","refs":[],"img":null},{"t":"p","text":"植物園は1886年に開園した。冬は休園で、門の外から見ることになる。[C51][C52][C53][C54]","refs":["C51","C52","C53","C54"],"img":"E02"},{"t":"h2","text":"4. 五輪と地下の都心"},{"t":"p","text":"1966年に1972年の冬季五輪の開催が決まると、渋滞を解き、選手と観客を運ぶために地下鉄がつくられることになった。1971年11月に大通と駅前通の地下を結ぶL字の地下街が開業し、オーロラタウンは公園を掘って造ってから埋め戻した。","refs":[],"img":null},{"t":"p","text":"翌12月には全国で4番目の地下鉄として南北線が開業し、1972年2月にアジア初の冬季五輪が開かれた。[C55][C56][C57][C58]","refs":["C55","C56","C57","C58"],"img":null},{"t":"p","text":"市は、五輪が街の変わるきっかけになり、冬でも歩ける地下街が生まれたと説明する。2011年には札幌駅と大通を結ぶチ・カ・ホが開通し、雪の日でも駅から大通まで地下で歩ける。","refs":[],"img":null},{"t":"p","text":"地上を走る市電の始まりは、馬車鉄道・電車・市営のどれを数えるかで1909年・1918年・1927年に分かれる。[C59][C60][C61]","refs":["C59","C60","C61"],"img":null},{"t":"h2","text":"5. 開拓の前"},{"t":"p","text":"札幌の中心は豊平川がつくった扇状地の上にあり、その末端の札幌駅のあたりで地下の水がメムと呼ばれる湧き水になった。永田方正は偕楽園の泉池をヌプサムメムと記し、植物園の泉はピシュクシュメムと呼ばれ、植物園では大正の終わり頃まで泉が湧いていた。","refs":[],"img":null},{"t":"p","text":"今の豊平川は1801〜2年ころの洪水で流れを変えたとも記されている。[C65][C66][C67][C70]","refs":["C65","C66","C67","C70"],"img":null},{"t":"p","text":"「サッポロ」という名の意味は説が分かれる。永田方正は「乾燥広大」と訳し、『札幌区史』はバチェラーや松浦武四郎の「乾く川」の説も並べた。今の市の頁と広報は「乾いた」と「湿地・葦原」という対照的な説を挙げ、どちらとも決めず、誰の説かも書かない。[C62][C63][C64]","refs":["C62","C63","C64"],"img":null},{"t":"p","text":"島判官が来た頃、偕楽園のあたりには乙名の琴似又市らのアイヌが暮らしていた。1878年に鮭鱒の漁が禁じられると、札幌に暮らしたアイヌの多くは茨戸、次いで旭川へ移ることを余儀なくされた。碁盤の目の町は、この暮らしの場の上に引かれている。[C68][C69]","refs":["C68","C69"],"img":null}],"base":{"stations":[{"name":"札幌","x":1254,"y":383},{"name":"すすきの","x":1454,"y":1851},{"name":"大通","x":1436,"y":1296},{"name":"さっぽろ","x":1367,"y":663},{"name":"西11丁目","x":479,"y":1480},{"name":"バスセンター前","x":2152,"y":1166},{"name":"西4丁目","x":1356,"y":1468,"kind":"tram"},{"name":"中央区役所前","x":481,"y":1616,"kind":"tram"},{"name":"西8丁目","x":872,"y":1544,"kind":"tram"},{"name":"狸小路","x":1416,"y":1636,"kind":"tram"},{"name":"資生館小学校前","x":1105,"y":1882,"kind":"tram"}],"size":[2562,1891],"attribution":"© OpenStreetMap contributors (ODbL)","fetched":"2026-10-11","subways":[{"name":"札幌市営地下鉄南北線","short":"南北線","colour":""},{"name":"札幌市営地下鉄東西線","short":"東西線","colour":""},{"name":"札幌市営地下鉄東豊線","short":"東豊線","colour":""}]},"meta":{"sample":false,"proj":{"lng0":141.3355,"lat1":43.0721,"mx":81330.0367590314,"my":110574},"bbox":[141.3355,43.055,141.367,43.0721],"data":"data","snapshot":"2026-10-13","counts":{"claims":70,"places":22,"images":20,"route":17}}}</script>
