<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大阪 9/20〜22</title>
<meta name="description" content="大阪 2026-09-20〜22 の候補地(Spot)とイベント(Event)を簡略地図に置いたマップ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* app.css — 大阪マップの見た目。TGS の map.template.html の <style> を複製し、
   固有部分(下地の線・Spot/Event の行と詳細・エリアの塊・日付切替)だけ差し替えたもの。
   共通(スロット制のレイアウト・シート・パネル・チップ・モーダル)は TGS と同じ規則。 */

:root {
  --ground: #F2F3EF;
  --panel: #FBFBF9;
  --panel-2: #ECEEE9;
  --line: #CDD2CB;
  --ink: #1B201D;
  --ink-2: #4F5955;
  --ink-3: #5F6A65;
  --ink-4: #7E8883;
  --accent: #2D5F52;
  --accent-ink: #FFFFFF;
  --det-head: var(--accent);
  --det-head-ink: var(--accent-ink);
  --det-bg: color-mix(in srgb, var(--accent) 7%, var(--panel));
  /* Spot のジャンル(食 / 観光 / 買い物 / その他)と Event */
  --g-food: #C2490F;
  --g-sight: #2A6FDB;
  --g-shop: #7A3FC7;
  --g-etc: #6B746F;
  --g-multi: #0F766E;
  --ev: #C22E6E;
  /* 下地(OpenStreetMap 由来の簡略 SVG) */
  --water: #A8C6E0;
  --coast: #7FA6C4;
  --road: #D6D2C6;
  --station: #4F5955;
  --area-fill: rgba(45, 95, 82, .10);
  --area-line: rgba(45, 95, 82, .45);
  --hl: #E3542A;
  --shadow: 0 8px 24px rgba(20, 30, 25, .16);
  /* 「行きたい」の人の色(名前のハッシュで 0〜7 を選ぶ)。文字には使わないので彩度を上げてよい */
  --w0: #E39B00; --w1: #1FA58A; --w2: #2A6FDB; --w3: #D0367A;
  --w4: #7A3FC7; --w5: #3F9A3A; --w6: #D9652B; --w7: #0E7490;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15181A; --panel: #1E2224; --panel-2: #262B2D; --line: #3A4143;
    --ink: #E8ECE9; --ink-2: #B4BCB8; --ink-3: #949E99; --ink-4: #7E8883;
    --accent: #6FB8A3; --accent-ink: #0F1512;
    --det-bg: color-mix(in srgb, var(--accent) 10%, var(--panel));
    --g-food: #F0935A; --g-sight: #6AA0F5; --g-shop: #B187F0; --g-etc: #9AA39E; --g-multi: #5EC8B8;
    --ev: #F06AA6;
    --water: #2B3A4E; --coast: #46627E; --road: #3A3F3C; --station: #B4BCB8;
    --area-fill: rgba(111, 184, 163, .14); --area-line: rgba(111, 184, 163, .5);
    --hl: #FF7A50;
    --shadow: 0 8px 24px rgba(0, 0, 0, .5);
    --w0: #F2B84B; --w1: #4FD0B3; --w2: #6AA0F5; --w3: #F06AA6;
    --w4: #B187F0; --w5: #6CC466; --w6: #F08A55; --w7: #35B6C9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #15181A; --panel: #1E2224; --panel-2: #262B2D; --line: #3A4143;
  --ink: #E8ECE9; --ink-2: #B4BCB8; --ink-3: #949E99; --ink-4: #7E8883;
  --accent: #6FB8A3; --accent-ink: #0F1512;
  --det-bg: color-mix(in srgb, var(--accent) 10%, var(--panel));
  --g-food: #F0935A; --g-sight: #6AA0F5; --g-shop: #B187F0; --g-etc: #9AA39E; --g-multi: #5EC8B8;
  --ev: #F06AA6;
  --water: #2B3A4E; --coast: #46627E; --road: #3A3F3C; --station: #B4BCB8;
  --area-fill: rgba(111, 184, 163, .14); --area-line: rgba(111, 184, 163, .5);
  --hl: #FF7A50;
  --shadow: 0 8px 24px rgba(0, 0, 0, .5);
  --w0: #F2B84B; --w1: #4FD0B3; --w2: #6AA0F5; --w3: #F06AA6;
  --w4: #B187F0; --w5: #6CC466; --w6: #F08A55; --w7: #35B6C9;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5; overflow: hidden;
}
.app { height: 100dvh; display: grid; grid-template-rows: auto auto auto auto minmax(0, 1fr); }
.app > .bar { grid-row: 1; } .app > .drow { grid-row: 2; } .app > .srow { grid-row: 3; }
.app > .tools { grid-row: 4; } .app > .main { grid-row: 5; }
/* スマホの 2 段目: Spot/Event の切替 と 日付。ヘッダーの sticky(検索・名前)に隠れない */
.drow { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.drow::-webkit-scrollbar { display: none; }
.drow[hidden] { display: none; }
.drow .modes { border-right: 1px solid var(--line); padding-right: 8px; margin: 0; position: static; }
.drow .dseg { margin-left: auto; }
.app > * { min-width: 0; }
.srow { display: flex; align-items: center; gap: 8px; padding: 6px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.srow[hidden] { display: none; }
.srow .search { display: block; flex: 1 1 auto; min-width: 0; min-height: 40px; font-size: 16px; }
.srow #searchClose { display: inline-flex; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 {
  margin: 0; font-family: "Barlow Condensed", "Zen Kaku Gothic New", sans-serif;
  font-weight: 700; font-size: 22px; letter-spacing: .01em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.brand .sub { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.who { font-weight: 700; }
.who .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: var(--c, var(--accent)); }
.who .sdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); margin-left: 2px; }
.who .sdot[hidden] { display: none; }
.tgl { font-weight: 700; min-height: 40px; }
.tgl[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
#wantBtn .hs { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--w0); display: inline-block; }
#wantBtn[aria-pressed="true"] .hs { border-color: var(--ground); }
/* 日付切替(全部 / 9/20 / 9/21 / 9/22)。Event を絞り、Spot は営業日で絞る */
.dseg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); flex: 0 0 auto; }
.dseg .btn {
  border: 0; border-radius: 0; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 700;
  padding: 0 10px; min-height: 40px; height: 40px;
}
.dseg .btn + .btn { border-left: 1px solid var(--line); }
.dseg .btn[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.tools { display: flex; gap: 8px; padding: 8px 16px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.modes { display: flex; gap: 8px; flex: 0 0 auto; }
.chip {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2);
  border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
#spotChip[aria-pressed="false"], #eventChip[aria-pressed="false"] { font-weight: 700; color: var(--ink); border-color: var(--ink-3); }
.chip .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip[hidden] { display: none; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip[aria-pressed="true"] .sw { outline: 2px solid var(--ground); }
.chip small { font-family: "Barlow Condensed", sans-serif; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.chip[aria-pressed="true"] small { color: var(--ground); opacity: .75; }
.search { border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; min-width: 120px; }
.bar .search { flex: 0 1 200px; min-height: 40px; }
.iconbtn { width: 44px; min-width: 44px; height: 44px; padding: 0; justify-content: center; font-size: 17px; line-height: 1; }
#searchBtn, #searchClose { display: none; }
#searchBtn[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

/* ---- スロット制のレイアウト: PC は 左=Spot / 中=地図 / 右=Event。スマホは地図 + シート1枚 ---- */
.main { position: relative; min-height: 0; min-width: 0; display: flex; align-items: stretch; }
.stage { position: relative; min-height: 0; min-width: 0; flex: 1 1 auto; touch-action: none; }
.col { display: none; }
.panel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--panel); overflow: hidden; }
.panel > * { min-width: 0; }
.pbody { overflow: auto; min-height: 0; }
.slot { min-height: 0; min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr); overflow: hidden; }
.plist .pbody { padding: 0 16px 16px; }
.pdet .pbody { padding: 4px 16px 16px; }
.phead { position: relative; display: grid; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.phead .hrow { display: flex; align-items: center; gap: 6px; min-width: 0; }
.phead .hrow[hidden] { display: none; }
.phead h2 { margin: 0; font-size: 15px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead h2 .sep { color: var(--ink-3); font-weight: 400; margin: 0 2px; }
.phead .badge { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 15px; color: var(--ink-3); letter-spacing: .02em; white-space: nowrap; }
.phead .status { font-family: "Barlow Condensed", sans-serif; font-weight: 600; }
#areaBtn { font-weight: 700; max-width: 45%; overflow: hidden; }
#areaBtn .ar { color: var(--ink-3); font-weight: 400; font-size: 16px; line-height: 1; }
.pclose .chev { flex: 0 0 auto; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.lfind {
  display: inline-flex; align-items: center; gap: 4px; min-width: 0;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 0 4px 0 9px;
}
.lfind .lfi { font-size: 12px; line-height: 1; color: var(--ink-3); }
.lfind-in { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 13px; min-width: 0; width: 100%; padding: 5px 0; }
.lfind-in::-webkit-search-cancel-button { display: none; }
.lfind-in:focus { outline: none; }
.lfind .lfx { border: 0; background: transparent; padding: 0; width: 26px; min-width: 26px; height: 26px; justify-content: center; color: var(--ink-2); font-size: 13px; }
.lfind .lfx[hidden] { display: none; }
#sfSum { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.pdet { background: var(--det-bg); }
.pdet > .phead { background: var(--det-head); border-bottom-color: transparent; }
.pdet > .phead h2, .pdet > .phead .badge, .pdet > .phead .status { color: var(--det-head-ink); }
.pdet .pbody { background: var(--det-bg); }
.pdet > .phead h2 { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pdet > .phead .pclose { width: 44px; min-width: 44px; height: 44px; padding: 0; justify-content: center; }
.pdet > .phead .pclose, .pdet > .phead .pback {
  background: color-mix(in srgb, var(--det-head-ink) 15%, transparent);
  color: var(--det-head-ink); border-color: color-mix(in srgb, var(--det-head-ink) 45%, transparent);
}
.sheet .pdet .phead::before { background: color-mix(in srgb, var(--det-head-ink) 55%, transparent); }
@media (min-width: 721px) {
  .col { display: grid; grid-template-rows: auto minmax(0, 1fr); flex: 0 1 420px; min-width: 0; background: var(--panel); overflow: hidden; }
  .col-spot { border-right: 1px solid var(--line); }
  .col-event { border-left: 1px solid var(--line); }
  .col.hasdet { grid-template-rows: auto minmax(0, 1fr) 40%; }
  .col.folded { flex: 0 0 48px; grid-template-rows: minmax(0, 1fr); }
  .stage { flex: 1 0 560px; min-width: 560px; }
  .slot.det { border-top: 1px solid var(--line); }
  .col:not(.hasdet) .slot.det, .col.folded .slot { display: none; }
  .colhead { display: flex; align-items: center; gap: 6px; padding: 5px 8px; min-height: 38px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .colhead .ctitle { font-weight: 700; font-size: 13px; white-space: nowrap; }
  .colhead .ccount { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 14px; color: var(--ink-3); }
  .col.folded .colhead { flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding: 8px 2px; border-bottom: none; height: 100%; }
  .col.folded .ctitle, .col.folded .ccount { writing-mode: vertical-rl; letter-spacing: .12em; }
  .colfold { width: 32px; min-width: 32px; height: 32px; padding: 0; justify-content: center; }
  .plist .phead .pclose { display: none; }
  .plist .phead .lfind { flex: 1 1 120px; min-width: 120px; }
  .bar .search { flex: 1 1 200px; max-width: 340px; }
  .sheet, .dhandle, #sfSumRow { display: none !important; }
  #spotChip, #eventChip, .fsheet { display: none; }
}
@media (max-width: 720px) {
  .phead { padding: 6px 12px; }
  .phead .pback { min-height: 44px; }
  .plist .phead .pclose { min-width: 44px; height: 44px; padding: 0 10px; gap: 5px; justify-content: center; font-size: 13px; font-weight: 700; }
  .plist .phead .lfind { position: absolute; left: 12px; right: 12px; bottom: 6px; display: flex; }
  .plist .phead { padding-bottom: 52px; }
  .plist .phead .lfind-in { font-size: 16px; min-height: 40px; }
  .plist .phead .lfind .lfx { width: 40px; min-width: 40px; height: 40px; font-size: 15px; }
  @media (max-width: 359px) {
    .plist .phead .pclose { width: 44px; padding: 0; }
    .plist .phead .pclose .ptxt { display: none; }
    .plist .phead .pclose .chev { width: 24px; height: 24px; }
  }
}
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; height: 52%; z-index: 4;
  background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow); transform: translateY(105%); transition: transform .22s ease;
  display: grid; grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
.sheet.full { height: 100%; border-radius: 0; }
.sheet.open { transform: translateY(0); }
.sheet:not(.open) { pointer-events: none; }
.sheet .panel { border-radius: 16px 16px 0 0; }
.sheet.full .panel { border-radius: 0; }
.sheet .phead { padding-top: 12px; }
.sheet .phead::before {
  content: ""; position: absolute; left: 50%; top: 5px; transform: translateX(-50%);
  width: 40px; height: 4px; border-radius: 2px; background: var(--line);
}
/* シートが全高のときは地図がまったく見えないので、地図の上に浮いているものは隠す。
   「← 全体図」もここに含める(z-index はシートより上なので、隠さないとシートの
   1 行目のチップに重なって押せなくなる。2026-09-18 に自動テストで発覚) */
.stage.sheetfull .legend, .stage.sheetfull .hud, .stage.sheetfull .backmap { visibility: hidden; }
#stash { display: none !important; }

/* ---- 地図 ---- */
svg.map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; background: var(--ground); }
#bgHit { fill: transparent; pointer-events: all; }
svg.map.dragging { cursor: grabbing; }
/* 下地(base.json の svg)。クラス名と約束は venue/README.md。
   .water は塗り(fill-rule="evenodd" は属性にあるので上書きしない)、.coast/.road/.rail は線。
   **.rail に stroke を書かない**(路線色は path の stroke 属性にある。ここで書くと全路線が同色になる)。
   描画順は base.json の中で water → coast → road → rail。 */
.base .water { fill: var(--water); stroke: none; }
.base .coast { fill: none; stroke: var(--coast); stroke-width: 1.6px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.base .road { fill: none; stroke: var(--road); stroke-width: 2.6px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
.base .rail { fill: none; stroke-width: 2.2px; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; opacity: .95; }
.stn-dot { fill: var(--panel); stroke: var(--station); stroke-width: 1.6px; vector-effect: non-scaling-stroke; pointer-events: none; }
.stn-name {
  font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 600; fill: var(--ink-2); text-anchor: middle; pointer-events: none;
  font-size: var(--fs-stn, 6px); paint-order: stroke; stroke: var(--ground); stroke-width: .3em; stroke-linejoin: round;
}
/* Area(エリア): 全体図では塊(破線の枠 + label + 件数)。押すとエリア地図 */
.ar-region { fill: var(--area-fill); stroke: var(--area-line); stroke-width: 1.6px; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; cursor: pointer; }
.ar-region.sel { stroke: var(--accent); stroke-width: 2.6px; stroke-dasharray: none; }
.ar-g { pointer-events: none; }
.ar-g text { text-anchor: middle; }
.ar-g .ar-band { fill: transparent; pointer-events: auto; cursor: pointer; }
.ar-g .nm { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; font-size: 14px; fill: var(--accent); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
.ar-g .n { font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 600; font-size: 12px; fill: var(--ink-2); paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round; }
/* 塊の label の横に出す「行きたい」(人ごとの色の点 + 件数)。エリア地図に入らなくても分かるように */
.ar-g .want-dot { stroke: var(--ground); stroke-width: 1.5px; }
.ar-g .want-n {
  font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 13px; fill: var(--ink); text-anchor: start;
  paint-order: stroke; stroke: var(--ground); stroke-width: 3px; stroke-linejoin: round;
}
.marker { cursor: pointer; }
.marker circle.core { stroke: var(--panel); stroke-width: 1.6px; vector-effect: non-scaling-stroke; }
.marker.dim { opacity: .28; }
.marker.sel circle.core { stroke: var(--ink); }
.marker text { font-family: "Barlow Condensed", sans-serif; font-weight: 700; fill: #fff; text-anchor: middle; pointer-events: none; }
/* Pin の中の数字だけが白。名前(.mk-name)は本文色にする(.marker text より詳細度を上げる) */
.marker text.mk-name { fill: var(--ink); }
.marker .want { stroke: var(--panel); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.mk-name {
  font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 700; fill: var(--ink); text-anchor: middle; pointer-events: none;
  font-size: var(--fs-mk, 6px); paint-order: stroke; stroke: var(--ground); stroke-width: .3em; stroke-linejoin: round;
}
.hl-ring { fill: none; stroke: var(--hl); stroke-width: 3px; vector-effect: non-scaling-stroke; pointer-events: none; }
#corner { display: none; }
#stage[data-corner] #corner { display: block; }
#stage[data-corner] #base, #stage[data-corner] #areaRegions, #stage[data-corner] #stations, #stage[data-corner] #markers { display: none; }
.backmap { position: absolute; left: 16px; top: 12px; z-index: 5; min-height: 44px; box-shadow: var(--shadow); font-weight: 700; }

    for (var k2 in (o.strings || {})) S[k2] = o.strings[k2];
    var people = o.people || [];
    var path = o.path || 'wants';
    function status(t, live) { if (o.onStatus) o.onStatus(t, !!live); }
    function errText(e) {
      var m = String((e && (e.code || e.message)) || e || '');
      return /permission[_ ]?denied/i.test(m) ? S.denied : S.error.replace('%s', m.slice(0, 80));
    }

    var r = readKey(o.hash != null ? o.hash : HASH0, o.storageKey, o.hashParam || 'r');
    var api = { key: r.key, live: !!(o.config && r.key && !r.bad), push: function () {} };
    if (!o.config) { status(S.noConfig, false); return api; }
    if (r.bad) { status(S.badKey, false); return api; }
    if (!r.key) { status(S.noKey, false); return api; }

    var writing = {}, pending = {}, pushFn = null;
    api.push = function (who, ids) { if (pushFn) pushFn(who, ids); else pending[who] = ids; };
    status(S.connecting, false);

    (async function boot() {
      var A, R;
      try {
        var mods = await Promise.all([import(FB_BASE + 'firebase-app.js'), import(FB_BASE + 'firebase-database.js')]);
        A = mods[0]; R = mods[1];
      } catch (e) { status(S.offline, false); return; }
      var rdb;
      try { rdb = R.getDatabase(A.initializeApp(o.config)); } catch (e) { status(errText(e), false); return; }
      var ref = function (who) { return R.ref(rdb, 'rooms/' + r.key + '/' + path + '/' + who); };
      pushFn = function (who, ids) {
        writing[who] = true;
        R.set(ref(who), { ids: JSON.stringify(ids || []), ts: Date.now() })
          .catch(function (e) { status(errText(e), false); })
          .finally(function () { writing[who] = false; });
      };
      var ok = false, pushedEmpty = {};
      people.forEach(function (who) {
        R.onValue(ref(who), function (snap) {
          if (!ok) { ok = true; status(S.connected, true); }
          var v = snap.val();
          if (!v) {  // 遠隔にまだ無い: 送るべき手元の内容があれば一度だけ送る
            if (!pushedEmpty[who]) {
              var mine = o.getLocal ? o.getLocal(who) : null;
              if (Array.isArray(mine) && mine.length) { pushedEmpty[who] = true; pushFn(who, mine); }
            }
            return;
          }
          if (writing[who]) return;  // 自分の書き込みの反響は無視
          var ids = [];
          try { ids = typeof v.ids === 'string' ? JSON.parse(v.ids) : v.ids; } catch (e) { ids = []; }
          if (o.onRemote) o.onRemote(who, Array.isArray(ids) ? ids : []);
        }, function (e) { status(errText(e), false); });
      });
      Object.keys(pending).forEach(function (who) { pushFn(who, pending[who]); });
      pending = {};
    })();

    return api;
  }

  window.SharedSync = { start: start, hash: HASH0, ROOM_RE: ROOM_RE, version: FB_VER };
})();

</script>
<script>
/* app.js — 大阪マップ本体。TGS(events/tgs2026/map.template.html)の JS を複製し、
   Exhibitor → Spot / Program → Event / Cluster → Area / ホール → 日付 に置き換えたもの(ADR 0002)。

   共通(そのまま流用): パン・ピンチ(panZoom)、スロット制の画面(layout / place / showList / showDetail)、
     シートの half・full、List の文字絞り込み、Want と同期、ヘッダー、CornerMap の出入り、履歴。
   固有(この下の「設定(CONFIG)と描画関数」に集めた): 下地 SVG の差し込み、Spot / Event の行と詳細、
     絞り込み項目(エリア・予算・予約・所要)、日付切替、名前の自由入力。

   データは data.js(build_map.py の生成物)が入れる window.OSAKA。
   Firebase の設定は Pages 版だけ window.OSAKA_FB に入る(Artifact 版は undefined = 共有コード方式)。 */
(() => {
  'use strict';
  const D = window.OSAKA;
  const FB = window.OSAKA_FB || null;
  const HASH = location.hash || '';               // #r=<部屋キー> / #w=<共有コード> / #a=<エリア>
  const $ = (id) => document.getElementById(id);

  // =====================================================================================
  //  設定(CONFIG)と描画関数 — ここがこのページの固有部分
  // =====================================================================================
  const CONFIG = {
    LS: 'osaka-2026-09-map-v1',        // 端末に覚える鍵(自分の名前・行きたい・見た名前)
    ROOM_LS: 'osaka-2026-09-room',     // 部屋キーを覚える鍵(sync.js の storageKey)
    HASH_PARAM: 'r',
    ROSTER: '__names',                 // 同期データの中で「名前の一覧」を置く場所(rooms/<key>/wants/__names)
    GENRES: ['食', '観光', '買い物', 'その他'],
    GENRE_COLOR: { '食': 'var(--g-food)', '観光': 'var(--g-sight)', '買い物': 'var(--g-shop)', 'その他': 'var(--g-etc)' },
    EVENT_COLOR: 'var(--ev)',
    MULTI_COLOR: 'var(--g-multi)',
    WANT_COLORS: ['var(--w0)', 'var(--w1)', 'var(--w2)', 'var(--w3)', 'var(--w4)', 'var(--w5)', 'var(--w6)', 'var(--w7)'],
    NAME_MAX: 10,
    MARKER_R: 9,          // 画面 px
    MARKER_SLACK: 10,     // 指で狙える余白(画面 px)
    K_MIN: 0.012, K_MAX: 6,
    NAME_K: 0.12,         // 全体図: これより寄ると Pin の名前を出す
    AREA_NAME_K: 0.15,    // エリア地図: これより寄ると Pin の名前を出す(既定のエリア表示で出る程度。重なる分は隠す)
    STN_K: 0.09,          // これより寄ると全体図でも主要駅の名前を出す
  };

  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const short = (t, n = 14) => { t = String(t == null ? '' : t); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const wlen = (s) => [...String(s)].reduce((a, ch) => a + (/[\x20-\x7E]/.test(ch) ? 1 : 1.72), 0);
  const nrm = (s) => String(s == null ? '' : s).normalize('NFKC').toLowerCase();
  const MD = (d) => { const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${+m[1]}/${+m[2]}` : String(d || ''); };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const wdayOf = (d) => { const [y, m, dd] = String(d).split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); };
  // 9/20 は日曜、9/21 は敬老の日、9/22 は国民の休日。3 日とも「土日祝」側の営業になる
  const HOLIDAY_NOTE = '9/20(日)・9/21(敬老の日)・9/22(国民の休日)はいずれも土日祝の扱い';

  /** 最寄駅。data.js は「駅」を落とした形で持つので、出すときに足す */
  const stationOf = (s) => (s ? s + '駅' : '');

  /** Source は必ずリンクで出す。長い URL をそのまま見せず「x.com の投稿」「◯◯ の公式」にする
      (リンク先は URL のまま。「SAMPLE」などの語はそのまま見せる) */
  function srcHtml(src) {
    return String(src || '').split(/\s+/).filter(Boolean).map((tok) => {
      if (!/^https?:\/\//.test(tok)) return `<span class="sum"><span class="mk">${esc(tok)}</span></span>`;
      let host = '';
      try { host = new URL(tok).hostname.replace(/^www\./, ''); } catch (e) { host = tok.replace(/^https?:\/\//, '').split('/')[0]; }
      const label = /^(x|twitter)\.com$/.test(host) ? 'X の投稿' : `${host} の公式`;
      return `<a class="lnk" href="${esc(tok)}" target="_blank" rel="noopener" title="${esc(tok)}">${esc(label)}</a>`;
    }).join(' ');
  }

  /** その Spot が指定の日に開いているか。判定は spots.csv の「定休日」欄に **その日の日付** が
      名指しされているかだけで行う(2026-09-18 の取り決め)。曜日では判定しない:
      9/20 は日曜、9/21 は敬老の日、9/22 は国民の休日で 3 日とも「土日祝」側の営業になり、
      月曜定休の施設は 9/21 に開いて 9/22 が振替休になることが多いため。
        「月休(9/21 は祝日のため営業・9/22 振替休)」 → 9/20 ○ / 9/21 ○ / 9/22 ×
        「水休」「不定休」「無休」                     → 日付が無いので 3 日とも営業扱い
      「営業・開館」が先。同じ日付に両方書かれることは無い前提。 */
  function spotOpenOn(sp, day) {
    if (day === 'all') return true;
    const raw = String(sp.closed || '');
    if (!raw) return true;
    const md = MD(day).replace('/', '\\/');
    // 「振替で9/22(火)休園」「9/21(月・祝)休み」のように括弧が挟まるので、括弧では止めない
    if (new RegExp(md + '[^、。]{0,16}(開館|開園|開店|営業|開催)').test(raw)) return true;
    if (new RegExp(md + '[^、。]{0,16}(休|閉館|閉園)').test(raw)) return false;
    return true;
  }

  const genreColor = (g) => CONFIG.GENRE_COLOR[g] || CONFIG.GENRE_COLOR['その他'];
  const areaLabel = (key) => (D.base.areas[key] && D.base.areas[key].label) || 'その他';

  /** Spot の List の 1 行 */
  function renderSpotRow(sp) {
    const marks = whoList().map((w) => `<span class="${wantSet(w).has(sp.id) ? 'on' : ''}" style="--c:${whoColor(w)}"></span>`).join('');
    const meta = [stationOf(sp.station), sp.budget, sp.dur].filter(Boolean).join(' · ');
    return `<div class="erow${hlRow === sp.id ? ' hl' : ''}" data-spot="${esc(sp.id)}">`
      + `<div class="b"><span class="tag" style="--c:${genreColor(sp.genre)}">${esc(sp.genre)}</span></div>`
      + `<div><div class="t">${esc(sp.name)}</div><div class="c">${esc(areaLabel(sp.area))}</div>`
      + `<div class="g">${esc(meta)}</div>${sp.s ? `<div class="pl">${esc(short(sp.s, 34))}</div>` : ''}</div>`
      + `<div class="marks">${marks}</div></div>`;
  }

  /** Spot の Detail(仕様 4 節: 名前・エリア・最寄駅・営業時間・定休日・予約・予算・所要・※要約・公式の説明・Source・行きたい) */
  function renderSpotDetail(sp) {
    const L = [wantTop(sp.id)];
    L.push(`<div class="meta"><span class="sz">${esc(sp.genre)}</span><span>${esc(areaLabel(sp.area))}</span>${sp.station ? `<span>${esc(stationOf(sp.station))}</span>` : ''}</div>`);
    const closedDays = D.meta.days.filter((d) => !spotOpenOn(sp, d));
    const dl = [];
    dl.push(['営業時間', esc(sp.hours || '(未取得)') + `<div class="note">${HOLIDAY_NOTE}</div>`]);
    dl.push(['定休日', esc(sp.closed || '(未取得)') + (closedDays.length ? `<div class="note">${closedDays.map(MD).join('・')} は休み</div>` : '')]);
    dl.push(['予約', esc(sp.resv || '(未取得)')]);
    dl.push(['予算', esc(sp.budget || '(未取得)')]);
    dl.push(['所要', esc(sp.dur || '(未取得)')]);
    L.push(`<dl class="dl">${dl.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`);
    if (sp.s) L.push(`<div class="sum"><span class="mk">※要約</span>${esc(sp.s)}</div>`);
    if (sp.d) L.push(`<details><summary>公式の説明</summary><div class="full">${esc(sp.d)}</div></details>`);
    if (sp.memo) L.push(`<div class="full">${esc(sp.memo)}</div>`);
    const evs = D.events.filter((e) => e.spot === sp.name);
    if (evs.length) L.push(`<div><button type="button" class="btn small" data-eventsof="${esc(sp.name)}">この場所のイベント (${evs.length}) ›</button></div>`);
    L.push(`<div>${srcHtml(sp.src)}${sp.at ? `<div class="status">取得 ${esc(sp.at)}</div>` : ''}</div>`);
    L.push(`<div class="wantrow">${wantsRow(sp.id, true)}</div>`);
    return `<div class="exs">${L.join('')}</div>`;
  }

  /** Event の List の 1 行(日付タブ + 時刻順) */
  function renderEventRow(ev) {
    const marks = whoList().map((w) => `<span class="${wantSet(w).has(ev.id) ? 'on' : ''}" style="--c:${whoColor(w)}"></span>`).join('');
    return `<div class="row-item" data-event="${esc(ev.id)}"><div class="time">${esc(ev.start || '—')}<small>${ev.end ? '〜' + esc(ev.end) : (ev.start ? '' : '時刻未定')}</small></div>`
      + `<div><div class="t">${esc(ev.name)}</div><div class="s">${esc(ev.vs || ev.venue)}</div></div>`
      + `<div class="marks">${marks}</div></div>`;
  }

  /** Event の Detail(仕様 4 節: 日時・会場・内容・出演・予約・予算・Source・行きたい) */
  function renderEventDetail(ev) {
    const L = [wantTop(ev.id)];
    const when = ev.start ? ` ${esc(ev.start)}${ev.end ? '〜' + esc(ev.end) : ''}` : ` 時刻${esc(ev.note || '未定')}`;
    L.push(`<div class="meta"><span class="sz">${esc(MD(ev.date))}(${WD[wdayOf(ev.date)]})${when}</span><span>${esc(areaLabel(ev.area))}</span></div>`);
    const dl = [['会場', esc(ev.venue || '(未取得)')], ['内容・出演', esc(ev.desc || '(未取得)')], ['予約', esc(ev.resv || '(未取得)')], ['予算', esc(ev.budget || '(未取得)')]];
    L.push(`<dl class="dl">${dl.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`);
    if (ev.spot) L.push(`<div><button type="button" class="btn small" data-gospot="${esc(ev.spot)}">会場の Spot を見る ›</button></div>`);
    L.push(`<div>${srcHtml(ev.src)}${ev.at ? `<div class="status">取得 ${esc(ev.at)}</div>` : ''}</div>`);
    L.push(`<div class="wantrow">${wantsRow(ev.id, true)}</div>`);
    return `<div class="exs">${L.join('')}</div>`;
  }

  /** 下地(base.json の svg)を差し込む。全体図 = overall、エリア地図 = areas[key] */
  function renderBase(target, src, stationsTarget, stations, all) {
    target.innerHTML = src || '';
    stationsTarget.innerHTML = (stations || []).filter((s) => all || s.major)
      .map((s) => `<g class="stn"><circle class="stn-dot" cx="${s.x}" cy="${s.y}" r="3"/><text class="stn-name" x="${s.x}" y="${s.y}" dy="-1.1em">${esc(s.name)}</text></g>`).join('');
  }

  // =====================================================================================
  //  ここから下は TGS と同じ作り(共通部分)
  // =====================================================================================
  const svg = $('map'), view = $('view');
  $('sub').textContent = `9/20〜22 · 下地 ${D.base.fetched} · 表の版 ${D.meta.snapshot}`;
  $('legendAttr').textContent = D.base.attribution || '';

  // ---------- URL のハッシュ ----------
  const hashParts = (h) => String(h || '').replace(/^#/, '').split('&').filter(Boolean);
  const hashUrl = (parts) => location.pathname + location.search + (parts.length ? '#' + parts.join('&') : '');
  if (/[#&][rw]=/.test(HASH)) {
    try { history.replaceState(null, '', hashUrl(hashParts(HASH).filter((p) => !/^[rw]=/.test(p)))); } catch (e) {}
  }

  // ---------- state ----------
  let state = { me: null, wants: {}, roster: [] };
  try {
    const s = JSON.parse(localStorage.getItem(CONFIG.LS) || 'null');
    if (s && typeof s === 'object') state = { me: s.me || null, wants: s.wants || {}, roster: Array.isArray(s.roster) ? s.roster : [] };
  } catch (e) {}
  const wantSet = (who) => new Set(state.wants[who] || []);
  function saveLocal() { try { localStorage.setItem(CONFIG.LS, JSON.stringify(state)); } catch (e) {} }
  /** 画面に出す名前(自分 + 同期で現れた名前)。印を持たない人も凡例には出す */
  function whoList() {
    const out = [];
    if (state.me) out.push(state.me);
    state.roster.forEach((n) => { if (n && n !== state.me && !out.includes(n)) out.push(n); });
    Object.keys(state.wants).forEach((n) => { if (n && !out.includes(n)) out.push(n); });
    return out;
  }
  function hashIdx(s, n) {
    let h = 0;
    for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return h % n;
  }
  const whoColor = (name) => CONFIG.WANT_COLORS[hashIdx(name, CONFIG.WANT_COLORS.length)];
  const wantedBy = (id) => whoList().filter((w) => wantSet(w).has(id));

  // ---------- filters ----------
  const filt = { genres: new Set(CONFIG.GENRES), wantOnly: false, day: 'all', q: '', qn: '' };
  const LQ = { spot: '', event: '' }, LQN = { spot: '', event: '' };
  const spotQ = (sp) => sp.__q != null ? sp.__q : (sp.__q = nrm([sp.name, sp.station, sp.area, areaLabel(sp.area), sp.memo, sp.s].join(' ')));
  const eventQ = (ev) => ev.__q != null ? ev.__q : (ev.__q = nrm([ev.name, ev.venue, ev.desc].join(' ')));

  // Spot の絞り込みシート(エリア・予算・予約要否・所要時間)
  const NONE = '__none__';
  const sf = { area: new Set(), budget: new Set(), resv: new Set(), dur: new Set() };
  // 予算は build_map.py が 6 段階の帯にした派生値(sp.bk)を使う。生の文言は Detail に出す
  const BUDGETS = ['無料', '〜1,000円', '〜3,000円', '〜5,000円', '5,000円〜'];
  const budgetKey = (sp) => (sp.bk && sp.bk !== '記載なし' ? sp.bk : NONE);
  const resvKey = (sp) => {
    const r = (sp.resv || '').trim();
    if (!r) return NONE;
    if (/^(不要|なし|不用)/.test(r)) return '不要';
    if (/(要予約|要事前|必須|要申込|事前申込)/.test(r)) return '要予約';
    if (/(推奨|望ましい)/.test(r)) return '推奨';
    if (/(当日|整理券)/.test(r)) return '当日券';
    return '予約可';
  };
  // 所要は「30分」「1時間※目安」「2時間」「半日」の書き方が混ざる。時間・半日を先に見てから分に直す
  const DURS = ['〜30分', '1時間', '2時間', '半日'];
  const durKey = (sp) => {
    const t = (sp.dur || '').trim();
    if (!t) return NONE;
    if (/半日|終日/.test(t)) return '半日';
    const h = /(\d+(?:\.\d+)?)\s*時間/.exec(t);
    const min = h ? +h[1] * 60 : (/(\d+)\s*分/.exec(t) ? +(/(\d+)\s*分/.exec(t))[1] : null);
    if (min == null) return NONE;
    return min <= 30 ? '〜30分' : min <= 60 ? '1時間' : min <= 120 ? '2時間' : '半日';
  };
  const okOne = (set, v) => set.has(v);

  function spotMatch(sp) {
    if (!filt.genres.has(sp.genre)) return false;
    if (filt.wantOnly && !wantedBy(sp.id).length) return false;
    if (!spotOpenOn(sp, filt.day)) return false;
    if (sf.area.size && !okOne(sf.area, sp.area)) return false;
    if (sf.budget.size && !okOne(sf.budget, budgetKey(sp))) return false;
    if (sf.resv.size && !okOne(sf.resv, resvKey(sp))) return false;
    if (sf.dur.size && !okOne(sf.dur, durKey(sp))) return false;
    if (filt.qn && !spotQ(sp).includes(filt.qn)) return false;
    if (LQN.spot && !spotQ(sp).includes(LQN.spot)) return false;
    return true;
  }
  function eventMatch(ev) {
    if (filt.wantOnly && !wantedBy(ev.id).length) return false;
    if (filt.day !== 'all' && ev.date !== filt.day) return false;
    if (filt.qn && !eventQ(ev).includes(filt.qn)) return false;
    if (LQN.event && !eventQ(ev).includes(LQN.event)) return false;
    return true;
  }

  // ---------- geometry ----------
  const [MW, MH] = D.base.size;
  // 「全体」は 5 つの塊 + すべての Pin の外接矩形 + 余白 8%(下地の矩形いっぱいには引かない。
  // 下地の南北は候補地のずっと外まであるので、そこに合わせると地図が小さくなりすぎる)
  const bbox = (() => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const add = (ax0, ay0, ax1, ay1) => { x0 = Math.min(x0, ax0); y0 = Math.min(y0, ay0); x1 = Math.max(x1, ax1); y1 = Math.max(y1, ay1); };
    (D.meta.areaOrder || []).forEach((k) => { const a = D.base.areas[k]; if (a && a.box) add(a.box[0], a.box[1], a.box[2], a.box[3]); });
    D.spots.concat(D.events).forEach((v) => { if (v.x != null) add(v.x, v.y, v.x, v.y); });
    if (x0 > x1) { x0 = 0; y0 = 0; x1 = MW; y1 = MH; }
    const px = (x1 - x0) * 0.08, py = (y1 - y0) * 0.08;
    return { x0: x0 - px, y0: y0 - py, x1: x1 + px, y1: y1 + py };
  })();
  const AREA_KEYS = D.meta.areaOrder.slice();
  const AREA = D.base.areas;
  const SPOT_BY_ID = Object.fromEntries(D.spots.map((s) => [s.id, s]));
  const EVENT_BY_ID = Object.fromEntries(D.events.map((e) => [e.id, e]));
  const ITEM = (id) => SPOT_BY_ID[id] || EVENT_BY_ID[id] || null;
  const inArea = (it) => AREA_KEYS.includes(it.area);

  renderBase($('base'), D.base.overall.svg, $('stations'), D.base.overall.stations, false);

  // Area(全体図では塊。押すとエリア地図)
  const areaRegionsG = $('areaRegions');
  const arItems = [];
  areaRegionsG.innerHTML = AREA_KEYS.map((key) => {
    const [x0, y0, x1, y1] = AREA[key].box;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    return `<rect class="ar-region" data-area="${key}" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/>`
      + `<g class="ar-g" data-area="${key}" transform="translate(${cx} ${cy})">`
      + `<rect class="ar-band" data-area="${key}" x="-46" y="-22" width="92" height="44"/>`
      + `<g class="ar-tx"><text class="nm" y="-4">${esc(AREA[key].label)}</text>`
      + `<g class="ar-l2"><text class="n" y="15"></text><g class="ar-want" data-area="${key}"></g></g></g></g>`;
  }).join('');
  AREA_KEYS.forEach((key) => {
    const [x0, y0, x1, y1] = AREA[key].box;
    arItems.push({
      key, el: areaRegionsG.querySelector(`.ar-g[data-area="${key}"]`),
      reg: areaRegionsG.querySelector(`.ar-region[data-area="${key}"]`),
      band: areaRegionsG.querySelector(`.ar-band[data-area="${key}"]`),
      tx: areaRegionsG.querySelector(`.ar-g[data-area="${key}"] .ar-tx`),
      l2: areaRegionsG.querySelector(`.ar-g[data-area="${key}"] .ar-l2`),
      nEl: areaRegionsG.querySelector(`.ar-g[data-area="${key}"] .n`),
      want: areaRegionsG.querySelector(`.ar-want[data-area="${key}"]`),
      x: (x0 + x1) / 2, y: (y0 + y1) / 2, bb: [x0, y0, x1, y1],
    });
  });
  function areaCount(key) {
    return D.spots.filter((s) => s.area === key && spotMatch(s)).length + D.events.filter((e) => e.area === key && eventMatch(e)).length;
  }
  /** 全体図の塊にも「行きたい」を出す(エリア地図に入らないと分からない、を避ける)。
      label の横に 人ごとの色の点 + そのエリアで誰かが行きたいと言った Spot の件数。 */
  function areaWants(key) {
    const spots = D.spots.filter((s) => s.area === key);
    const who = whoList().filter((w) => spots.some((s) => wantSet(w).has(s.id)));
    const n = spots.filter((s) => wantedBy(s.id).length).length;
    return { who, n };
  }
  /** 塊の 2 行目(件数 + 行きたいの点)を作り、label の箱(帯)の大きさを測り直す。
      「タップで中身」は凡例に 1 行だけ置く(地図の上では場所を食うだけなので出さない)。
      点は件数のすぐ隣に置き、箱の中に収める(隣のエリアに浮かない)。 */
  function syncAreaLabels() {
    const R = 4, GAP = 11;
    arItems.forEach((it) => {
      it.nEl.textContent = `${areaCount(it.key)}件`;
      const { who, n } = areaWants(it.key);
      it.want.innerHTML = !n ? ''
        : who.map((w, i) => `<circle class="want-dot" cx="${i * GAP}" cy="11" r="${R}" fill="${whoColor(w)}"><title>${esc(w)}</title></circle>`).join('')
          + `<text class="want-n" x="${who.length * GAP}" y="15">${n}</text>`;
      // 2 行目を「件数 → 点 → 件数」の順に並べ、全体を中央そろえにする
      let w2 = 0;
      try { w2 = it.nEl.getBBox().width; } catch (e) { w2 = 26; }
      it.want.setAttribute('transform', `translate(${w2 / 2 + 8} 0)`);
      try {
        const bb = it.l2.getBBox();
        it.l2.setAttribute('transform', `translate(${-(bb.x + bb.width / 2)} 0)`);
      } catch (e) {}
      measureBand(it);
    });
  }
  /** 帯(= 確実に押せる当たり判定)を文字の実寸に合わせる。画面上 92×44px を下限にする */
  function measureBand(it) {
    let bb = null;
    try { bb = it.tx.getBBox(); } catch (e) { bb = null; }
    if (!bb || !bb.width) { if (it.bw == null) { it.bw = BAND_MIN_W / 2; it.by0 = -BAND_MIN_H / 2; it.by1 = BAND_MIN_H / 2; } return; }
    it.bw = Math.max(bb.width / 2 + 8, BAND_MIN_W / 2);
    it.by0 = bb.y - 5; it.by1 = bb.y + bb.height + 5;
    if (it.by1 - it.by0 < BAND_MIN_H) { const m = (it.by0 + it.by1) / 2; it.by0 = m - BAND_MIN_H / 2; it.by1 = m + BAND_MIN_H / 2; }
    it.band.setAttribute('x', -it.bw); it.band.setAttribute('y', it.by0);
    it.band.setAttribute('width', it.bw * 2); it.band.setAttribute('height', it.by1 - it.by0);
  }

  // ---------- pan / zoom(TGS と同じ) ----------
  function panZoom(svgEl, viewEl, o) {
    const st = { k: 1, tx: 0, ty: 0, touched: false };
    function apply() { viewEl.setAttribute('transform', `matrix(${st.k} 0 0 ${st.k} ${st.tx} ${st.ty})`); if (o.onApply) o.onApply(st); }
    function fit(bb, pad = 24, viewH) {
      const W = svgEl.clientWidth, H = viewH || svgEl.clientHeight;
      const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0;
      st.k = Math.min((W - pad * 2) / w, (H - pad * 2) / h);
      st.tx = (W - w * st.k) / 2 - bb.x0 * st.k; st.ty = (H - h * st.k) / 2 - bb.y0 * st.k; apply();
    }
    function zoomAt(px, py, f) { const nk = Math.max(o.min, Math.min(o.max, st.k * f)); f = nk / st.k; st.tx = px - f * (px - st.tx); st.ty = py - f * (py - st.ty); st.k = nk; apply(); }
    function centerOn(x, y, zoom, dy = 0) { const W = svgEl.clientWidth, H = svgEl.clientHeight; if (zoom) st.k = zoom; st.tx = W / 2 - x * st.k; st.ty = H / 2 - y * st.k - dy; apply(); }
    const TAP_PX = 10;
    const ptrs = new Map();
    let lastMid = null, lastDist = null, moved = false, pressed = null, pressPt = null, slackX = 0, slackY = 0;
    svgEl.addEventListener('pointerdown', (e) => {
      st.touched = true; pressed = e.target.closest ? e.target.closest(o.tapSel) : null;
      const r = svgEl.getBoundingClientRect(); pressPt = [e.clientX - r.left, e.clientY - r.top];
      try { svgEl.setPointerCapture(e.pointerId); } catch (err) {}
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      moved = false; lastMid = [e.clientX, e.clientY]; lastDist = null; slackX = slackY = 0;
      svgEl.classList.add('dragging');
    });
    svgEl.addEventListener('pointermove', (e) => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, [e.clientX, e.clientY]);
      const p = [...ptrs.values()];
      if (p.length === 1) {
        const [x, y] = p[0];
        if (lastMid) {
          let dx = x - lastMid[0], dy = y - lastMid[1];
          lastMid = [x, y];
          if (!moved) {
            slackX += dx; slackY += dy;
            if (Math.hypot(slackX, slackY) <= TAP_PX) return;
            moved = true; dx = slackX; dy = slackY;
          }
          st.tx += dx; st.ty += dy; apply();
        } else lastMid = [x, y];
      } else if (p.length >= 2) {
        const mid = [(p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2];
        const dist = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]);
        if (lastMid && lastDist) { st.tx += mid[0] - lastMid[0]; st.ty += mid[1] - lastMid[1]; zoomAt(mid[0], mid[1], dist / lastDist); moved = true; }
        lastMid = mid; lastDist = dist;
      }
    });
    const up = (e) => {
      const single = ptrs.size === 1;
      ptrs.delete(e.pointerId); lastMid = null; lastDist = null;
      if (!ptrs.size) svgEl.classList.remove('dragging');
      if (e.type === 'pointerup' && single && !moved && pressed) o.onTap(pressed, pressPt);
      pressed = null;
    };
    svgEl.addEventListener('pointerup', up); svgEl.addEventListener('pointercancel', up);
    svgEl.addEventListener('wheel', (e) => { st.touched = true; e.preventDefault(); const r = svgEl.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
    svgEl.addEventListener('dblclick', (e) => { const r = svgEl.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, 1.8); });
    return { st, apply, fit, zoomAt, centerOn };
  }

  const hitBox = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
  const BAND_MIN_W = 92, BAND_MIN_H = 44;

  const M = panZoom(svg, view, {
    min: CONFIG.K_MIN, max: CONFIG.K_MAX,
    tapSel: '.ar-band, .marker, .ar-region, #bgHit',
    onApply(st) {
      const k = st.k, W = svg.clientWidth, H = svg.clientHeight;
      const fs = (px, lo, hi) => Math.max(lo, Math.min(hi, px / k));
      svg.style.setProperty('--fs-stn', fs(12, 6, 4000) + 'px');
      svg.style.setProperty('--fs-mk', fs(12, 6, 4000) + 'px');
      if (corner) { layoutStationNames(cornerStnItems, 12 * 1, k, st.tx, st.ty, W, H, []); renderMarkers(); renderHl(); return; }
      // エリアの塊(枠 + label)。文字は画面上で一定の大きさ(親の scale(1/k))。
      // label は枠の外(上か下)に逃がし、他の label や Pin と重なるときは反対側・中央の順に試す。
      const boxes = [];
      const mpts = [];
      groups.forEach((g) => {
        const sx = g.x * k + st.tx, sy = g.y * k + st.ty;
        if (sx > -40 && sx < W + 40 && sy > -40 && sy < H + 40) mpts.push([sx - 14, sy - 14, sx + 14, sy + 14]);
      });
      arItems.forEach((it) => {
        if (it.bw == null) measureBand(it);
        const sx = it.x * k + st.tx, sy = it.y * k + st.ty;                    // 枠の中心(画面)
        const top = it.bb[1] * k + st.ty, bot = it.bb[3] * k + st.ty;          // 枠の上辺・下辺(画面)
        const h = it.by1 - it.by0;
        // 置き場所の候補(枠の中心からのずらし、画面 px)。枠の外・上 → 外・下 → 中央 の順に、
        // 横にも 3 通り振って、他の label・Pin と重ならない所を探す
        const dys = [
          top - 6 - it.by1 - sy,    // 枠の上辺のすぐ外
          bot + 6 - it.by0 - sy,    // 枠の下辺のすぐ外
          0,                        // 枠の中央
          -h - 8, h + 8,
        ];
        const dxs = [0, -(it.bw + 8), it.bw + 8];
        const cands = [];
        dys.forEach((dy) => dxs.forEach((dx) => cands.push([dx, dy])));
        const boxAt = (c) => [sx + c[0] - it.bw, sy + c[1] + it.by0, sx + c[0] + it.bw, sy + c[1] + it.by1];
        const onScr = (b) => b[2] > 0 && b[0] < W && b[1] > 0 && b[3] < H;
        const free = (b) => !boxes.some((o) => hitBox(b, o)) && !mpts.some((o) => hitBox(b, o));
        let use = cands.find((c) => { const b = boxAt(c); return onScr(b) && free(b); })
          || cands.find((c) => free(boxAt(c)))
          || cands.find((c) => onScr(boxAt(c))) || [0, 0];
        it.el.setAttribute('transform', `translate(${it.x + use[0] / k} ${it.y + use[1] / k}) scale(${1 / k})`);
        it.bandBox = boxAt(use);
        boxes.push(it.bandBox);
      });
      layoutStationNames(stnItems, 12, k, st.tx, st.ty, W, H, boxes);
      renderMarkers(); renderHl();
    },
    onTap(el, pt) {
      if (corner) { const mk = markerOnPoint(pt); if (mk) openMarker(mk, true); return; }
      const band = bandAt(pt);
      if (band) { enterArea(band); return; }
      const ar = areaAt(pt);
      if (ar) { const mk = markerOnPoint(pt, true); if (mk) { openMarker(mk, true); return; } enterArea(ar); return; }
      const mk = markerOnPoint(pt);
      if (mk) { openMarker(mk, true); return; }
      if (el.dataset && el.dataset.area) enterArea(el.dataset.area);
    },
  });
  const kOf = () => M.st.k;

  // ---------- 駅名(重なったら消す。画面上の大きさは一定) ----------
  function mkStnItems(g) {
    return [...g.querySelectorAll('.stn')].map((el) => {
      const t = el.querySelector('.stn-name'), c = el.querySelector('.stn-dot');
      return { el: t, x: +c.getAttribute('cx'), y: +c.getAttribute('cy'), len: wlen(t.textContent), dy: -1.1 };
    });
  }
  let stnItems = mkStnItems($('stations')), cornerStnItems = [];
  function layoutStationNames(items, fsPx, k, tx, ty, W, H, boxes) {
    const on = corner ? true : k > CONFIG.STN_K;
    for (const it of items) {
      let hide = !on;
      if (on) {
        const sx = it.x * k + tx, sy = it.y * k + ty + it.dy * fsPx;
        const w = it.len * fsPx * .58 + 6, h = fsPx * 1.3 + 4;
        const b = [sx - w / 2, sy - h / 2, sx + w / 2, sy + h / 2];
        if (b[2] < -40 || b[0] > W + 40 || b[3] < -20 || b[1] > H + 20) hide = true;
        else if (boxes.some((o) => hitBox(b, o))) hide = true;
        else boxes.push(b);
      }
      if (it.hid !== hide) { it.hid = hide; it.el.style.display = hide ? 'none' : ''; }
    }
  }

  // ---------- マーカー(Spot / Event) ----------
  /** 全体図: エリアに属さない Spot / Event だけ。エリア地図: そのエリアの全部。 */
  function visibleItems() {
    const sp = D.spots.filter((s) => (corner ? s.area === corner : !inArea(s)));
    const ev = D.events.filter((e) => (corner ? e.area === corner : !inArea(e)));
    return { sp, ev };
  }
  const groups = new Map();   // key -> {x,y,kind,items,_sx,_sy}
  function buildGroups() {
    groups.clear();
    const { sp, ev } = visibleItems();
    const put = (kind, it) => {
      if (it.x == null) return;
      const key = `${kind}:${it.x},${it.y}`;
      if (!groups.has(key)) groups.set(key, { key, kind, x: it.x, y: it.y, items: [] });
      groups.get(key).items.push(it);
    };
    sp.forEach((s) => put('s', s));
    ev.forEach((e) => put('e', e));
    // 同じ点に Spot と Event が両方あるときは、Event を 1 段上に積む(画面 px のずらし)
    groups.forEach((g) => { g.stack = g.kind === 'e' && groups.has(`s:${g.x},${g.y}`) ? 1 : 0; });
  }
  const markersG = $('markers'), cornerMarkersG = $('cornerMarkers');
  let selected = null;
  function groupVisible(g) {
    return g.items.filter((it) => (g.kind === 's' ? spotMatch(it) : eventMatch(it)));
  }
  function groupColor(g, items) {
    if (g.kind === 'e') return CONFIG.EVENT_COLOR;
    const gs = new Set(items.map((it) => it.genre));
    return gs.size >= 2 ? CONFIG.MULTI_COLOR : genreColor([...gs][0]);
  }
  /** Pin の名前。まとまっている Pin は「◯◯ ほか4件」(数字だけでは何がまとまっているか分からない) */
  const pinName = (items) => short(items[0].name, 12) + (items.length > 1 ? ` ほか${items.length - 1}件` : '');
  function renderMarkers() {
    const k = kOf(), s = 1 / k, R = CONFIG.MARKER_R;
    // 名前は寄ったときだけ出す(引いていると全部重なって塊になる)。
    // 出すときも、先に置いた名前と重なるものは隠す。選んでいる Pin と「行きたい」は常に出す。
    const showName = k > (corner ? CONFIG.AREA_NAME_K : CONFIG.NAME_K);
    const fsPx = 12, W = svg.clientWidth, H = svg.clientHeight;
    const nameBoxes = [];
    let out = '';
    const rows = [...groups.values()].sort((a, b) => a.y - b.y || a.stack - b.stack);
    // 名前を置く順番: 選択中 → 行きたい → 上から。置けるものだけ置く
    const prio = (g) => (selected === g.key ? 0 : g.items.some((it) => wantedBy(it.id).length) ? 1 : 2);
    const order = rows.slice().sort((a, b) => prio(a) - prio(b) || a.y - b.y);
    const nameOf = new Map();
    order.forEach((g) => {
      const items = (groupVisible(g).length ? groupVisible(g) : g.items);
      const must = prio(g) < 2;
      if (!showName && !must) return;
      const t = pinName(items);
      const oy = -(g.stack * (2 * R + 4));
      const sx = g.x * k + M.st.tx, sy = g.y * k + M.st.ty + oy - (R + 6) - fsPx * 0.4;
      const w = wlen(t) * fsPx * 0.58 + 6, h = fsPx * 1.3;
      const b = [sx - w / 2, sy - h / 2, sx + w / 2, sy + h / 2];
      if (b[2] < 0 || b[0] > W || b[3] < 0 || b[1] > H) return;
      if (!must && nameBoxes.some((o) => hitBox(b, o))) return;
      nameBoxes.push(b);
      nameOf.set(g.key, t);
    });
    rows.forEach((g) => {
      const vis = groupVisible(g);
      const items = vis.length ? vis : g.items;
      const dim = !vis.length;
      const oy = -(g.stack * (2 * R + 4)) * s;
      g._sx = g.x * k + M.st.tx; g._sy = g.y * k + M.st.ty + oy * k;
      g._on = !dim;
      const cx = g.x, cy = g.y + oy;
      const r = R * s;
      let ring = '';
      const who = [...new Set(items.flatMap((it) => wantedBy(it.id)))];
      who.forEach((w, i) => { ring += `<circle class="want" cx="${cx}" cy="${cy}" r="${r + (4 + i * 4) * s}" fill="none" stroke="${whoColor(w)}" stroke-width="${3.2 * s}"/>`; });
      const nm = nameOf.get(g.key);
      const label = nm ? `<text class="mk-name" x="${cx}" y="${cy}" dy="${-(R + 6) * s}">${esc(nm)}</text>` : '';
      out += `<g class="marker${dim ? ' dim' : ''}${selected === g.key ? ' sel' : ''}" data-key="${esc(g.key)}">`
        + `<circle class="tapz" cx="${cx}" cy="${cy}" r="${22 * s}" fill="transparent"/>${ring}`
        + `<circle class="core" cx="${cx}" cy="${cy}" r="${r}" fill="${groupColor(g, items)}"/>`
        + `<text x="${cx}" y="${cy + r * 0.36}" font-size="${r * 1.05}">${items.length}</text>${label}</g>`;
    });
    (corner ? cornerMarkersG : markersG).innerHTML = out;
    (corner ? markersG : cornerMarkersG).innerHTML = '';
  }
  function markerOnPoint(pt, strict) {
    if (!pt) return null;
    const slack = strict ? 0 : CONFIG.MARKER_SLACK;
    let best = null, bd = Infinity;
    groups.forEach((g) => {
      if (g._sx == null) return;
      const d = Math.hypot(g._sx - pt[0], g._sy - pt[1]);
      if (d <= CONFIG.MARKER_R + slack && d < bd) { bd = d; best = g.key; }
    });
    return best;
  }
  function areaAt(pt) {
    if (!pt) return null;
    const k = M.st.k, x = (pt[0] - M.st.tx) / k, y = (pt[1] - M.st.ty) / k;
    const hit = arItems.find((it) => x >= it.bb[0] && x <= it.bb[2] && y >= it.bb[1] && y <= it.bb[3]);
    return hit ? hit.key : null;
  }
  function bandAt(pt) {
    if (!pt) return null;
    for (const it of arItems) {
      const b = it.bandBox;
      if (b && pt[0] >= b[0] && pt[0] <= b[2] && pt[1] >= b[1] && pt[1] <= b[3]) return it.key;
    }
    return null;
  }
  let hlId = null, hlRow = null;
  function renderHl() {
    const it = hlId && ITEM(hlId);
    $('hl').innerHTML = it && it.x != null
      ? `<circle class="hl-ring" cx="${it.x}" cy="${it.y}" r="${13 / kOf()}"/>` : '';
  }

  // ---------- パネルのスロット(PC = 2 列 + 地図 / スマホ = シート 1 枚) ----------
  const isPhone = () => window.innerWidth <= 720;
  const PC_BOTH = 1280;
  const sheet = $('sheet'), sheetSlot = $('sheetSlot'), stash = $('stash');
  const PAN = { spotList: $('pSpotList'), spotDet: $('pSpotDet'), eventList: $('pEventList'), eventDet: $('pEventDet') };
  const PBODY = { spotList: $('spotBody'), spotDet: $('spotDetBody'), eventList: $('eventBody'), eventDet: $('eventDetBody') };
  const PSLOT = { spotList: $('slotSpotList'), spotDet: $('slotSpotDet'), eventList: $('slotEventList'), eventDet: $('slotEventDet') };
  const COLOF = { spotList: 'spot', spotDet: 'spot', eventList: 'event', eventDet: 'event' };
  const COL = { spot: $('colSpot'), event: $('colEvent') };
  const scrollMem = { spotList: 0, spotDet: 0, eventList: 0, eventDet: 0 };
  const det = { spot: false, event: false };
  const folded = { spot: false, event: false };
  const foldMode = { spot: 'auto', event: 'open' };
  let sheetCur = null, backTo = null, lastList = 'spotList';
  let sheetMode = 'half', listMode = 'full';

  function place(key, parent) {
    const p = PAN[key];
    if (p.parentElement === parent) return;
    if (p.parentElement !== stash) scrollMem[key] = PBODY[key].scrollTop;
    parent.appendChild(p);
    if (parent !== stash) PBODY[key].scrollTop = scrollMem[key];
  }
  function autoFold() {
    const w = window.innerWidth;
    folded.spot = foldMode.spot === 'auto' ? w < PC_BOTH : foldMode.spot === 'closed';
    folded.event = foldMode.event === 'auto' ? false : foldMode.event === 'closed';
  }
  /** 日付と Spot/Event の切替の置き場所。
      PC = 日付はヘッダー・切替は出さない / スマホ = 2 段目の行(ヘッダーの sticky に隠れないため)。

  function syncBars() {

      if (!sub.length && filt.day === 'all' && !D.events.some((e) => e.date === d)) return '';
      return `<div class="sech">${MD(d)}(${WD[wdayOf(d)]})<small>${sub.length}</small></div>`
        + (sub.length ? sub.map(renderEventRow).join('') : '<p class="status">この日のイベントはありません。</p>');
    }).join('') || '<p class="status">条件に合う Event がありません。</p>';
  }
  $('spotBody').addEventListener('click', (e) => {
    if (e.target.closest('.sech')) return;
    const r = e.target.closest('.erow'); if (!r) return;
    const sp = SPOT_BY_ID[r.dataset.spot]; if (!sp) return;
    hlId = sp.id; hlRow = sp.id;
    if (inArea(sp) && corner !== sp.area) enterArea(sp.area);
    openSpotDetail(sp.id, true);
    M.st.touched = true;
    if (sp.x != null) centerOn(sp.x, sp.y, Math.max(kOf(), 0.4));
    renderHl(); renderLists(); scrollToHl();
  });
  $('eventBody').addEventListener('click', (e) => {
    if (e.target.closest('.sech')) return;
    const r = e.target.closest('.row-item'); if (!r) return;
    const ev = EVENT_BY_ID[r.dataset.event]; if (!ev) return;
    hlId = ev.id; hlRow = ev.id;
    if (inArea(ev) && corner !== ev.area) enterArea(ev.area);
    openEventDetail(ev.id, true);
    M.st.touched = true;
    if (ev.x != null) centerOn(ev.x, ev.y, Math.max(kOf(), 0.4));
    renderHl();
  });
  function syncCounts() {
    const ns = spotRows().length, ne = eventRows().length;
    $('cntSpot').textContent = ns; $('cntEvent').textContent = ne;
    $('spotCount').textContent = `${ns}件`; $('eventCount').textContent = `${ne}件`;
    $('fsCount').textContent = ns;
    // 見出しは「閉じているパネル」でも更新する(日付を変えたのに見出しが古いまま、を避ける)
    $('spotCond').textContent = spotCondNames().join(' · ');
    const ep = [];
    if (filt.day !== 'all') ep.push(MD(filt.day));
    if (filt.wantOnly) ep.push('行きたい');
    if (filt.q) ep.push(`検索「${filt.q}」`);
    $('eventCond').textContent = ep.length ? 'Event · ' + ep.join(' · ') : 'Event';
  }
  function renderLists() { renderSpotList(); renderEventList(); syncCounts(); syncAreaLabels(); syncLegendWho(); }

  // ---------- List の文字絞り込み ----------
  const FIND = {
    spot: { inp: $('spotFind'), wrap: $('spotFindWrap'), apply: () => refresh() },
    event: { inp: $('eventFind'), wrap: $('eventFindWrap'), apply: () => refresh() },
  };
  function setListQ(kind, v) {
    LQ[kind] = String(v || '');
    LQN[kind] = nrm(LQ[kind].trim());
    if (FIND[kind].inp.value !== LQ[kind]) FIND[kind].inp.value = LQ[kind];
    FIND[kind].wrap.querySelector('.lfx').hidden = !LQ[kind];
    FIND[kind].apply();
  }
  Object.keys(FIND).forEach((kind) => {
    FIND[kind].inp.addEventListener('input', (e) => setListQ(kind, e.target.value));
    FIND[kind].inp.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); setListQ(kind, ''); }
      if (e.key === 'Enter') e.preventDefault();
    });
  });

  // ---------- Spot の絞り込み(エリア・予算・予約・所要) ----------
  const sfRows = [];
  function chipRow(el, vals, label, set, noneLabel) {
    el.innerHTML = `<button class="chip mini exf-tg" type="button" aria-expanded="false">${esc(label)}<span class="n" hidden></span><span class="ar">▾</span></button>`
      + vals.map(([v, l, n]) => `<button class="chip mini" data-v="${esc(v)}" aria-pressed="false">${esc(l)}<small>${n}</small></button>`).join('')
      + (noneLabel ? `<button class="chip mini" data-v="${NONE}" aria-pressed="false">${esc(noneLabel)}</button>` : '');
    const tg = el.firstElementChild, chips = [...el.querySelectorAll('.chip[data-v]')];
    let open = false;
    el.classList.add('clps');
    const order = () => { const sel = chips.filter((c) => set.has(c.dataset.v)); el.append(tg, ...sel, ...chips.filter((c) => !set.has(c.dataset.v))); };
    function sync() { const n = tg.querySelector('.n'); n.textContent = set.size; n.hidden = !set.size; if (!open) order(); }
    tg.addEventListener('click', () => {
      open = !open; el.classList.toggle('clps', !open);
      tg.setAttribute('aria-expanded', open); tg.querySelector('.ar').textContent = open ? '▴' : '▾';
      if (!open) order();
    });
    el.addEventListener('click', (e) => {
      const c = e.target.closest('.chip[data-v]'); if (!c) return;
      const v = c.dataset.v; set.has(v) ? set.delete(v) : set.add(v);
      c.setAttribute('aria-pressed', set.has(v)); sync(); spotChanged();
    });
    sfRows.push(sync);
  }
  const countBy = (fn, v) => D.spots.filter((s) => fn(s) === v).length;
  chipRow($('areaChips'), AREA_KEYS.concat(['その他']).map((k) => [k, areaLabel(k), D.spots.filter((s) => s.area === k).length]), 'エリア', sf.area, '');
  chipRow($('budgetChips'), BUDGETS.filter((v) => countBy(budgetKey, v)).map((v) => [v, v, countBy(budgetKey, v)]), '予算', sf.budget, '予算未記載');
  chipRow($('resvChips'), ['不要', '予約可', '推奨', '当日券', '要予約'].filter((v) => countBy(resvKey, v)).map((v) => [v, v, countBy(resvKey, v)]), '予約', sf.resv, '予約未記載');
  chipRow($('durChips'), DURS.filter((v) => countBy(durKey, v)).map((v) => [v, v, countBy(durKey, v)]), '所要', sf.dur, '所要未記載');
  $('spotClear').addEventListener('click', () => {
    [sf.area, sf.budget, sf.resv, sf.dur].forEach((s) => s.clear());
    $('spotFilters').querySelectorAll('.chip[data-v]').forEach((c) => c.setAttribute('aria-pressed', 'false'));
    sfRows.forEach((f) => f()); spotChanged();
  });
  const sfCount = () => sf.area.size + sf.budget.size + sf.resv.size + sf.dur.size;
  function spotChanged() {
    $('spotClearRow').hidden = !sfCount();
    const n = $('spotFilterN'); n.textContent = sfCount(); n.hidden = !sfCount();
    const sum = spotCondNames().slice(1).join(' · ');
    $('sfSum').textContent = sum; $('sfSumRow').hidden = !sum;
    refresh();
  }
  function measureChipLine() {
    const tg = $('areaChips').firstElementChild;
    if (tg && tg.offsetHeight) $('spotFilters').style.setProperty('--chipline', tg.offsetHeight + 'px');
  }
  const fsheet = $('fsheet'), sfEl = $('spotFilters');
  function openFilterSheet() {
    if (!isPhone()) { measureChipLine(); return; }
    $('fsBody').appendChild(sfEl);
    fsheet.classList.add('open'); spotChanged();
  }
  function closeFilterSheet() {
    if (!fsheet.classList.contains('open')) return;
    fsheet.classList.remove('open');
    $('pSpotList').querySelector('.phead').appendChild(sfEl);
  }
  $('fsClose').addEventListener('click', closeFilterSheet);
  $('fsClear').addEventListener('click', () => $('spotClear').click());

  // ---------- ヘッダー・チップ行 ----------
  const genreChips = [...document.querySelectorAll('.chip[data-genre]')];
  function setGenres(gs) {
    filt.genres = new Set(gs);
    const all = filt.genres.size === CONFIG.GENRES.length;
    genreChips.forEach((c) => c.setAttribute('aria-pressed', !all && filt.genres.has(c.dataset.genre)));
  }
  genreChips.forEach((c) => c.addEventListener('click', () => {
    const sole = filt.genres.size === 1 && filt.genres.has(c.dataset.genre);
    if (isPhone() && sole && sheetCur === 'spotList') { closeSheet(); return; }
    setGenres(sole ? CONFIG.GENRES : [c.dataset.genre]);
    showList('spot'); refresh();
  }));
  $('spotChip').addEventListener('click', () => { if (sheetCur === 'spotList') { closeSheet(); return; } showList('spot'); refresh(); });
  $('eventChip').addEventListener('click', () => { if (sheetCur === 'eventList') { closeSheet(); return; } showList('event'); refresh(); });
  $('wantBtn').addEventListener('click', () => {
    filt.wantOnly = !filt.wantOnly;
    $('wantBtn').setAttribute('aria-pressed', String(filt.wantOnly));
    if (isPhone() && !sheetCur) showList(lastList.replace(/List$/, ''));
    refresh();
  });
  // 日付: Event を絞り、Spot は営業日で絞る
  function setDay(d) {
    filt.day = d;
    $('dateSeg').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.day === d)));
    syncDayTabs();
    refresh();
  }
  $('dateSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-day]'); if (b) setDay(b.dataset.day); });
  function syncDayTabs() {
    $('dayTabs').innerHTML = ['all'].concat(D.meta.days).map((d) => {
      const n = d === 'all' ? D.events.length : D.events.filter((e) => e.date === d).length;
      return `<button class="chip mini" type="button" data-day="${d}" aria-pressed="${d === filt.day}">${d === 'all' ? '全部' : MD(d)}<small>${n}</small></button>`;
    }).join('');
  }
  $('dayTabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-day]'); if (b) setDay(b.dataset.day); });

  $('search').addEventListener('input', (e) => setSearch(e.target.value, true));
  function setSearch(v, typed) {
    if (!typed) $('search').value = v;
    filt.q = String(v).trim();
    filt.qn = nrm(filt.q);
    $('searchBtn').setAttribute('aria-pressed', String(!!filt.q));
    if (!filt.q) { hlId = null; renderHl(); }
    refresh(); renderHits();
  }
  const bar = $('bar'), srow = $('srow'), searchEl = $('search');
  function startSearch() {
    if (!isPhone()) { searchEl.focus(); return; }
    srow.insertBefore(searchEl, $('searchClose'));
    srow.hidden = false;
    searchEl.focus(); renderHits();
  }
  function endSearch() {
    if (srow.hidden) return;
    srow.hidden = true;
    bar.insertBefore(searchEl, $('barR'));
    hits.classList.remove('open');
  }
  $('searchBtn').addEventListener('click', startSearch);
  $('searchClose').addEventListener('click', endSearch);

  const hud = $('hud');
  hud.innerHTML = `<button class="btn small" data-fit="1">全体</button>` + AREA_KEYS.map((k) => `<button class="btn small" data-goarea="${k}">${esc(AREA[k].label)}</button>`).join('');
  function syncFitLabel() { const b = document.querySelector('#hud .btn[data-fit]'); if (b) b.textContent = corner ? 'エリア全体' : '全体'; }
  hud.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.fit) { hlId = null; renderHl(); M.st.touched = false; fit(); return; }
    if (b.dataset.goarea) enterArea(b.dataset.goarea);
  });

  function syncLegendWho() {
    $('legendWho').innerHTML = whoList().map((w) => `<div class="row"><span class="ring" style="--c:${whoColor(w)}"></span><span>${esc(short(w, 10))}</span></div>`).join('');
  }
  // 凡例は PC だと地図の 1 割を覆うので既定で畳む(帰属表示と取っ手だけ残す)。スマホは 1 行の帯のまま
  (() => {
    const lg = $('legend'), btn = $('legendToggle');
    const sync = () => {
      const open = !lg.classList.contains('collapsed');
      btn.textContent = open ? '凡例 ▴' : '凡例 ▾';
      btn.setAttribute('aria-expanded', String(open));
      syncHandle();
    };
    lg.classList.add('collapsed');   // 既定は畳む(地図を広く使う)。帰属表示と取っ手は常に出る
    btn.addEventListener('click', () => { lg.classList.toggle('collapsed'); sync(); });
    window.addEventListener('resize', sync);
    sync();
  })();
  function refresh() { buildGroups(); renderMarkers(); renderLists(); reopenDetail(); }

  // ---------- 名前(Want の主体。自由入力) ----------
  let booted = false, nameConfirm = false;
  function reopenDetail() {
    if (curSpot && panelOpen('spotDet')) fillSpotDet(curSpot);
    if (curEvent && panelOpen('eventDet')) fillEventDet(curEvent);
  }
  function bootLists() {
    if (booted) return; booted = true;
    if (isPhone()) { sheetCur = 'spotList'; lastList = 'spotList'; sheetMode = listMode = 'full'; }
    layout(); spotChanged(); measureChipLine();
  }
  function knownNames() {
    return [...new Set(state.roster.concat(Object.keys(state.wants)))].filter(Boolean);
  }
  function setWho(name) {
    state.me = name;
    if (!state.roster.includes(name)) state.roster.push(name);
    if (!state.wants[name]) state.wants[name] = [];
    saveLocal();
    $('whoName').textContent = short(name, 10);
    $('whoBtn').style.setProperty('--c', whoColor(name));
    $('whoClose').hidden = false;
    $('whoModal').classList.remove('open');
    pushRoster(); pushRemote(name); ensureSubscribed([name]);
    refresh(); bootLists();
  }
  function openWho() {
    const me = state.me;
    $('whoTitle').textContent = me ? '名前を変える' : '名前を入れてください';
    $('nameInput').value = me || '';
    $('nameWarn').hidden = true; nameConfirm = false;
    $('nameOk').textContent = '決定';
    $('whoClose').hidden = !me;
    $('copyLink').hidden = !me;
    $('codeShare').hidden = !me || syncLive;
    $('myCode').value = me ? myCode() : '';
    $('whoModal').classList.add('open');
    setTimeout(() => { try { $('nameInput').focus(); } catch (e) {} }, 30);
  }
  function tryName() {
    const raw = $('nameInput').value.trim();
    const warn = $('nameWarn');
    if (!raw || [...raw].length > CONFIG.NAME_MAX) {
      warn.textContent = `名前は 1〜${CONFIG.NAME_MAX} 文字で入れてください。`; warn.hidden = false; nameConfirm = false; return;
    }
    if (/[.$#\[\]\/]/.test(raw)) {
      warn.textContent = '名前に . $ # [ ] / は使えません。'; warn.hidden = false; nameConfirm = false; return;
    }
    if (!nameConfirm && raw !== state.me && knownNames().includes(raw)) {
      warn.textContent = 'この名前はすでに使われています。同じ名前にすると印が混ざります。もう一度押すとこのまま使います。';
      warn.hidden = false; nameConfirm = true; $('nameOk').textContent = 'このまま使う'; return;
    }
    warn.hidden = true; nameConfirm = false; $('nameOk').textContent = '決定';
    setWho(raw);
  }
  $('nameOk').addEventListener('click', tryName);
  $('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tryName(); } });
  $('nameInput').addEventListener('input', () => { nameConfirm = false; $('nameOk').textContent = '決定'; $('nameWarn').hidden = true; });
  $('whoBtn').addEventListener('click', openWho);
  $('whoClose').addEventListener('click', () => $('whoModal').classList.remove('open'));

  // ---------- 共有コード(Artifact 版) ----------
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))));
  function myCode() { return enc({ v: 1, who: state.me, ids: state.wants[state.me] || [] }); }
  function importCode(code) {
    const o = dec(String(code).trim());
    if (!o || !o.who || !Array.isArray(o.ids)) throw new Error('bad');
    state.wants[o.who] = [...new Set(o.ids)];
    if (!state.roster.includes(o.who)) state.roster.push(o.who);
    saveLocal(); refresh();
    return o;
  }
  $('copyCode').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('myCode').value); $('copyCode').textContent = 'コピーしました'; setTimeout(() => $('copyCode').textContent = 'コードをコピー', 1500); }
    catch (e) { $('myCode').select(); }
  });
  function shareUrl() { return location.href.split('#')[0] + (roomKey ? '#r=' + roomKey : ''); }
  $('copyLink').addEventListener('click', async () => {
    if ($('copyLink').disabled) return;
    const url = shareUrl();
    try { await navigator.clipboard.writeText(url); $('copyLink').textContent = 'コピーしました'; setTimeout(() => $('copyLink').textContent = 'リンクをコピー', 1500); }
    catch (e) { $('syncStatus').textContent = url; }
  });
  $('importCode').addEventListener('click', () => {
    try { const o = importCode($('theirCode').value); $('theirCode').value = ''; $('syncStatus').textContent = `${o.who} の「行きたい」${o.ids.length}件を取り込みました。`; }
    catch (e) { $('syncStatus').textContent = 'コードを読めませんでした。全体を貼り付けてください。'; }
  });
  const hm = /[#&]w=([A-Za-z0-9_-]+)/.exec(HASH);
  if (hm) { try { const o = importCode(hm[1]); $('syncStatus').textContent = `リンクから ${o.who} の「行きたい」を取り込みました。`; } catch (e) {} }

  // ---------- 同期(Pages 版: sync.js + Firebase) ----------
  let sync = null, roomKey = null, syncLive = false, subscribed = new Set();
  function pushRemote(who) { if (sync && who) sync.push(who, state.wants[who] || []); }
  function pushRoster() { if (sync) sync.push(CONFIG.ROSTER, state.roster); }
  function applyRemote(who, ids) {
    if (!who || who === CONFIG.ROSTER || !Array.isArray(ids)) return;
    ids = [...new Set(ids)];
    if (JSON.stringify(ids) === JSON.stringify(state.wants[who] || [])) return;
    state.wants[who] = ids;
    if (!state.roster.includes(who)) state.roster.push(who);
    saveLocal(); refresh();
  }
  function applyRoster(names) {
    if (!Array.isArray(names)) return;
    const add = names.filter((n) => typeof n === 'string' && n && !state.roster.includes(n));
    if (add.length) { state.roster = state.roster.concat(add); saveLocal(); refresh(); }
    ensureSubscribed(names.filter((n) => typeof n === 'string' && n));
  }
  function setStatus(text, live) { $('syncStatus').textContent = text; $('syncDot').hidden = !live; $('syncStatus').classList.toggle('on', !!live); }
  function setSyncAvail(on) {
    syncLive = !!on;
    $('codeShare').hidden = !!on || !state.me;
    $('copyLink').disabled = !on;
  }
  /** sync.js は購読する名前の一覧を start のときに受け取る。名前は自由入力なので、
      同期データの `__names`(= 名前の一覧)から新しい名前が来たら、その名前も足して開き直す。
      Firebase の initializeApp は同じ設定なら既存のアプリを返すので、開き直しても安全。 */
  function startSync(names) {
    if (!FB || !window.SharedSync) return;
    const people = [...new Set([CONFIG.ROSTER].concat(names).filter(Boolean))];
    sync = window.SharedSync.start({
      config: FB, people, storageKey: CONFIG.ROOM_LS, hashParam: CONFIG.HASH_PARAM, path: 'wants', hash: HASH,
      onRemote: (who, ids) => (who === CONFIG.ROSTER ? applyRoster(ids) : applyRemote(who, ids)),
      getLocal: (who) => (who === CONFIG.ROSTER ? state.roster : (who === state.me ? (state.wants[who] || []) : null)),
      onStatus: setStatus,
      strings: { noKey: '同期リンク(#r= 付き)で開いてください。幹事から受け取ったリンクです' },
    });
    roomKey = sync.key;
    subscribed = new Set(people);
    setSyncAvail(sync.live);
  }
  function ensureSubscribed(names) {
    if (!sync || !sync.live) return;
    const add = (names || []).filter((n) => n && !subscribed.has(n));
    if (!add.length) return;
    startSync([...subscribed, ...add]);
  }
  setSyncAvail(false);
  if (FB && window.SharedSync) startSync(knownNames().concat(state.me ? [state.me] : []));
  else if (FB) setStatus('同期スクリプト(sync.js)を読み込めませんでした。共有コードを使ってください。', false);
  else setStatus('このページでは自動同期できません。共有コードで送り合ってください。', false);

  // ---------- boot ----------
  buildGroups();
  setDay('all');
  syncAreaHead();
  syncFitLabel();
  layout();
  spotChanged();
  unscroll();
  fit();
  if (state.me) setWho(state.me); else openWho();
  const am = /(?:^|&)a=([\w-]+)/.exec(HASH.replace(/^#/, ''));
  if (am && AREA[am[1]]) enterArea(am[1], { push: false });
  requestAnimationFrame(() => { fit(); measureChipLine(); });
})();

</script>
